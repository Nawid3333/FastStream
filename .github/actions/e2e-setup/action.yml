name: e2e setup
description: >-
  What every e2e job needs besides the checkout and its dependencies: ffmpeg, the MP4
  fixture (kept in the Actions cache), a sound device on Linux (a PulseAudio null sink),
  the e2e ports kept out of Linux's ephemeral range, and the Firefox to test, exported as
  FIREFOX_BINARY for the wdio configs. Used by ci.yml (Linux and Windows),
  firefox-beta.yml, firefox-stable.yml and live-streams.yml, which each carried their own
  copy before. The downloads come from Chocolatey, apt and Mozilla; each is tried again
  before the job fails, because a hiccup there is not a FastStream failure. ffmpeg on
  Windows comes from the Actions cache, a week at a time.

inputs:
  firefox-version:
    description: What browser-actions/setup-firefox installs - latest, latest-beta, or a version.
    default: latest

outputs:
  firefox-path:
    description: The Firefox binary the e2e suites use.
    value: ${{ steps.firefox.outputs.firefox-path || steps.firefox-again.outputs.firefox-path }}
  firefox-version:
    description: Its version.
    value: ${{ steps.firefox.outputs.firefox-version || steps.firefox-again.outputs.firefox-version }}

runs:
  using: composite
  steps:
    # Windows: ffmpeg (and ffprobe) from the Actions cache, a week at a time. Chocolatey
    # took 23 s a job, most of it unpacking its 7z (CI run 37382065299), and a run has nine
    # Windows e2e jobs. The key is the ISO week, so a newer ffmpeg arrives within a week:
    # the jobs that miss install it through Chocolatey as before, and the first to finish
    # saves it (the others are refused the same key, a warning). Linux keeps apt: Firefox
    # decodes through the system's libavcodec, not a program in a folder.
    - name: This week's ffmpeg cache key
      if: runner.os == 'Windows'
      id: ffmpeg-key
      shell: bash
      run: echo "key=e2e-ffmpeg-windows-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    - name: Restore ffmpeg from the cache
      if: runner.os == 'Windows'
      id: ffmpeg-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/ffmpeg-e2e
        key: ${{ steps.ffmpeg-key.outputs.key }}

    # Linux: Firefox decodes H.264/AAC through the system ffmpeg; without it every stream
    # loads and never reaches HAVE_CURRENT_DATA, which looks exactly like a broken media
    # library. PulseAudio, for the sound step below, comes in the same apt run, and no
    # package is installed only because one of these recommends it: the 105 MB ffmpeg
    # pulled in took 29 s. Windows: the e2e setup builds its video fixtures with ffmpeg,
    # and specs run ffmpeg and ffprobe; the image has Chocolatey but no ffmpeg.
    - name: Install ffmpeg
      id: ffmpeg
      shell: bash
      env:
        CACHE_HIT: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
      run: |
        set -uo pipefail
        cached="$HOME/ffmpeg-e2e"
        if [ "$RUNNER_OS" = Windows ] && [ "$CACHE_HIT" = true ] && [ -f "$cached/ffmpeg.exe" ] && [ -f "$cached/ffprobe.exe" ]; then
          echo "ffmpeg from the cache ($cached)."
        else
          for attempt in 1 2 3; do
            if [ "$RUNNER_OS" = Windows ]; then
              choco install ffmpeg -y --no-progress && break
            else
              sudo apt-get update &&
                sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio pulseaudio-utils && break
            fi
            echo "::warning::Installing ffmpeg failed (attempt $attempt of 3); trying again in 30 s."
            sleep 30
          done
          if [ "$RUNNER_OS" = Windows ]; then
            # The programs themselves for the cache, not Chocolatey's shims to them, from where
            # Chocolatey is (ChocolateyInstall, on the runner C:\ProgramData\chocolatey).
            # -quit, not head: head would close the pipe early, and pipefail fail the step.
            lib="$(cygpath -u "${ChocolateyInstall:-C:/ProgramData/chocolatey}")/lib/ffmpeg"
            bin=$(dirname "$(find "$lib" -name ffmpeg.exe -path '*/bin/*' -print -quit 2> /dev/null)")
            if [ -f "$bin/ffmpeg.exe" ] && [ -f "$bin/ffprobe.exe" ]; then
              mkdir -p "$cached" && cp "$bin/ffmpeg.exe" "$bin/ffprobe.exe" "$cached/" &&
                echo "save=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Chocolatey's ffmpeg.exe and ffprobe.exe were not found in its lib/ffmpeg folder; nothing is cached, its shims are used."
            fi
          fi
        fi
        if [ "$RUNNER_OS" = Windows ] && [ -f "$cached/ffmpeg.exe" ]; then
          cygpath -w "$cached" >> "$GITHUB_PATH"
          export PATH="$cached:$PATH"
        fi
        # sed, not head: head would close the pipe early, and pipefail fail the step.
        ffmpeg -hide_banner -version | sed -n 1p

    - name: Save ffmpeg to the cache
      if: runner.os == 'Windows' && steps.ffmpeg.outputs.save == 'true'
      # Jobs that missed the same week race to save it; a refused save fails no job.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/ffmpeg-e2e
        key: ${{ steps.ffmpeg-key.outputs.key }}

    # sample.mp4, which every e2e fixture is made from, comes from test-videos.co.uk, which
    # CI cannot count on (#256). It is kept in the Actions cache under the SHA-256 it is
    # pinned to (tests/e2e/mp4Fixture.mjs, MP4_FIXTURE_PIN), so a job fetches it only when
    # no cache has it. A restored file is checked against the pin like a fetched one, and
    # fetched again when it is another file; only a checked file is saved.
    - name: Read the MP4 fixture's pin
      id: mp4-pin
      shell: bash
      run: |
        sha256=$(node tests/e2e/mp4FixtureCli.mjs pin)
        echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
        echo "sample.mp4 is pinned to SHA-256 $sha256"

    - name: Restore the MP4 fixture from the cache
      id: mp4-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/e2e/fixtures/sample.mp4
        key: e2e-sample-mp4-${{ steps.mp4-pin.outputs.sha256 }}

    - name: Check the MP4 fixture, or fetch it
      shell: bash
      run: node tests/e2e/mp4FixtureCli.mjs ensure

    - name: Save the MP4 fixture to the cache
      if: steps.mp4-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/e2e/fixtures/sample.mp4
        key: e2e-sample-mp4-${{ steps.mp4-pin.outputs.sha256 }}

    # Firefox needs an audio device for the specs that listen to the player (firefox.e2e's
    # 8x pin, audio-tools): without one its AudioContext never starts and they could only
    # skip, as they did on every CI job (#265). GitHub's Ubuntu images have no sound server,
    # so the job starts PulseAudio with a null sink, a device that plays into nothing, and
    # those specs fail on Linux CI without sound (tests/e2e/soundCheck.mjs). The daemon is
    # the job's: the runner ends it with the job's other processes. Windows' runner has no
    # audio endpoint (its AudioContext stays "suspended") and keeps skipping.
    - name: Give Firefox a sound device
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -uo pipefail
        sink=faststream_e2e
        if pactl info > /dev/null 2>&1; then
          echo 'A sound server is running already; using it.'
        else
          if ! command -v pulseaudio > /dev/null || ! command -v pactl > /dev/null; then
            for attempt in 1 2 3; do
              sudo apt-get update && sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils && break
              echo "::warning::Installing PulseAudio failed (attempt $attempt of 3); trying again in 30 s."
              sleep 30
            done
          fi
          # No idle exit: nothing plays until the specs start, minutes from now.
          if ! pulseaudio --start --exit-idle-time=-1; then
            echo '::error::PulseAudio did not start. Without a sound device the specs that listen to the player fail on Linux CI (tests/e2e/soundCheck.mjs).'
            exit 1
          fi
        fi
        if ! pactl load-module module-null-sink "sink_name=$sink" 'sink_properties=device.description=FastStream-e2e' > /dev/null; then
          echo "::error::PulseAudio would not load the null sink $sink."
          pactl info || true
          exit 1
        fi
        pactl set-default-sink "$sink"
        # Firefox, which geckodriver starts from the wdio worker, finds the server by this.
        server=$(pactl info | sed -n 's/^Server String: //p')
        if [ -z "$server" ]; then
          echo '::error::pactl info names no server.'
          pactl info || true
          exit 1
        fi
        case "$server" in
          /*) server="unix:$server" ;;
        esac
        echo "PULSE_SERVER=$server" >> "$GITHUB_ENV"
        echo "E2E_SOUND_SINK=$sink" >> "$GITHUB_ENV"
        echo "Firefox plays into the null sink $sink, on $server:"
        pactl info
        pactl list short sinks

    # The e2e servers listen on fixed ports from 41800 to 41999 (tests/unit/e2ePorts keeps
    # them there), inside the range Linux hands out to outgoing connections, 32768 to 60999.
    # A connection that happens to get a test's port makes that server's listen() fail with
    # EADDRINUSE (mpv-suspend's 41996 on PR #40); reserved ports are never handed out.
    # Windows hands out 49152-65535 and needs nothing.
    - name: Keep the e2e ports out of the ephemeral range
      if: runner.os == 'Linux'
      shell: bash
      run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=41800-41999

    # The Firefox asked for, not whatever release the runner image carries (the Windows
    # image had 155.0.1 when 156.0.1 was out).
    - name: Install Firefox ${{ inputs.firefox-version }}
      id: firefox
      continue-on-error: true
      uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
      with:
        firefox-version: ${{ inputs.firefox-version }}

    - name: Install Firefox ${{ inputs.firefox-version }}, second try
      id: firefox-again
      if: steps.firefox.outcome == 'failure'
      uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
      with:
        firefox-version: ${{ inputs.firefox-version }}

    - name: Use it for the e2e suites
      shell: bash
      env:
        FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path || steps.firefox-again.outputs.firefox-path }}
        FIREFOX_VERSION: ${{ steps.firefox.outputs.firefox-version || steps.firefox-again.outputs.firefox-version }}
      run: |
        echo "FIREFOX_BINARY=$FIREFOX_PATH" >> "$GITHUB_ENV"
        # Not "firefox --version": firefox.exe does not print it to a console on Windows.
        echo "Firefox $FIREFOX_VERSION at $FIREFOX_PATH"

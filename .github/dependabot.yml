# Dependabot configuration for the npm (pnpm) dependencies and the workflow actions.
#
# Note: You must also enable Dependabot in the repository settings
# (Settings > Code security > Dependabot alerts/version updates).
#
# A merge to main is a release (auto-release.yml) when it changes what the
# extension ships - a vendored library such as fuse.js does, a test or build tool
# does not and merges without one. Minor and patch updates are grouped into one
# PR per week; a major update still gets a PR of its own, because it is a
# decision rather than routine.
#
# What happens to each PR once CI has run is update-prs.yml's job: it reports, and nothing
# merges itself (the owner's choice, 2026-10-02: every PR waits for his merge). A red one
# is reported to the owner; a green one is called ready to merge when it changes only
# package.json and pnpm-lock.yaml and adds no package version under 3 days old (a security
# fix aside). A tooling update must also leave the built extension identical to the latest
# release, so it
# releases nothing. The libraries the extension ships (tools/sync-vendor.mjs copies them
# into it) are grouped apart, in shipped-minor-and-patch: merging that PR starts CI on
# main, and a green run there releases it. update-prs.yml tells that group by its branch,
# which Dependabot names after it: a rename here must be made there too. A major comes on
# a branch of its own: update-prs.yml tells a shipped library's by the patterns of
# shipped-minor-and-patch below, read from main.
#
# cooldown: a release is proposed once it is 3 days old (the owner's call, 2026-10-20; 5 days
# until 2026-10-11, then none). Green CI cannot see a compromised release - malware passes
# the tests - and most npm supply-chain compromises of 2025 were found and pulled within
# hours to days: a 3-day wait lets that happen before a release reaches the owner's merge
# (Renovate's best-practice preset waits 3 days for npm too). Dependabot applies no cooldown
# to security updates. The cooldown holds back only the packages Dependabot bumps, not what
# the new lockfile brings in with them: update-prs.yml checks those (3 days as well).
#
# open-pull-requests-limit: once an entry has that many pull requests open, Dependabot opens
# no more for it, and says nothing. security-alerts.yml's daily watch opens one issue,
# "Update pull requests piling up", when an entry reaches its limit minus 2 (at least 2).
#
# Security updates are separate from this file (Settings > Code security >
# Dependabot security updates) and still open a PR for any vulnerable package,
# including the fsaunpack tool, which has its own package-lock.json (and its own
# entry below for version updates).
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      # Keep in step with tools/sync-vendor.mjs: the unpatched libraries it copies.
      # The patched ones are ignored below. A new mediabunny must write files that read
      # back sample for sample (tests/e2e/specs/modules.e2e.mjs).
      shipped-minor-and-patch:
        patterns: ['fuse.js', 'mediabunny', 'sortablejs']
        update-types: ['minor', 'patch']
      # Stryker's packages come out together, and each requires the others at its own
      # version exactly (@stryker-mutator/vitest-runner's peerDependencies): one pull
      # request for all of them, majors included. Before tooling-minor-and-patch, which
      # would take them otherwise. While the vitest runner carries a patch, both are
      # ignored below and move together through the Patched libraries workflow.
      stryker:
        patterns: ['@stryker-mutator/*']
      # WebdriverIO's packages come out together and only work at the same version: one pull
      # request for all of them, majors included (10.0.0 came as four, each red alone,
      # 2026-10-10). Before tooling-minor-and-patch, which would take them otherwise.
      wdio:
        patterns: ['@wdio/*', 'webdriverio']
      tooling-minor-and-patch:
        exclude-patterns: ['fuse.js', 'mediabunny', 'sortablejs']
        update-types: ['minor', 'patch']
    # These libraries ship with a pnpm patch (pnpm-workspace.yaml,
    # patchedDependencies), and each patch is keyed to its exact version. A bump
    # leaves the patch unapplied and fails `pnpm install --frozen-lockfile`, so
    # a Dependabot PR for one of them could only ever be red. Their updates come
    # from the Patched libraries workflow instead, which re-cuts the patch with
    # tools/recut-patch.mjs and opens the pull request itself when that is clean
    # (docs/updating-patched-libraries.md). Keep this list in step with
    # patchedDependencies, and the packages that move with a patched one (LOCKSTEP in
    # tools/check-patched-updates.mjs: @stryker-mutator/core with the vitest runner, which
    # requires its exact version). When every change of a patch has landed upstream,
    # tools/recut-patch.mjs drops the patch and takes the library and those packages off
    # this list in the same pull request.
    ignore:
      - dependency-name: '@stryker-mutator/core'
      - dependency-name: '@stryker-mutator/vitest-runner'
      - dependency-name: 'Coloris'
      - dependency-name: 'dashjs'
      - dependency-name: 'gif.js'
      - dependency-name: 'hls.js'
      - dependency-name: 'mp4box'

  # fsaunpack: the helper that unpacks a saved .fsa archive and serves it with
  # express (fsaunpack/, its own package.json and package-lock.json). It is not
  # part of the extension. CI installs that lockfile and starts the test server on a
  # recorded archive (pnpm run verify:fsaunpack), with install scripts off. update-prs.yml
  # calls a PR ready to merge when it changes only fsaunpack/package.json and
  # fsaunpack/package-lock.json and every version that lockfile adds is 3 days old.
  - package-ecosystem: 'npm'
    directory: '/fsaunpack'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'

  # Workflow actions are pinned to a commit SHA with the version as a comment,
  # so a moved or hijacked tag cannot change what runs next to the AMO signing
  # keys. Nothing arrives on its own any more; Dependabot updates the SHA and
  # the comment together - minor and patch releases as one grouped PR a week, a
  # new major on its own. Like every update they wait for the owner's merge; they change
  # workflow files, so update-prs.yml brings their branch up to date with the owner's token,
  # UPDATE_PRS_TOKEN (docs/maintenance.md). (The actionlint image ci.yml runs is pinned by digest too, in
  # .github/actionlint/Dockerfile; the docker entry below updates it.)
  # '/' covers .github/workflows only; the composite actions (.github/actions/<name>,
  # e2e-setup's setup-firefox) need their own directory, or they are never updated.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    groups:
      actions-minor-and-patch:
        update-types: ['minor', 'patch']

  # The actionlint and zizmor images that ci.yml's workflows job runs (the WSL verify takes
  # actionlint and shellcheck from the first). Their tags and digests are in
  # .github/actionlint/Dockerfile and .github/zizmor/Dockerfile, because Dependabot does not
  # update a docker:// line in a workflow. A new version, or a new digest for the same tag,
  # is "ready to merge" in update-prs.yml once CI, which runs every workflow file through
  # it, is green.
  - package-ecosystem: 'docker'
    directories:
      - '/.github/actionlint'
      - '/.github/zizmor'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'

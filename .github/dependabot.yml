# Dependabot configuration for the npm (pnpm) dependencies and the workflow actions.
#
# Note: You must also enable Dependabot in the repository settings
# (Settings > Code security > Dependabot alerts/version updates).
#
# A merge to main is a release (auto-release.yml) when it changes what the
# extension ships - a vendored library such as pako does, a test or build tool
# does not and merges without one. Minor and patch updates are grouped into one
# PR per week; a major update still gets a PR of its own, because it is a
# decision rather than routine.
#
# What happens to each PR once CI has run is update-prs.yml's job: a red one is
# reported to the owner, a green one merged when it is routine - minor or patch,
# package.json and pnpm-lock.yaml only, and the built extension identical to the
# latest release, so nothing reaches Firefox - and otherwise handed to the owner.
# The libraries the extension ships (tools/sync-vendor.mjs copies them into it)
# are grouped apart for that reason, so a tooling update is not held back by one.
#
# cooldown: a release is proposed once it is 5 days old. A package taken over to
# publish malware is usually caught and pulled within days, and routine PRs now
# merge without anyone reading them. Security updates skip the wait.
#
# Security updates are separate from this file (Settings > Code security >
# Dependabot security updates) and still open a PR for any vulnerable package,
# including the fsaunpack tool, which has its own package-lock.json (and its own
# entry below for version updates).
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      # Keep in step with tools/sync-vendor.mjs: the unpatched libraries it copies.
      # The patched ones are ignored below.
      shipped-minor-and-patch:
        patterns: ['fuse.js', 'pako', 'sortablejs']
        update-types: ['minor', 'patch']
      tooling-minor-and-patch:
        exclude-patterns: ['fuse.js', 'pako', 'sortablejs']
        update-types: ['minor', 'patch']
    # These libraries ship with a pnpm patch (pnpm-workspace.yaml,
    # patchedDependencies), and each patch is keyed to its exact version. A bump
    # leaves the patch unapplied and fails `pnpm install --frozen-lockfile`, so
    # a Dependabot PR for one of them could only ever be red. Their updates come
    # from the Patched libraries workflow instead, which re-cuts the patch with
    # tools/recut-patch.mjs and opens the pull request itself when that is clean
    # (docs/updating-patched-libraries.md). Keep this list in step with
    # patchedDependencies.
    ignore:
      - dependency-name: 'Coloris'
      - dependency-name: 'dashjs'
      - dependency-name: 'gif.js'
      - dependency-name: 'hls.js'
      - dependency-name: 'jswebm'
      - dependency-name: 'mp4box'
      - dependency-name: 'sweetalert2'
      # Not patched, but tied to its version the same way: the voice detector runs a
      # custom reduced ONNX Runtime wasm built from a 1.20-era commit, and only
      # onnxruntime-web 1.20.0's loader (ort.wasm.mjs) fits it. #23 took 1.30.0 and
      # the VAD e2e test failed in the runtime. Moving it means rebuilding that wasm
      # (tools/reproduce-ort-wasm.sh; docs/vendored-libraries.md, "The VAD blobs").
      - dependency-name: 'onnxruntime-web'
      # Deprecated upstream (superseded by Mediabunny); 5.2.2 is its last release and
      # crashes finalizing a video track that received no frames, which 4.3.3 survives
      # and tests/e2e/specs/modules.e2e.mjs checks. Tried and reverted 2026-09-06, and
      # again as #25 on 2026-09-25 (docs/vendored-libraries.md). No newer version can
      # come, so there is nothing for Dependabot to offer; the way on is Mediabunny.
      - dependency-name: 'mp4-muxer'

  # fsaunpack: the helper that unpacks a saved .fsa archive and serves it with
  # express (fsaunpack/, its own package.json and package-lock.json). It is not
  # part of the extension. CI installs that lockfile and starts the test server on a
  # recorded archive (pnpm run verify:fsaunpack). Every update still waits for the
  # owner, by his choice: the helper runs on his PC, where npm runs install scripts.
  # update-prs.yml merges only PRs that change nothing but the root package.json and
  # pnpm-lock.yaml.
  - package-ecosystem: 'npm'
    directory: '/fsaunpack'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'

  # Workflow actions are pinned to a commit SHA with the version as a comment,
  # so a moved or hijacked tag cannot change what runs next to the AMO signing
  # keys. Nothing arrives on its own any more; Dependabot updates the SHA and
  # the comment together - minor and patch releases as one grouped PR a week, a
  # new major on its own. These always wait for the owner: they change workflow
  # files, which are reviewed by a person (and which a workflow's token may not
  # merge). (The actionlint image ci.yml runs is pinned by digest too, in
  # .github/actionlint/Dockerfile; the docker entry below updates it.)
  # '/' covers .github/workflows only; the composite actions (.github/actions/<name>,
  # e2e-setup's setup-firefox) need their own directory, or they are never updated.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    groups:
      actions-minor-and-patch:
        update-types: ['minor', 'patch']

  # The actionlint image that ci.yml's workflows job runs and the WSL verify takes
  # actionlint and shellcheck from. Its tag and digest are in .github/actionlint/Dockerfile,
  # because Dependabot does not update a docker:// line in a workflow. A new version, or
  # a new digest for the same tag, waits for the owner in update-prs.yml: it changes the
  # check every workflow file has to pass, and CI's checks are reviewed by a person.
  - package-ecosystem: 'docker'
    directory: '/.github/actionlint'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'

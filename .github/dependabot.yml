# Dependabot configuration for npm dependencies.
# Enables weekly dependency update PRs for package.json.
#
# Note: You must also enable Dependabot in the repository settings
# (Settings > Code security > Dependabot alerts/version updates).
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'

  # Workflow actions pin a major tag, so v7.x fixes arrive on their own but a
  # new major never does. Without this the pins simply rot. Dependabot opens
  # a PR when the next major lands, which is a decision rather than a
  # surprise.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'

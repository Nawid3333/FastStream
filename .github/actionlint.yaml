# Read by actionlint from here, in ci.yml's workflows job and in the WSL verify.
#
# GitHub's `vulnerability-alerts` permission (read the Dependabot alerts, which
# security-alerts.yml needs, and update-prs.yml since 2026-10-20: an update that fixes an
# open alert skips the 3-day wait) is newer than actionlint 1.7.12, the latest release; the
# request for it is rhysd/actionlint#666. Checked 2026-09-30: without it the token's
# request for the alerts is refused (HTTP 403), with it they are listed. Drop this once
# .github/actionlint/Dockerfile pins an actionlint that knows the permission.
paths:
  .github/workflows/security-alerts.yml:
    ignore:
      - 'unknown permission scope "vulnerability-alerts"'
  .github/workflows/update-prs.yml:
    ignore:
      - 'unknown permission scope "vulnerability-alerts"'

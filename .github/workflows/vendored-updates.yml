name: Vendored updates

# The vendored file no other workflow watches (U1):
#
#   chrome/player/modules/vtt.mjs - dash.js's contrib/videojs-vtt.js/vtt.js with the
#     changes tools/verify-vtt.mjs re-applies, pinned to a dash.js tag. When the newest
#     dash.js release changes that file, an issue "vtt.js changed in dash.js <tag>": the
#     changes may need re-deriving, so a person moves the pin.
#
# (Until 2026-10-22 a second job, sources, watched the adapted copies of other projects'
# code in tools/vendored-sources.json. Its last entry, StreamSaver.mjs, keeps only
# StreamSaver.js's API name: its body is FastStream's own OPFS and memory sinks, so an
# upstream change had nothing to port.)
#
# The issue is assigned to the owner and @mentions them. A title is never raised twice, open or
# closed: closing one skips that release for good. Each closes itself once its pin is at
# its tag or later, and a newer release's item closes the older ones. (The silero-vad model
# pull request went with the speech detector, 2026-10-10.)

on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions: {}  # each job asks for what it needs

concurrency:
  group: vendored-updates
  cancel-in-progress: false

jobs:
  vtt:
    name: Check dash.js for a changed vtt.js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # the checkout
      issues: write   # the "vtt.js changed" issue; this job's own failure
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      UPSTREAM: 'Dash-Industry-Forum/dash.js'
      VTT_PATH: 'contrib/videojs-vtt.js/vtt.js'
      PREFIX: 'vtt.js changed in dash.js '
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open the issue for a changed vtt.js
        run: |
          set -euo pipefail
          ge() { [ "$1" = "$2" ] || [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }

          pinned_tag=$(grep -oE 'Dash-Industry-Forum/dash\.js/v[0-9]+(\.[0-9]+)*/' tools/verify-vtt.mjs | head -n 1 | cut -d/ -f3)
          if [ -z "$pinned_tag" ]; then
            echo "tools/verify-vtt.mjs names no dash.js tag in the form this reads."
            exit 1
          fi
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          if ! [[ "$latest" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "$UPSTREAM's latest release is tagged '$latest', not a version."
            exit 1
          fi
          echo "Pinned: $pinned_tag. Latest release: $latest."
          title="$PREFIX$latest"

          gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null and .user.login == "github-actions[bot]" and (.title | startswith(env.PREFIX))) | [.number, .state, .title] | @tsv' \
            > "$RUNNER_TEMP/mine.tsv"

          # Closes each open issue whose release the pin has reached, and, once one for the
          # latest release exists ($1), every older one.
          close_pass() {
            while IFS=$'\t' read -r number state old; do
              [ "$state" = open ] || continue
              tag=${old#"$PREFIX"}
              if ge "$pinned_tag" "$tag"; then
                gh issue close "$number" --comment "tools/verify-vtt.mjs pins dash.js $pinned_tag now."
              elif [ -n "${1-}" ] && [ "$tag" != "$latest" ]; then
                gh issue close "$number" --reason 'not planned' --comment "dash.js $latest is out: $1 replaces this one."
              else
                continue
              fi
              echo "Closed #$number ($old)"
            done < "$RUNNER_TEMP/mine.tsv"
          }

          if [ "$latest" = "$pinned_tag" ] || ! ge "$latest" "$pinned_tag"; then
            echo "Nothing newer than the pin."
            close_pass
            exit 0
          fi
          if awk -F '\t' -v t="$title" '$3 == t {found = 1} END {exit !found}' "$RUNNER_TEMP/mine.tsv"; then
            echo "dash.js $latest was raised before."
            close_pass "the $latest issue"
            exit 0
          fi

          base="https://raw.githubusercontent.com/$UPSTREAM"
          code=$(curl -sS --max-time 60 -o "$RUNNER_TEMP/old.js" -w '%{http_code}' "$base/$pinned_tag/$VTT_PATH")
          if [ "$code" != 200 ]; then
            echo "$VTT_PATH at the pinned $pinned_tag answered HTTP $code."
            exit 1
          fi
          code=$(curl -sS --max-time 60 -o "$RUNNER_TEMP/new.js" -w '%{http_code}' "$base/$latest/$VTT_PATH")
          if [ "$code" = 200 ] && cmp -s "$RUNNER_TEMP/old.js" "$RUNNER_TEMP/new.js"; then
            echo "dash.js $latest has the same vtt.js, byte for byte: nothing to do."
            close_pass
            exit 0
          fi
          if [ "$code" = 200 ]; then
            change=$(diff "$RUNNER_TEMP/old.js" "$RUNNER_TEMP/new.js" | grep -c '^[<>]' || true)
            what="changes $change lines of it: https://github.com/$UPSTREAM/compare/$pinned_tag...$latest"
          elif [ "$code" = 404 ]; then
            what="no longer has it at $VTT_PATH"
          else
            echo "$VTT_PATH at $latest answered HTTP $code."
            exit 1
          fi
          # shellcheck disable=SC2016 # backticks are Markdown
          printf '@%s dash.js %s is out and %s.\n\n`chrome/player/modules/vtt.mjs` is that file at dash.js %s with the changes `tools/verify-vtt.mjs` re-applies. Move the tag in its UPSTREAM line to %s and run `pnpm run verify:vtt`: it says where a change no longer applies. This issue closes itself once the pin is at %s or later; closing it skips %s.\n' \
            "$OWNER" "$latest" "$what" "$pinned_tag" "$latest" "$latest" "$latest" > "$RUNNER_TEMP/body.md"
          url=$(gh issue create --title "$title" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md")
          echo "Opened $url"
          close_pass "$url"

      - name: Report the vtt.js job's own failure
        if: failure()
        env:
          TITLE: 'Vendored updates workflow failed (vtt.js)'
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s Failed again: %s\n' "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          printf '@%s vendored-updates.yml failed: %s\n\nThe run log names the failed command. Close this issue once it is fixed; a later failure opens a new one.\n' \
            "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

name: Firefox stable

# Tests each new stable Firefox as soon as it is out. firefox-beta.yml warns about the
# next release in advance; this checks the release itself, which is already on the
# maintainer's machine by the time it matters. Mozilla sends no notification, but
# publishes the current versions at product-details.mozilla.org, which this reads once
# a day (releases come out on Tuesdays in the two-week cycle, so a new one is tested by
# the next morning).
#
# Each version is tested once: after a green run its version is recorded as an Actions
# cache entry (firefox-stable-tested-<version>), and later runs find it and stop. The
# playback and installed-extension suites run against exactly that version. A failure
# opens one issue per version, assigned to the owner with an @mention; the next green
# run closes it. Run by hand to test the current stable again regardless.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: firefox-stable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Find the current stable Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tested: ${{ steps.tested.outputs.cache-hit }}
    steps:
      - name: Read the current stable version from Mozilla
        id: version
        run: |
          set -euo pipefail
          details=$(curl -fsS --retry 3 https://product-details.mozilla.org/1.0/firefox_versions.json)
          version=$(jq -r .LATEST_FIREFOX_VERSION <<< "$details")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9.]+$ ]]; then
            echo "::error::Unexpected stable version from Mozilla: '$version'"
            exit 1
          fi
          echo "Stable Firefox: $version (released $(jq -r .LAST_RELEASE_DATE <<< "$details"); next release $(jq -r .NEXT_RELEASE_DATE <<< "$details"))"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Already tested?
        id: tested
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .firefox-stable-tested
          key: firefox-stable-tested-${{ steps.version.outputs.version }}
          lookup-only: true

  e2e:
    name: e2e on Firefox ${{ needs.detect.outputs.version }} (${{ matrix.os }}, ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.os == 'windows-latest' && 3 || 2 }})
    needs: detect
    if: needs.detect.outputs.tested != 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Linux as in CI, and Windows, where FastStream is used and Firefox decodes
        # through Media Foundation instead of ffmpeg.
        os: [ubuntu-latest, windows-latest]
        # Each suite in groups of about the same running time, each group a job of its own,
        # side by side as in ci.yml (E2E_SHARD, tests/e2e/shardSpecs.mjs): three on
        # Windows, two on Linux. One job for both suites took 30 minutes on Windows (run
        # 37268302868); a job a suite, 15.
        suite: [playback, extension]
        shard: [1, 2, 3]
        exclude:
          - os: ubuntu-latest
            shard: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      E2E_SHARD: ${{ matrix.shard }}/${{ matrix.os == 'windows-latest' && 3 || 2 }}
    defaults:
      run:
        shell: bash
    steps:
      # The token is not kept in .git/config (persist-credentials: false): every later
      # step could read it there, dev dependencies' install scripts included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ffmpeg, the e2e ports reserved, and exactly this Firefox as FIREFOX_BINARY.
      - name: e2e setup
        uses: ./.github/actions/e2e-setup
        with:
          firefox-version: ${{ needs.detect.outputs.version }}

      - name: Build
        run: pnpm run build:keep

      - name: End-to-end playback
        if: matrix.suite == 'playback'
        run: pnpm run test:e2e

      - name: End-to-end extension tests
        if: matrix.suite == 'extension'
        run: pnpm run test:ext

      - name: Upload e2e failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-stable-e2e-logs-${{ matrix.os }}-${{ matrix.suite }}-${{ matrix.shard }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

  # Only once every platform has passed, so a version is never recorded as tested while
  # one of them still fails.
  record:
    name: Record the version as tested
    needs: [detect, e2e]
    if: needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the version as tested
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: echo "$VERSION" > .firefox-stable-tested

      - name: Remember it
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .firefox-stable-tested
          key: firefox-stable-tested-${{ needs.detect.outputs.version }}

  report:
    needs: [detect, e2e]
    if: always() && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or close the Firefox stable issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
          VERSION: ${{ needs.detect.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          prefix='Firefox stable breaks FastStream'
          if [ "$RESULT" = success ]; then
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
              --jq ".[] | select(.title | startswith(\"$prefix\")) | .number" |
            while read -r number; do
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Firefox $VERSION passes: $RUN_URL"
            done
            exit 0
          fi
          if [ "$RESULT" != failure ]; then
            echo "e2e result: $RESULT - nothing to report."
            exit 0
          fi
          title="$prefix: Firefox $VERSION"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 500 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already reported Firefox $VERSION."
            exit 0
          fi
          failed=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          {
            printf '@%s The e2e suites fail on **Firefox %s**, the current stable release - already on your machine once it updates: %s\n\n' "$OWNER" "$VERSION" "$RUN_URL"
            printf 'The run log and its e2e-logs artifact show which spec failed. tests/e2e/specs/firefox.e2e.mjs pins the Firefox behaviour FastStream relies on; a failure there means that behaviour changed.\n\n'
            printf 'This issue closes on its own once a run on the stable release passes.\n'
            printf 'Failed: %s\n' "${failed:-see the run}"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

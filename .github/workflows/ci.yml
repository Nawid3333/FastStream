name: CI

# Runs on every push to main and pr/** and on every pull request, and is the
# gate for releases: auto-release.yml only acts on a green run of this
# workflow. The steps are the same as `pnpm run verify`, so a green local
# verify predicts a green CI run and the other way round.

on:
  push:
    branches: [main, "pr/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Only reads the checkout and uploads workflow-run artifacts; needs nothing else.
permissions:
  contents: read

jobs:
  # Every workflow file: syntax, ${{ }} expressions, action inputs, and every
  # run: script through the shellcheck bundled in the image. A broken
  # workflow otherwise only shows up when it next runs - for auto-release.yml
  # or release.yml that is after a push to main. Beside `verify`, not in it:
  # it takes seconds, and auto-release waits for the whole workflow anyway.
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        # Pinned to the image digest as well as the tag, like every action here.
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    # The whole job takes about 15 minutes. A test waiting on a stream that
    # never loads would otherwise hold the runner for GitHub's 6-hour default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # local installs cannot drift apart.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build all targets
        run: pnpm run build:keep

      # Mozilla's addons-linter - the same engine AMO runs on upload.
      # Errors are already at zero upstream, so this gate is meaningful:
      # it stops a regression from reaching a store submission.
      # The AMO build is the one that has to pass, and until now CI only
      # linted the GitHub build - which is a different splice with different
      # code in it. Both run.
      - name: addons-linter (firefox-amo, the store submission)
        run: pnpm run lint:amo

      - name: addons-linter (firefox-github, the self-install build)
        run: pnpm run lint:github

      # Real playback in a real Firefox: each case loads a stream and asserts
      # that currentTime actually advances, which is what catches a broken or
      # mismatched media library. This replaces a manual three-URL checklist
      # that was never run on CI.
      #
      # It needs network access for the HLS and DASH streams; the MP4 fixture
      # is fetched once and cached. Not marked continue-on-error: a library
      # swap that stops video decoding should fail the build.
      # Firefox on Linux decodes H.264/AAC through ffmpeg's libavcodec rather
      # than shipping its own. Without this the runner loads every stream and
      # then never reaches HAVE_CURRENT_DATA, which looks exactly like a broken
      # media library but is a missing codec.
      - name: Install media codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: End-to-end playback (Firefox)
        run: pnpm run test:e2e

      # The only suite that installs the real built extension (moz-extension://
      # origin, chrome.* APIs, a background event page) rather than testing the plain
      # web build - MPV handoff, save-to-disk transport, and UI regressions
      # like a save dialog silently becoming unclickable only show up here.
      - name: End-to-end extension tests (Firefox)
        run: pnpm run test:ext

      # The same suites against the GitHub self-host build, which is shipped too
      # and differs from the AMO one (update checker, contextualIdentities).
      - name: End-to-end extension tests, GitHub build (Firefox)
        run: pnpm run test:ext:github

      # The installed extension in a private window, where storage APIs
      # behave differently (see tests/e2e/wdio.pbm.conf.mjs). Part of the
      # local verify; CI ran everything but this and the check below.
      - name: End-to-end extension tests, private browsing (Firefox)
        run: pnpm run test:pbm

      # The vendored ONNX Runtime binary still self-reports the build
      # docs/vendored-libraries.md describes - the provenance AMO review asks for.
      - name: ONNX Runtime provenance
        run: pnpm run verify:ort

      - name: Upload e2e failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload extension bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faststream-bundles
          path: built/*.zip
          if-no-files-found: error

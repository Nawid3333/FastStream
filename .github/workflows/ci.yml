name: CI

# Runs on every push to main and on every pull request, and is the gate for
# releases: auto-release.yml only acts on a green run of this workflow. The steps
# are the same as `pnpm run verify`, so a green local verify predicts a green CI
# run and the other way round. (Pushes to pr/** also ran it while this fork sent
# pull requests upstream from such branches; that ended in September 2026.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # runner-images.yml runs this on a new runner image, before and after ubuntu-latest
  # or windows-latest moves to it. A called run is not a "CI" run, so it never releases.
  workflow_call:
    inputs:
      linux-runner:
        type: string
        default: ubuntu-latest
      windows-runner:
        type: string
        default: windows-latest

# Cancel superseded runs on the same branch. A called run takes the caller's name as
# github.workflow; with the images in the group it never cancels a push run or another
# image's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.linux-runner }}-${{ inputs.windows-runner }}
  cancel-in-progress: true

# Only reads the checkout and uploads workflow-run artifacts; needs nothing else.
permissions:
  contents: read

jobs:
  # Every workflow file: syntax, ${{ }} expressions, action inputs, and every
  # run: script through the shellcheck bundled in the image. A broken
  # workflow otherwise only shows up when it next runs - for auto-release.yml
  # or release.yml that is after a push to main. Beside `verify`, not in it:
  # it takes seconds, and auto-release waits for the whole workflow anyway.
  workflows:
    name: Lint workflows
    runs-on: ${{ inputs.linux-runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # The token is not kept in .git/config (persist-credentials: false): every later
      # step could read it there, dev dependencies' install scripts included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        # The image is pinned to its digest as well as its tag, like every action here, in
        # .github/actionlint/Dockerfile: Dependabot updates it there, and cannot in a
        # docker:// line of a workflow.
        run: |
          image=$(sed -n 's/^FROM //p' .github/actionlint/Dockerfile)
          if ! [[ $image =~ ^rhysd/actionlint:[0-9.]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error file=.github/actionlint/Dockerfile::expected one line 'FROM rhysd/actionlint:<version>@sha256:<digest>', found: $image"
            exit 1
          fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" -color

      - name: zizmor
        # Security mistakes actionlint does not look for: a token left where later steps can
        # read it, text spliced into a script, a cache a release restores. What it flags and
        # this repository keeps is in .github/zizmor.yml, each with its reason. The image is
        # pinned in .github/zizmor/Dockerfile, as actionlint's is. Offline: its online checks
        # call the GitHub API, and a hiccup there would fail CI over nothing in this repository.
        run: |
          image=$(sed -n 's/^FROM //p' .github/zizmor/Dockerfile)
          if ! [[ $image =~ ^ghcr\.io/zizmorcore/zizmor:[0-9.]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error file=.github/zizmor/Dockerfile::expected one line 'FROM ghcr.io/zizmorcore/zizmor:<version>@sha256:<digest>', found: $image"
            exit 1
          fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" --offline --format github .github/

      - name: Workflow script tests
        # tests/workflows: the run: scripts that decide something (merge, comment, open an
        # issue), each run as GitHub runs it against a stubbed gh. Needs bash, jq, git,
        # node and python3, which the runner has; about 20 seconds.
        run: bash tests/workflows/run.sh

  verify:
    name: Lint, test and build
    runs-on: ${{ inputs.linux-runner || 'ubuntu-latest' }}
    # The whole job takes about 15 minutes. A test waiting on a stream that
    # never loads would otherwise hold the runner for GitHub's 6-hour default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager", so CI and
      # local installs cannot drift apart.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The Node major is .nvmrc's, in every workflow: a Node update is a one-line
      # change to that file, which the toolchain workflow's token may push (it may not
      # edit a workflow). check-latest: otherwise the action takes the Node cached in
      # the runner image, which lags - 22.23.2 on 2026-09-25, two days after 22.23.3
      # was out. Every workflow here asks for the newest, as tools/linux/setup.sh does.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build all targets
        run: pnpm run build:keep

      # Mozilla's addons-linter - the same engine AMO runs on upload.
      # Errors are already at zero upstream, so this gate is meaningful:
      # it stops a regression from reaching a store submission.
      # The AMO build is the one that has to pass, and until now CI only
      # linted the GitHub build - which is a different splice with different
      # code in it. Both run.
      - name: addons-linter (firefox-amo, the store submission)
        run: pnpm run lint:amo

      - name: addons-linter (firefox-github, the self-install build)
        run: pnpm run lint:github

      # The three vendored files that cannot be generated from a release are proven
      # instead: each check fetches the pinned upstream file, applies the changes
      # docs/vendored-libraries.md lists, and compares. An edit to one of those files that
      # is not added to its check fails here - verify:vtt was red for three days
      # (2026-09-22 to 09-25) when nothing ran it. Early, because they take seconds.
      - name: Vendored file provenance (vtt.js, knob, VAD model)
        run: pnpm run verify:vtt && pnpm run verify:knob && pnpm run verify:vad

      # fsaunpack, the .fsa archive helper, has its own npm lockfile and nothing else runs
      # it: this installs that lockfile (install scripts off) and starts its test server,
      # so a Dependabot pull request for its express is tested at all. Seconds.
      - name: fsaunpack test server
        run: pnpm run verify:fsaunpack

      # ffmpeg (Firefox on Linux decodes H.264/AAC through it), the e2e ports reserved,
      # and the current stable Firefox - the one users run - as FIREFOX_BINARY.
      - name: e2e setup
        uses: ./.github/actions/e2e-setup

      # Real playback in a real Firefox: each case loads a stream and asserts
      # that currentTime actually advances, which is what catches a broken or
      # mismatched media library. This replaces a manual three-URL checklist
      # that was never run on CI.
      #
      # It needs network access for the HLS and DASH streams; the MP4 fixture
      # is fetched once and cached. Not marked continue-on-error: a library
      # swap that stops video decoding should fail the build.
      - name: End-to-end playback (Firefox)
        run: pnpm run test:e2e

      # The only suite that installs the real built extension (moz-extension://
      # origin, chrome.* APIs, a background event page) rather than testing the plain
      # web build - MPV handoff, save-to-disk transport, and UI regressions
      # like a save dialog silently becoming unclickable only show up here.
      - name: End-to-end extension tests (Firefox)
        run: pnpm run test:ext

      # The same suites against the GitHub self-host build, which is shipped too
      # and differs from the AMO one (update checker, contextualIdentities).
      - name: End-to-end extension tests, GitHub build (Firefox)
        run: pnpm run test:ext:github

      # The installed extension in a private window, where storage APIs
      # behave differently (see tests/e2e/wdio.pbm.conf.mjs). Part of the
      # local verify; CI ran everything but this.
      - name: End-to-end extension tests, private browsing (Firefox)
        run: pnpm run test:pbm

      # A spec file that fails once and passes on its retry (specFileRetries) leaves the
      # job green: each config's onWorkerEnd records it in logs/retried.jsonl
      # (tests/e2e/retriedSpecs.mjs). This lists them in the run's summary with a warning
      # each, and the upload keeps the file for flaky-specs.yml's weekly issue. always():
      # a job that failed or timed out may have retried other specs too.
      - name: Report specs that needed their retry
        if: always()
        run: node tests/e2e/reportRetried.mjs logs/retried.jsonl

      - name: Upload the list of retried specs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-retried
          path: logs/retried.jsonl
          if-no-files-found: ignore
          retention-days: 14

      # Also for a green job that retried a spec: the failed attempt's driver log
      # (driverLogs.mjs keeps each attempt's) is what shows why it failed.
      - name: Upload e2e failure logs
        if: failure() || hashFiles('logs/retried.jsonl') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      # auto-release.yml downloads this within minutes of the run, to compare what ships
      # with the latest release; nothing reads it later. GitHub's default kept every
      # run's copy for 90 days (57 of them, 469 MB, in September 2026).
      - name: Upload extension bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faststream-bundles
          path: built/*.zip
          if-no-files-found: error
          retention-days: 7

  # The same e2e suites on Windows Firefox - the platform FastStream is used on.
  # Windows decodes H.264/AAC through Media Foundation where Linux uses ffmpeg, so
  # playback can differ between them. The platform-independent checks (lint, types,
  # unit tests, the AMO linters) stay in `verify`. auto-release.yml waits for the whole
  # workflow, so a release ships only when Windows passes too.
  e2e-windows:
    name: e2e (Windows)
    runs-on: ${{ inputs.windows-runner || 'windows-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The unit suite again (about 2 s): some of its tests run only on Windows - the native
      # host's PowerShell launch and its installer, with the real PowerShell - and `verify`
      # runs on Linux.
      - name: Unit tests (Windows)
        run: pnpm test

      # ffmpeg (the e2e setup builds its video fixtures with it) and the current stable
      # Firefox as FIREFOX_BINARY.
      - name: e2e setup
        uses: ./.github/actions/e2e-setup

      # mpv and the FastStream native host, so the MPV-mode specs (ext-specs/mpv,
      # classic-specs/mpv-*, toolbar-cycle-mpv) run here instead of skipping: they check
      # the request mpv itself makes for the stream, headers included, through the real
      # host. The mpv is shinchiro's daily x86_64-v3 Windows build, the one the maintainer
      # runs, pinned by .github/mpv-build.json (release, asset, SHA-256). mpv-updates.yml
      # tries each new build through CI and moves the pin once it passes. install.ps1 is
      # the installer users run.
      - name: Install mpv and the native host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -Raw -LiteralPath .github/mpv-build.json | ConvertFrom-Json
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$($pin.release)/$($pin.asset)"
          $archive = Join-Path $env:RUNNER_TEMP 'mpv.7z'
          $dir = Join-Path $env:RUNNER_TEMP 'mpv'
          foreach ($attempt in 1..3) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Download attempt $attempt failed: $_"
              Start-Sleep -Seconds 15
            }
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($hash -ne $pin.sha256) {
            throw "$($pin.asset) has SHA-256 $hash, expected $($pin.sha256)"
          }
          # mpv.exe, mpv.com and the DLLs are at the archive's root.
          7z x -y "-o$dir" $archive
          if ($LASTEXITCODE -ne 0) { throw "7z x exited with $LASTEXITCODE" }
          $mpv = Join-Path $dir 'mpv.exe'
          $version = & (Join-Path $dir 'mpv.com') --no-config --version
          if ($LASTEXITCODE -ne 0) { throw "mpv --version exited with $LASTEXITCODE" }
          $version | Select-Object -First 1
          # mpv reads only portable_config next to its exe: its log goes with the e2e
          # logs. Each mpv started writes it anew, so it is the last one's.
          New-Item -ItemType Directory -Force -Path (Join-Path $dir 'portable_config'), logs | Out-Null
          $log = (Join-Path $env:GITHUB_WORKSPACE 'logs\mpv.log') -replace '\\', '/'
          "log-file=$log" | Set-Content -LiteralPath (Join-Path $dir 'portable_config\mpv.conf') -Encoding ASCII
          ./native-host/install.ps1 -MpvPath $mpv -NodePath (Get-Command node).Source
          # What the specs check before they run, rather than skip: the registry key, and
          # the manifest it names.
          $manifest = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Mozilla\NativeMessagingHosts\com.faststream.mpv').'(default)'
          if (-not $manifest -or -not (Test-Path -LiteralPath $manifest)) {
            throw "The native host is not registered: '$manifest'"
          }
          Get-Content -LiteralPath $manifest
          # The host logs what it is asked and what it starts, for a failed run's artifact.
          'FASTSTREAM_MPV_DEBUG=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build all targets
        run: pnpm run build:keep

      # E2E_MOZ_LOG: the specs listed in tests/e2e/mozLog.mjs run with Firefox's network
      # log, kept only for an attempt that failed (see "Upload Firefox logs" below).
      - name: End-to-end playback (Windows Firefox)
        run: pnpm run test:e2e
        env:
          E2E_MOZ_LOG: '1'

      - name: End-to-end extension tests (Windows Firefox)
        run: pnpm run test:ext

      - name: End-to-end extension tests, GitHub build (Windows Firefox)
        run: pnpm run test:ext:github

      - name: End-to-end extension tests, private browsing (Windows Firefox)
        run: pnpm run test:pbm

      # As in the Linux job.
      - name: Report specs that needed their retry (Windows)
        if: always()
        run: node tests/e2e/reportRetried.mjs logs/retried.jsonl

      - name: Upload the list of retried specs (Windows)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-retried-windows
          path: logs/retried.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Add the native host's log
        if: failure() || hashFiles('logs/retried.jsonl') != ''
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'FastStreamMpvHost\faststream-mpv-host.log'
          if (Test-Path -LiteralPath $log) {
            New-Item -ItemType Directory -Force -Path logs | Out-Null
            Copy-Item -LiteralPath $log -Destination logs
          }

      # As in the Linux job: also for a green job that retried a spec.
      - name: Upload e2e failure logs
        if: failure() || hashFiles('logs/retried.jsonl') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-windows
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      # Firefox's network log of a failed attempt of a spec in tests/e2e/mozLog.mjs. Not
      # only on failure(): a spec that fails once and passes on its retry leaves the job
      # green, and that failed attempt is the one whose log is wanted. A passing attempt
      # deletes its log, so on most runs there is nothing here and nothing is uploaded.
      - name: Upload Firefox logs of failed attempts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-moz-logs-windows
          path: logs-moz/
          if-no-files-found: ignore
          retention-days: 7

  # update-prs.yml decides on an update pull request when CI has run on it, on the
  # workflow_run event. A run whose actor is this repository's token sends none: GitHub
  # starts no workflow for what its own token did. That is a run a workflow started
  # (toolchain-updates.yml, patched-libraries.yml, update-prs.yml itself), and the
  # pull_request run of a pull request a workflow opened (those two, sync-upstream.yml),
  # even once the owner approved it; the pull request would sit without a word. For such
  # a run this job starts update-prs.yml by workflow_dispatch instead, with the run's
  # number; it waits for the run to end. Last, after every other job whatever they
  # concluded, and it checks nothing out. Tried three times over two and a half minutes;
  # if GitHub refuses all three, this job fails and, since a run of the token's emails no
  # one, opens an issue that tells the owner to start update-prs.yml from the Actions tab
  # with this run's id and branch.
  hand-off:
    name: Hand over to update-prs
    needs: [workflows, verify, e2e-windows]
    if: >-
      !cancelled() && github.actor == 'github-actions[bot]' &&
      (startsWith(github.head_ref || github.ref_name, 'dependabot/') ||
       startsWith(github.head_ref || github.ref_name, 'toolchain/') ||
       startsWith(github.head_ref || github.ref_name, 'patched/') ||
       (github.head_ref || github.ref_name) == 'sync/upstream')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # start update-prs.yml
      issues: write   # say so when it cannot
    steps:
      - name: Start update-prs.yml for this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          # A pull_request run's ref is the pull request's merge ref; its branch is head_ref.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SELF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Update PRs hand-off failed'
        run: |
          start() { gh workflow run update-prs.yml --ref main -f run_id="$RUN_ID" -f branch="$BRANCH"; }
          if start || { sleep 30; start; } || { sleep 120; start; }; then
            exit 0
          fi
          # This run emails no one, so the owner hears of it here: one issue while it is open,
          # and a comment on it for each refusal after.
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s GitHub refused three times again, for CI run %s on %s (%s): start update-prs.yml by hand with run_id %s and branch %s.\n' \
              "$OWNER" "$RUN_ID" "$BRANCH" "$SELF_URL" "$RUN_ID" "$BRANCH" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md" || true
          else
            printf '@%s GitHub refused three times to start update-prs.yml for CI run %s on %s (%s), a run this repository started, so that pull request waits without a word. Start it from the Actions tab: Update PRs, Run workflow, run_id %s and branch %s. Close this issue once it has run.\n' \
              "$OWNER" "$RUN_ID" "$BRANCH" "$SELF_URL" "$RUN_ID" "$BRANCH" > "$RUNNER_TEMP/body.md"
            gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md" || true
          fi
          exit 1

  # auto-release.yml releases main on the workflow_run event of a green push run, which a
  # run this repository's token started sends none of, for the reason above: a re-run of a
  # run a late run cancelled, or CI on main that auto-release.yml starts when main moved on
  # by pushes that start none (both in auto-release.yml). For such a run this job starts
  # auto-release.yml by workflow_dispatch instead, with the run's id; it waits for the
  # run to end and checks it as it checks the event. Whatever the other jobs concluded:
  # auto-release.yml reports a red one, which no one would otherwise hear of. The commit
  # goes along, so that auto-release.yml runs one release of it at a time. Tried three
  # times like the job above; if all three fail, this job fails and opens an issue that
  # tells the owner to start auto-release.yml from the Actions tab with this run's id. A
  # run called by runner-images.yml carries the caller's name and is left alone.
  # Either actor: the owner's re-run of a run the token started keeps the token as its
  # actor, and it sends no workflow_run either (CI run 36618653582, attempt 2, sent none);
  # it released nothing when only the triggering actor, the owner, was checked. A run that
  # sends a workflow_run as well is released once: auto-release.yml runs one release of a
  # commit at a time, and the second finds the first one's bump.
  release-hand-off:
    name: Hand over to auto-release
    needs: [workflows, verify, e2e-windows]
    if: >-
      !cancelled() && github.workflow == 'CI' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # start auto-release.yml
      issues: write   # say so when it cannot
    steps:
      - name: Start auto-release.yml for this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          SELF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Auto release failed'
        run: |
          start() { gh workflow run auto-release.yml --ref main -f run_id="$RUN_ID" -f sha="$SHA"; }
          if start || { sleep 30; start; } || { sleep 120; start; }; then
            exit 0
          fi
          # This run emails no one, so the owner hears of it here: one issue while it is open,
          # and a comment on it for each failure after.
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s GitHub refused three times to start auto-release.yml, for CI run %s on main (%s): %s. Start it from the Actions tab: Auto release, Run workflow, run_id %s.\n' \
              "$OWNER" "$RUN_ID" "${SHA:0:8}" "$SELF_URL" "$RUN_ID" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md" || true
          else
            printf '@%s GitHub refused three times to start auto-release.yml for CI run %s on main (%s), a run this repository started. Start it from the Actions tab: Auto release, Run workflow, run_id %s. Close this issue once it has run.\n' \
              "$OWNER" "$RUN_ID" "${SHA:0:8}" "$RUN_ID" > "$RUNNER_TEMP/body.md"
            gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md" || true
          fi
          exit 1

name: Build and upload artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "V*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build and upload artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager", so this
      # workflow cannot drift from CI or from local installs.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile also applies patches/ during install, which the
      # build needs: chrome/player/modules/hls.mjs is generated from the
      # patched npm package, not tracked in git.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: built/*.zip

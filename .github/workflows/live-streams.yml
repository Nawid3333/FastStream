name: Real streams

# The playback checklist against real streams and sites, once a week: `pnpm run test:live`
# (tests/e2e/live-specs/streams.e2e.mjs) - HLS and DASH pages with the sites' own players,
# a long DASH title, a live stream, a progressive MP4, both kinds of iframe embed, and a
# manifest opened directly. Every other suite plays files from 127.0.0.1, so what only real
# servers do - a CDN's HTTP/2, CORS and range answers, a live manifest that moves - is
# checked nowhere else. Its first runs found two bugs (#40, #41).
#
# Not part of CI, on purpose: it depends on third-party servers, and an outage there must
# not hold back a release. A scheduled failure opens one issue, assigned to the owner with
# an @mention; the next green scheduled run closes it. It also runs on a pull request that
# changes this suite or its setup, and by hand.

on:
  schedule:
    # Mondays, 08:00 UTC, after the Monday Firefox Beta run.
    - cron: '0 8 * * 1'
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/live-streams.yml
      - .github/actions/e2e-setup/**
      - tests/e2e/live-specs/**
      - tests/e2e/wdio.live.conf.mjs
  workflow_dispatch:

concurrency:
  group: live-streams-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    name: Real streams (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux as in CI, and Windows, where FastStream is used and Firefox decodes
        # through Media Foundation instead of ffmpeg.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ffmpeg (Firefox on Linux decodes H.264/AAC through it), the e2e ports reserved,
      # and the current stable Firefox as FIREFOX_BINARY.
      - name: e2e setup
        uses: ./.github/actions/e2e-setup

      - name: Build
        run: pnpm run build:keep

      - name: Real streams
        run: pnpm run test:live

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-streams-logs-${{ matrix.os }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

  report:
    needs: live
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or close the real-streams issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.live.result }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          prefix='Real streams stop playing'
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq ".[] | select(.title | startswith(\"$prefix\")) | .number" | head -1)
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Real streams play again: $RUN_URL"
            fi
            exit 0
          fi
          if [ "$RESULT" != failure ]; then
            echo "Result: $RESULT - nothing to report."
            exit 0
          fi
          if [ -n "$open" ]; then
            echo "Still failing; already reported in #$open."
            exit 0
          fi
          failed=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          # The backticks are Markdown for the issue body, not command substitution.
          # shellcheck disable=SC2016
          {
            printf '@%s The weekly check against real streams and sites failed: %s\n\n' "$OWNER" "$RUN_URL"
            printf 'Failed: %s. The run log names the case, and its logs artifact has the browser logs.\n\n' "${failed:-see the run}"
            printf 'A stream or site the check uses may just be down: run it again by hand (Actions > Real streams > Run workflow). If it fails again, a CDN or site changed how it serves video, or FastStream stopped coping with it - `pnpm run test:live` reproduces it locally.\n\n'
            printf 'This issue closes on its own once a scheduled run passes.\n'
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$prefix ($(date -u +%Y-%m-%d))" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

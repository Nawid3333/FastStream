name: Dependency review

# Looks at what a pull request changes in pnpm-lock.yaml and fails when it
# brings in a package version with a known vulnerability of high severity or
# worse. Dependabot alerts only report such a package once it is on main - and
# a push to main is a release to Firefox - so this is the same check, made
# before the merge. It matters most for the PRs that change the lockfile:
# Dependabot's and patched-libraries.yml's.
#
# patched-libraries.yml's are opened by this repository's token, so their pull_request
# run waits for the owner's approval, and until 2026-09-30 they were reviewed only if
# the owner clicked "Approve and run". That workflow now starts this one on its branch
# (workflow_dispatch), next to CI, and update-prs.yml names its result in its comment
# when it did not pass.
#
# Reads the dependency graph GitHub builds from pnpm-lock.yaml (1,107 packages
# at the time of writing), so there is nothing to install.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The token is not kept in .git/config (persist-credentials: false): every later
      # step could read it there, dev dependencies' install scripts included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # A pull request's run compares its base and head. A dispatched run compares the
          # branch's commit with main, by its hash: the compare API answers 404 for a
          # branch name with a / in it, as patched/* have.
          base-ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          head-ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}

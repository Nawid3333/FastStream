name: Publish to AMO (unlisted)

# Fires once CI has gone green on a push to the work branch - i.e. whenever
# a PR (a sync-upstream PR or anything else) is merged into
# dev/mv3-modernization. Builds fresh from that exact commit, re-lints the
# AMO bundle as a last defense-in-depth check, then signs and submits it to
# addons.mozilla.org on the unlisted (self-distributed) channel.
#
# Deliberately gated on CI's own success via workflow_run rather than its
# own copy of the build - this is the one human checkpoint the sync-upstream
# workflow relies on (see its header comment): merging the PR is the signal
# that someone reviewed the diff and, ideally, ran the playback checklist.
# From that point on, publishing itself is fully automatic.
#
# Needs two repo secrets, matching .amo-credentials.json's local fields:
#   AMO_API_KEY, AMO_API_SECRET
# Settings > Secrets and variables > Actions > New repository secret.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev/mv3-modernization]

permissions:
  contents: read
  issues: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    name: Build, sign and submit (unlisted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # AMO rejects resubmitting a version string it has already seen, and
      # caps a version at 4 dot-separated numbers - so the run number
      # replaces everything past major.minor.patch rather than appending
      # onto whatever package.json already has, which could otherwise grow
      # past 4 parts (as it does today: 1.3.77.1). This edits only this
      # runner's checkout - nothing is committed back.
      - name: Make this submission's version unique
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const base = p.version.split('.').slice(0, 3).join('.');
            p.version = base + '.' + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('Building as', p.version);
          "

      - name: Build (AMO target)
        run: pnpm run build:keep

      # The same addons-linter engine AMO runs on upload, against this exact
      # bundle, immediately before it gets submitted.
      - name: addons-linter (firefox-amo)
        run: pnpm run lint:amo

      - name: Sign and submit (unlisted)
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: pnpm run sign:amo

      # No SMTP secrets to manage: assigning a GitHub issue emails the
      # assignee under that account's default notification settings. Reuses
      # one issue by title instead of opening a new one on every failure.
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE='AMO publish workflow failed'
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" \
              --body "The publish-amo workflow failed for commit ${{ github.event.workflow_run.head_sha }}. Run: $RUN_URL" \
              --assignee "${{ github.repository_owner }}"
          fi

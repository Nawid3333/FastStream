name: Release failsafe

# Makes sure every release reaches Firefox, and says so when it cannot. (The file keeps
# its first name, from when it only completed AMO signing.)
#
# release.yml starts this after every run, published or not; a schedule runs it every 3
# hours as well, for anything that slipped past. Each run looks at:
#
# 1. The newest version tag. A tag without a release means release.yml failed before it
#    published - a build error, the network failing during the install - or was never
#    started. This starts release.yml for the tag again, at most twice in all, and when
#    that has not helped opens the issue "Release <tag> failed". Firefox does not get a
#    version until it is published.
#
# 2. The latest release. Complete means it has the zip, the signed xpi and updates.json;
#    Firefox's update check reads the latest release's updates.json, so without it the
#    self-update path is stuck.
#    - Incomplete: build its tag and ask AMO about the version (tools/fetch-amo-signed.mjs,
#      which uploads nothing), waiting up to 40 minutes, through network failures, for
#      the signature - release.yml's own wait ends after 30 minutes, and AMO has taken 15.
#        signed    download the xpi (byte-identical to what web-ext saves), generate
#                  updates.json, attach both (and the zip, if that is missing too)
#        pending   the next run asks again
#        missing   AMO never received it (the upload itself failed): sign it now
#        rejected  waiting will not help
#      Rejected, or still incomplete 24 hours after it was published: the issue "AMO
#      signing incomplete: <tag>".
#    - Complete: follow the update path the way Firefox does (tools/check-update-path.mjs):
#      the update_url redirect, updates.json, the xpi's hash, Mozilla's signature, the
#      version and the add-on id. Broken: the issue "Update path broken: <tag>". A check
#      the network stopped is not reported; the next run makes it again.
#
# Every issue is assigned to the owner and @mentions them, so it arrives by email; it is
# opened once, and closed by the first run that finds it resolved.

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write   # start release.yml again for a tag it did not publish

concurrency:
  group: amo-signing-failsafe
  cancel-in-progress: false

jobs:
  failsafe:
    name: Make sure the latest release reaches Firefox
    runs-on: ubuntu-latest
    # The AMO keys: secrets of the "release" environment, as in release.yml (#163). This runs
    # on main (schedule, and release.yml's dispatch), which the environment allows.
    environment:
      name: release
      deployment: false
    # Up to 15 minutes for a release.yml run to finish, the build, and 40 for AMO.
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      SIGNING_PREFIX: 'AMO signing incomplete: '
      PATH_PREFIX: 'Update path broken: '

    steps:
      # The token is not kept in .git/config (persist-credentials: false): every later
      # step could read it there, dev dependencies' install scripts included.
      # main, with every tag: the release tools below are main's, and a tag is checked out
      # only to build it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look at the newest tag and the latest release
        id: release
        run: |
          set -euo pipefail
          read -r tag published <<< "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt --jq '"\(.tagName) \(.publishedAt)"')"
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(" ")')
          age_hours=$(( ( $(date +%s) - $(date -d "$published" +%s) ) / 3600 ))
          complete=false
          if [[ " $assets " == *" updates.json "* ]] && [[ "$assets" == *.xpi* ]] && [[ "$assets" == *firefox-github-*.zip* ]]; then
            complete=true
          fi
          # The project's own tags only: lowercase v. The capital-V ones are upstream's,
          # copied when the repository was forked.
          newest=$(git tag -l 'v*' | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -V | tail -1 || true)
          orphan=
          if [ -n "$newest" ] && [ "$newest" != "$tag" ] &&
             [ "$(printf '%s\n%s\n' "$tag" "$newest" | sort -V | tail -1)" = "$newest" ] &&
             ! gh release view "$newest" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            orphan=$newest
          fi
          echo "Latest release $tag, published ${age_hours} h ago, complete: $complete. Newest tag: ${newest:-none}${orphan:+, which has no release}."
          {
            echo "tag=$tag"
            echo "version=${tag#[vV]}"
            echo "assets=$assets"
            echo "age_hours=$age_hours"
            echo "complete=$complete"
            echo "orphan=$orphan"
          } >> "$GITHUB_OUTPUT"

      # already_reported <title>, for the steps below: true when an issue with that title is
      # open, or was closed by a person (the owner closing one means: stop telling me). Not
      # when this workflow closed it itself, once the problem was gone: the same thing can
      # break again, and then it is news. Who closed one comes from its events, as gh issue
      # list does not say. A close it cannot attribute counts as a person's. The steps below
      # run on the release's tag checked out, so the function lives in the runner's temp
      # folder, not in a file of the repository.
      - name: Define already_reported
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/already-reported.sh" <<'EOF'
          already_reported() {
            local number state closer
            gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 500 --json number,state,title \
              --jq ".[] | select(.title == \"$1\") | \"\(.number)\t\(.state)\"" > "$RUNNER_TEMP/same-title.tsv"
            while IFS=$'\t' read -r number state; do
              if [ "$state" = OPEN ]; then return 0; fi
              closer=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/events" \
                --jq '.[] | select(.event == "closed") | .actor.login' | tail -n 1) || closer=''
              if [ "$closer" != 'github-actions[bot]' ]; then return 0; fi
            done < "$RUNNER_TEMP/same-title.tsv"
            return 1
          }
          EOF

      - name: Close the issues that are resolved
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMPLETE: ${{ steps.release.outputs.complete }}
        run: |
          set -euo pipefail
          open_issues() { # title prefix -> "number<TAB>title" of each open issue
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
              --jq ".[] | select(.title | startswith(\"$1\")) | \"\(.number)\t\(.title)\""
          }
          if [ "$COMPLETE" = true ]; then
            open_issues "$SIGNING_PREFIX" | while IFS=$'\t' read -r number _; do
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "The latest release, $TAG, has its signed xpi and updates.json. Closing."
            done
          fi
          open_issues 'Release v' | while IFS=$'\t' read -r number title; do
            failed=${title#Release }
            failed=${failed% failed}
            if [ "$title" = "Release $failed failed" ] && gh release view "$failed" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "$failed has its release now. Closing."
            fi
          done

      - name: Start release.yml again for a tag it did not publish
        if: steps.release.outputs.orphan != ''
        env:
          ORPHAN: ${{ steps.release.outputs.orphan }}
        run: |
          set -euo pipefail
          # A tag deleted and made again starts afresh: only the runs since it was made count,
          # or the failed runs of its earlier life would allow it no restart.
          tagged=$(git for-each-ref --format='%(creatordate:unix)' "refs/tags/$ORPHAN")
          TAGGED_AT=$(date -u -d "@$tagged" +%Y-%m-%dT%H:%M:%SZ)
          export TAGGED_AT
          runs() { # jq filter over this tag's release.yml runs since the tag was made
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$ORPHAN" --limit 20 \
              --json status,createdAt --jq "[.[] | select(.createdAt >= env.TAGGED_AT)] | $1"
          }
          # release.yml starts this failsafe as its last step, so its run for the tag is
          # usually still finishing.
          for _ in $(seq 1 30); do
            [ "$(runs '[.[] | select(.status != "completed")] | length')" = 0 ] && break
            sleep 30
          done
          if gh release view "$ORPHAN" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$ORPHAN has been published meanwhile."
            exit 0
          fi
          attempts=$(runs '[.[] | select(.status == "completed")] | length')
          age_minutes=$(( ( $(date +%s) - tagged ) / 60 ))
          if [ "$attempts" -eq 0 ] && [ "$age_minutes" -lt 10 ]; then
            echo "$ORPHAN was tagged $age_minutes min ago and release.yml has not run for it yet: auto-release.yml starts it."
            exit 0
          fi
          if [ "$attempts" -lt 2 ]; then
            echo "$ORPHAN has no release after $attempts release.yml run(s). Starting another."
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$ORPHAN"
            exit 0
          fi
          title="Release $ORPHAN failed"
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/already-reported.sh"
          if already_reported "$title"; then
            echo "Already reported: $title."
            exit 0
          fi
          runs_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml?query=branch%3A$ORPHAN"
          # The backticks are Markdown for the issue body, not command substitution.
          # shellcheck disable=SC2016
          {
            printf '@%s %s is tagged but has no release: release.yml failed %s times for it, the last of them started by this failsafe. Firefox does not get this version until it is published.\n\n' "$OWNER" "$ORPHAN" "$attempts"
            printf 'The runs: %s\n\n' "$runs_url"
            printf 'Fix what they report, then run release.yml for the tag again: `gh workflow run release.yml --ref %s`. This issue closes on its own once %s has its release.\n' "$ORPHAN" "$ORPHAN"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

      # --- The latest release is complete: check the update path Firefox follows.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release.outputs.complete == 'true'
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Check the update path Firefox follows
        if: steps.release.outputs.complete == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          code=0
          node tools/check-update-path.mjs "$GITHUB_REPOSITORY" "$TAG" > "$RUNNER_TEMP/path.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/path.txt"
          if [ "$code" = 2 ]; then
            echo "::notice::The network stopped the update path check; the next run makes it again."
            exit 0
          fi
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq ".[] | select(.title | startswith(\"$PATH_PREFIX\")) | .number")
          if [ "$code" = 0 ]; then
            for number in $open; do
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The update path of $TAG holds. Closing."
            done
            exit 0
          fi
          # The issue is the notice; a red run every 3 hours on top would only repeat it.
          echo "::warning::The update path of $TAG is broken; see the issue \"$PATH_PREFIX$TAG\"."
          title="$PATH_PREFIX$TAG"
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/already-reported.sh"
          if already_reported "$title"; then
            echo "Already reported: $title."
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            printf '@%s Firefox cannot update to %s: its update check follows the latest release'"'"'s updates.json, and a link on that path does not hold.\n\n' "$OWNER" "$TAG"
            printf '```\n'
            cat "$RUNNER_TEMP/path.txt"
            printf '```\n\nThe run: %s\nThis issue closes on its own once a run finds the path whole.\n' "$run_url"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

      # --- The latest release is incomplete: collect what AMO signed.

      # The build is the tag's; the release tools stay main's, since a tag's own copies may
      # predate what this workflow asks of them (--wait, the network retries).
      - name: Check out the release's tag, with main's release tools
        if: steps.release.outputs.complete == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git checkout -q "$TAG"
          git checkout -q "$GITHUB_SHA" -- tools/fetch-amo-signed.mjs tools/sign-amo.mjs tools/gen-update-manifest.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.release.outputs.complete == 'false'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release.outputs.complete == 'false'
        with:
          node-version-file: .nvmrc
          check-latest: true
          # No cache: other workflows' runs write it, and this job holds the AMO keys. setup-node
          # caches on its own when package.json names a package manager, so it is turned off.
          package-manager-cache: false

      - name: Build the release's tag
        if: steps.release.outputs.complete == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:keep

      - name: Fetch the signed xpi from AMO, or sign it
        id: sign
        if: steps.release.outputs.complete == 'false'
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          code=0
          node tools/fetch-amo-signed.mjs "$VERSION" --wait 40 || code=$?
          case "$code" in
            0) state=signed ;;
            3) state=pending ;;
            5) state=rejected ;;
            4)
              echo "AMO has no $VERSION: the upload never happened. Signing it now."
              if pnpm run sign:amo && ls web-ext-artifacts/*.xpi > /dev/null 2>&1; then
                state=signed
              else
                state=pending
              fi
              ;;
            *) state=error ;;
          esac
          echo "Signing state for $VERSION: $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Attach the xpi and updates.json to the release
        if: steps.sign.outputs.state == 'signed'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ASSETS: ${{ steps.release.outputs.assets }}
        run: |
          set -euo pipefail
          node tools/gen-update-manifest.mjs "$GITHUB_REPOSITORY" "$TAG"
          files=(web-ext-artifacts/*.xpi web-ext-artifacts/updates.json)
          if [[ "$ASSETS" != *firefox-github-*.zip* ]]; then
            files+=(built/firefox-github-*.zip)
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"$SIGNING_PREFIX$TAG\") | .number"); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Signed by AMO and attached to $TAG by the failsafe run. Closing."
          done

      - name: Tell the owner when waiting will not do
        if: >
          steps.release.outputs.complete == 'false' &&
          steps.sign.outputs.state != 'signed' &&
          (steps.sign.outputs.state == 'rejected' || steps.release.outputs.age_hours >= 24)
        env:
          TAG: ${{ steps.release.outputs.tag }}
          STATE: ${{ steps.sign.outputs.state }}
          AGE: ${{ steps.release.outputs.age_hours }}
        run: |
          set -euo pipefail
          title="$SIGNING_PREFIX$TAG"
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/already-reported.sh"
          if already_reported "$title"; then
            echo "Already reported $TAG."
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # The backticks are Markdown for the issue body, not command substitution.
          # shellcheck disable=SC2016
          {
            printf '@%s %s has no signed xpi and updates.json yet, %s hours after it was published. AMO says: **%s**.\n\n' "$OWNER" "$TAG" "$AGE" "$STATE"
            printf 'Until it does, Firefox finds no update: its update check reads the latest release'"'"'s updates.json.\n\n'
            printf -- '- `pending`: still in AMO review. This workflow keeps checking every 3 hours and closes this issue once it is attached.\n'
            printf -- '- `rejected`: AMO disabled or rejected the version. Look it up on the AMO developer hub; waiting will not help.\n'
            printf -- '- `error`: see the run: %s\n' "$run_url"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

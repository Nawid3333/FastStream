name: Security alerts

# Dependabot opens a pull request for a security fix, and update-prs.yml tells the owner
# whether it is ready to merge. When Dependabot cannot make the fix - a package the lockfile holds at
# several majors, as brace-expansion was (2026-09-30) - its "Dependabot Updates" run fails
# where nobody looks and the alert stays open on the Security tab, with GitHub's alert email
# as the only notice. So once a day this reads the repository's open Dependabot alerts. A
# package with an alert over 6 hours old (Dependabot's pull request comes within minutes)
# and no open Dependabot pull request naming it gets one issue, "Security alert: <package>",
# assigned to the owner and @mentioning them, listing its alerts and how to fix them by
# hand. A later alert for that package is added to the open issue with a comment.
#
# The issue closes itself once none of the package's alerts is open: fixed on main (GitHub
# marks an alert fixed once main's lockfile no longer has the version) or dismissed. A
# push to main that changes a lockfile waits up to 10 minutes for that; the daily run
# closes what it missed. Closing the issue by hand skips the alerts it lists: the
# `<!-- alerts: ... -->` line in its body records them, and an alert an issue has listed,
# open or closed, is never raised again.
#
# The second job, "watch" (daily and by hand, not on a push), looks after the open update
# pull requests: it opens "Update pull requests piling up" when a Dependabot entry nears its
# open-pull-requests-limit or an update has been red for over 14 days, closes the migration
# issues update-prs.yml opened for pull requests merged or closed since, and starts
# update-prs.yml again on a pull request it held back for new releases once they are 3 days old.

on:
  schedule:
    - cron: '30 6 * * *'
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - fsaunpack/package-lock.json
  workflow_dispatch:

permissions: {}  # each job asks for what it needs

concurrency:
  group: security-alerts
  cancel-in-progress: false

jobs:
  check:
    name: Check the open Dependabot alerts
    permissions:
      vulnerability-alerts: read  # list the Dependabot alerts
      pull-requests: read  # see which packages an open Dependabot pull request updates
      issues: write  # open, update and close the "Security alert" issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      EVENT: ${{ github.event_name }}
      PREFIX: 'Security alert: '
    steps:
      - name: Open, update and close the issues
        run: |
          set -euo pipefail
          T=$RUNNER_TEMP
          ALERTS="https://github.com/$GH_REPO/security/dependabot"

          # The open alerts, and every issue this workflow ever opened, open or closed, with
          # the alerts its body lists. A list of issues, not a search: the search index can
          # lag behind an issue opened minutes ago. The issues endpoint lists pull requests
          # too, and pages through all of them.
          fetch_alerts() {
            gh api --paginate "repos/$GH_REPO/dependabot/alerts?state=open&per_page=100" \
              --jq '.[] | {number, created_at, package: .dependency.package.name, manifest: .dependency.manifest_path, severity: .security_advisory.severity, summary: .security_advisory.summary, range: .security_vulnerability.vulnerable_version_range, patched: .security_vulnerability.first_patched_version.identifier}' \
              | jq -s . > "$T/alerts.json"
          }
          fetch_issues() {
            gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" \
              --jq '.[] | select(.pull_request == null and .user.login == "github-actions[bot]" and (.title | startswith(env.PREFIX))) | {number, state, package: (.title | ltrimstr(env.PREFIX)), listed: [(.body // "") | capture("<!-- alerts: (?<n>[0-9 ]*) -->") | .n | splits(" +") | select(. != "") | tonumber]}' \
              | jq -s . > "$T/issues.json"
          }

          # Close every open issue whose package has no open alert left, naming what became
          # of each alert it listed. Alert numbers are written "alert 43", never "#43":
          # GitHub links #43 to issue 43.
          close_done() {
            jq -r --slurpfile a "$T/alerts.json" \
              '.[] | select(.state == "open") | select(.package as $p | any($a[0][]; .package == $p) | not) | [.number, .package, (.listed | map(tostring) | join(" "))] | @tsv' \
              "$T/issues.json" > "$T/done.tsv"
            while IFS=$'\t' read -r number package listed; do
              {
                # shellcheck disable=SC2016 # backticks are Markdown
                printf 'No Dependabot alert for `%s` is open any more:\n\n' "$package"
                for n in $listed; do
                  printf -- '- [alert %s](%s/%s): %s\n' "$n" "$ALERTS" "$n" "$(gh api "repos/$GH_REPO/dependabot/alerts/$n" --jq .state)"
                done
              } > "$T/comment.md"
              gh issue close "$number" --reason completed --comment "$(cat "$T/comment.md")"
              echo "Closed #$number ($package)"
            done < "$T/done.tsv"
          }

          fetch_alerts
          fetch_issues
          close_done

          if [ "$EVENT" = push ]; then
            # GitHub marks the alerts fixed soon after the push (the 12 of 2026-09-30 within
            # 9 seconds): until then, the open issues whose package still has an open alert
            # are looked at again every 30 seconds, for up to 10 minutes. A push that fixed
            # none of them waits the whole 10 minutes.
            for _ in $(seq 1 20); do
              waiting=$(jq --slurpfile a "$T/alerts.json" \
                '[.[] | select(.state == "open") | select(.package as $p | any($a[0][]; .package == $p))] | length' \
                "$T/issues.json")
              if [ "$waiting" -eq 0 ]; then break; fi
              echo "$waiting open issue(s) still have an open alert; looking again in 30 seconds."
              sleep 30
              fetch_alerts
              fetch_issues
              close_done
            done
            exit 0
          fi

          # The packages an open Dependabot pull request updates: Dependabot is fixing those,
          # and update-prs.yml tells the owner about the pull request. Read from the parts
          # Dependabot writes itself - the title ("Bump <package> from ..."), the links before
          # the first <details> ("Bumps [<package>](...)", a grouped update's list, an
          # ancestor it updates too) and a grouped update's "Updates `<package>` from ..."
          # lines - not from the release notes and commits quoted below them. A name matched
          # by mistake only holds the issue back until that pull request is merged or closed.
          # shellcheck disable=SC2016 # backticks are Markdown, matched by jq
          gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.user.login == "dependabot[bot]") | (.title | capture("^Bump (?<p>\\S+) from ") | .p), ((.body // "") | (split("<details>")[0] // "") | scan("\\[([^\\]\\[]+)\\]\\(") | .[0]), ((.body // "") | scan("(?m)^Updates `([^`]+)` from ") | .[0])' \
            | jq -R -s 'split("\n") | map(select(. != "")) | unique' > "$T/pr-packages.json"

          # Per package: the alerts that are due (over 6 hours old, no pull request), the
          # ones no issue has listed yet, and the open issue, if there is one.
          jq -r --slurpfile i "$T/issues.json" --slurpfile w "$T/pr-packages.json" --argjson now "$(date -u +%s)" '
            [.[] | select((.created_at | fromdateiso8601) < $now - 21600)
                 | select(.package as $p | any($w[0][]; . == $p) | not)]
            | group_by(.package)[]
            | .[0].package as $p
            | [.[].number] as $due
            | ($due - [$i[0][] | select(.package == $p) | .listed[]]) as $new
            | select($new | length > 0)
            | ([$i[0][] | select(.package == $p and .state == "open") | .number][0] // 0) as $open
            | ([$i[0][] | select(.number == $open) | .listed[]] + $due | unique) as $list
            | [$p, $open, ($new | map(tostring) | join(" ")), ($list | map(tostring) | join(" "))] | @tsv' \
            "$T/alerts.json" > "$T/due.tsv"

          while IFS=$'\t' read -r package open new list; do
            # The alerts it lists that are still open, as a table. The advisory's summary is
            # another project's text: a | in it is escaped, and a < too, as a
            # "<!-- alerts: ... -->" in it would hide the real list from the next run.
            jq -r --arg p "$package" --arg list "$list" --arg base "$ALERTS" '
              ($list | split(" ") | map(tonumber)) as $l
              | .[] | select(.package == $p and (.number as $n | any($l[]; . == $n)))
              | "| [\(.number)](\($base)/\(.number)) | \(.severity) | `\(.manifest)` | `\(.range)` | \(.patched // "none yet") | \((.summary // "") | gsub("[\r\n]+"; " ") | gsub("\\|"; "\\|") | gsub("<"; "&lt;")) |"' \
              "$T/alerts.json" > "$T/rows.md"
            {
              # shellcheck disable=SC2016 # backticks are Markdown
              printf '@%s Dependabot has open security alerts for `%s` and no pull request that fixes them:\n\n' "$OWNER" "$package"
              printf '| Alert | Severity | In | Vulnerable | Fixed in | Advisory |\n| --- | --- | --- | --- | --- | --- |\n'
              cat "$T/rows.md"
              cat <<EOF

          Dependabot opens a pull request for a security fix when it can; when it cannot, the failed "Dependabot Updates" run on the Actions tab says why (a package the lockfile holds at several majors fails, as brace-expansion did on 2026-09-30). To fix it by hand, on a branch: \`pnpm update $package\` for \`pnpm-lock.yaml\`, or \`npm update $package\` in \`fsaunpack/\` for its lockfile, then check that \`git diff\` changes nothing but that package, and open a pull request. \`docs/maintenance.md\` has the details.

          This issue closes itself once none of these alerts is open: fixed on \`main\`, or dismissed on the Security tab. Closing it by hand skips them: an alert this issue lists is not raised again, though a new one for \`$package\` is.

          <!-- alerts: $list -->
          EOF
            } > "$T/body.md"

            if [ "$open" != 0 ]; then
              gh issue edit "$open" --body-file "$T/body.md"
              links=$(for n in $new; do printf '[alert %s](%s/%s) ' "$n" "$ALERTS" "$n"; done)
              if [ "$(wc -w <<< "$new")" -eq 1 ]; then what='Another security alert'; else what='More security alerts'; fi
              gh issue comment "$open" --body "@$OWNER $what for \`$package\`, with no pull request that fixes it: ${links% }. The list above now includes it."
              echo "Added alert(s) $new to #$open ($package)"
            else
              url=$(gh issue create --title "$PREFIX$package" --assignee "$OWNER" --body-file "$T/body.md")
              echo "Opened $url ($package: alerts $list)"
            fi
          done < "$T/due.tsv"

      # A failed run of this workflow is emailed only to whoever started it (for the schedule,
      # whoever last changed the cron line): one issue while it is open, assigned and
      # @mentioning the owner, as toolchain-updates.yml does. A failure while it is open adds a
      # comment to it.
      - name: Report this workflow's own failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Security alerts workflow failed'
        run: |
          set -euo pipefail
          # A failure while the issue is open is a comment on it with this run's link, so the
          # issue shows each failure, not only the first. When the issues cannot be read, a
          # second issue is better than none.
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s Failed again: %s\n' "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          printf '@%s security-alerts.yml failed: %s\n\nThe run log names the failed command. Until it is fixed, a Dependabot alert with no pull request raises no issue. Close this issue once it is fixed; a later failure opens a new one.\n' \
            "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

  # The update pull requests, once a day. Dependabot fails quietly in another way too: once an
  # entry of .github/dependabot.yml has its open-pull-requests-limit of pull requests open, it
  # opens no more for that entry, not even for a new release, and tells no one. And an update
  # pull request can stay red, parked for a migration, with nobody at it. (2026-10-20)
  watch:
    name: Watch the update pull requests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read        # main's .github/dependabot.yml, for each entry's limit
      pull-requests: read   # the open pull requests
      issues: write         # the "Update pull requests piling up" and "Migration: ..." issues
      actions: write        # start update-prs.yml again on a pull request held for new releases
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Close the migration issues of closed pull requests
        run: |
          set -euo pipefail
          # update-prs.yml opens "Migration: <what> <version>" when CI fails twice on an update
          # pull request, with the pull request's number in a marker, and closes it once CI
          # passes there. One whose pull request was merged or closed meanwhile is closed here.
          # shellcheck disable=SC2016 # $m is jq's
          gh issue list --state open --limit 200 --json number,title,body,author \
            --jq '.[] | select(.author.login == "app/github-actions" and (.title | startswith("Migration: "))) | ((.body // "") | capture("<!-- migration-pr: (?<pr>[0-9]+) -->")) as $m | "\(.number) \($m.pr)"' \
            > "$RUNNER_TEMP/migrations.txt"
          # One that cannot be read or closed now (or was closed meanwhile) stops neither the
          # others nor the steps below: the next day's run tries again.
          while read -r issue pr <&3; do
            if ! state=$(gh pr view "$pr" --json state --jq .state); then
              echo "::warning::#$pr could not be read; #$issue waits for the next run."
              continue
            fi
            case $state in
              MERGED) gh issue close "$issue" --reason completed --comment "#$pr was merged. Closing." ||
                echo "::warning::Could not close #$issue." ;;
              CLOSED) gh issue close "$issue" --reason 'not planned' --comment "#$pr was closed without a merge. Closing." ||
                echo "::warning::Could not close #$issue." ;;
              *) echo "#$issue: #$pr is still open." ;;
            esac
          done 3< "$RUNNER_TEMP/migrations.txt"

      - name: Decide again on update pull requests held for new releases
        run: |
          set -euo pipefail
          # update-prs.yml holds back an update pull request whose lockfile adds a package
          # version under 3 days old, and its comment says when the youngest is old enough, with
          # the CI run and the commit it decided on: <!-- update-prs-recheck: <time> <run>
          # <commit> -->. Once that time has passed, with the pull request still at that commit,
          # update-prs.yml is started again on that run, as ci.yml's hand-off starts it, and
          # decides as it does after CI. A newer commit has a CI run of its own, which decides.
          now=$(date -u +%s)
          gh pr list --state open --limit 200 --json number,headRefName,headRefOid,isCrossRepository \
            --jq '.[] | select((.isCrossRepository | not) and (.headRefName | test("^(dependabot|toolchain|patched)/"))) | "\(.number) \(.headRefName) \(.headRefOid)"' \
            > "$RUNNER_TEMP/prs.txt"
          while read -r number branch head <&3; do
            # The last comment update-prs.yml made on it, found as update-prs.yml finds it.
            gh api --paginate "repos/$GH_REPO/issues/$number/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- update-prs: "))) | {body}' \
              > "$RUNNER_TEMP/ours.jsonl"
            recheck=$(jq -rs 'last | .body // ""' "$RUNNER_TEMP/ours.jsonl" |
              sed -n 's/^<!-- update-prs-recheck: \([0-9][0-9]*\) \([0-9][0-9]*\) \([0-9a-f]\{40\}\) -->$/\1 \2 \3/p' | tail -n 1)
            if [ -z "$recheck" ]; then continue; fi
            read -r at run sha <<< "$recheck"
            if [ "$sha" != "$head" ]; then
              echo "#$number moved on from ${sha:0:8}: the CI run of its new commit decides."
            elif [ "$at" -gt "$now" ]; then
              echo "#$number: its youngest new package version is 3 days old at $(date -u -d "@$at" '+%Y-%m-%d %H:%M UTC')."
            else
              echo "#$number: its new package versions are 3 days old now. Starting update-prs.yml on CI run $run."
              gh workflow run update-prs.yml --ref main -f "run_id=$run" -f "branch=$branch"
            fi
          done 3< "$RUNNER_TEMP/prs.txt"

      - name: Open, update or close the piling-up issue
        env:
          TITLE: 'Update pull requests piling up'
        run: |
          set -euo pipefail
          T=$RUNNER_TEMP
          now=$(date -u +%s)

          # Each entry of main's .github/dependabot.yml: its ecosystem, its directories and its
          # open-pull-requests-limit (Dependabot's default, 5, when it names none), a line each.
          # Read as the file is written: an entry starts at "  - package-ecosystem:", its keys
          # are indented four spaces, an item of its directories six.
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/.github/dependabot.yml?ref=main" \
            > "$T/dependabot.yml"
          awk '
            function value(s) { sub(/^[^:]*:[ \t]*/, "", s); sub(/[ \t]+#.*$/, "", s); return s }
            function flush() { if (eco != "") printf "%s\t%s\t%s\n", eco, dirs, (limit == "" ? 5 : limit) }
            /^  - package-ecosystem:/ { flush(); eco = value($0); dirs = ""; limit = ""; list = 0; next }
            list && /^      - / { d = $0; sub(/^      - /, "", d); sub(/[ \t]+#.*$/, "", d); dirs = dirs (dirs == "" ? "" : " ") d; next }
            # a comment or a blank line inside the list is no end of it
            list && /^[ \t]*(#.*)?$/ { next }
            { list = 0 }
            eco != "" && /^    directory:/ { dirs = value($0); next }
            eco != "" && /^    directories:/ { list = 1; next }
            eco != "" && /^    open-pull-requests-limit:/ { limit = value($0); next }
            END { flush() }' "$T/dependabot.yml" | tr -d "\"'" > "$T/entries.tsv"
          jq -R -s '[split("\n")[] | select(. != "") | split("\t") | {eco: .[0], dirs: (.[1] | split(" ")), limit: (.[2] | tonumber)}]' \
            "$T/entries.tsv" > "$T/entries.json"
          if [ "$(jq 'length' "$T/entries.json")" = 0 ] || jq -e 'any(.[]; .dirs == [])' "$T/entries.json" > /dev/null; then
            echo "main's .github/dependabot.yml could not be read as this step expects:" >&2
            cat "$T/entries.tsv" >&2
            exit 1
          fi
          cat "$T/entries.tsv"

          gh pr list --state open --limit 200 --json number,headRefName,author,labels,isCrossRepository > "$T/prs.json"

          # The entries at their limit minus 2 (at least 2, or the limit if that is lower: with
          # docker's 2, the limit itself), a table row each. Dependabot names a branch
          # dependabot/<package manager>/<directory, for one that is not the root>/..., a path
          # segment's leading dot written "dot-" (git refuses one): a pull request counts for the
          # entry of its package manager whose directory its branch names, else for the one of
          # the root. Every open one counts, security updates too, so this warns no later than
          # Dependabot stops.
          # shellcheck disable=SC2016 # backticks are Markdown
          jq -r --slurpfile e "$T/entries.json" '
            def manager: if . == "npm" then "npm_and_yarn" else gsub("-"; "_") end;
            def prefix: ltrimstr("/") | sub("[*].*$"; "") | gsub("(?<s>^|/)[.]"; "\(.s)dot-")
              | if . == "" or endswith("/") then . else . + "/" end;
            ($e[0] | to_entries | map(.value + {i: .key, manager: (.value.eco | manager)})) as $entries
            | [.[] | select((.isCrossRepository | not) and .author.login == "app/dependabot" and (.headRefName | startswith("dependabot/")))
               | (.headRefName | split("/")) as $parts
               | ($parts[2:] | join("/")) as $rest
               | [$entries[] | select(.manager == $parts[1])] as $c
               | (if ($c | length) == 1 then $c[0].i
                  else ([$c[] | select(any(.dirs[]; prefix as $p | $p != "" and ($rest | startswith($p))))]
                        + [$c[] | select(any(.dirs[]; . == "/"))])[0].i end) as $i
               | {number, entry: $i}] as $prs
            | $entries[]
            | .i as $i
            | [$prs[] | select(.entry == $i) | .number] as $open
            | (if .limit - 2 >= 2 then .limit - 2 else ([.limit, 2] | min) end) as $at
            | select(.limit > 0 and ($open | length) >= $at)
            | "| \(.eco) | `\(.dirs | join("`, `"))` | \($open | length) | \(.limit) | \($open | map("#\(.)") | join(", ")) |"' \
            "$T/prs.json" > "$T/full.md"

          # The update pull requests red for more than 14 days: since the ci-failed label
          # (update-prs.yml's, on while CI fails) last went on after it last came off.
          jq -r '.[] | select((.isCrossRepository | not) and (.headRefName | test("^(dependabot|toolchain|patched)/")) and any(.labels[]; .name == "ci-failed")) | .number' \
            "$T/prs.json" > "$T/red.txt"
          : > "$T/red.md"
          while read -r number <&3; do
            since=$(gh api --paginate "repos/$GH_REPO/issues/$number/events?per_page=100" \
              --jq '.[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "ci-failed") | "\(.event) \(.created_at)"' |
              awk '$1 == "unlabeled" {s = ""} $1 == "labeled" && s == "" {s = $2} END {print s}')
            if [ -z "$since" ]; then continue; fi
            age=$((now - $(date -u -d "$since" +%s)))
            if [ "$age" -gt $((14 * 24 * 60 * 60)) ]; then
              printf '| #%s | %s (%s days) |\n' "$number" "${since:0:10}" "$((age / 86400))" >> "$T/red.md"
            fi
          done 3< "$T/red.txt"

          open=$(gh issue list --state open --limit 200 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and .author.login == "app/github-actions")][0].number // empty')
          if [ ! -s "$T/full.md" ] && [ ! -s "$T/red.md" ]; then
            echo 'No Dependabot entry is near its limit, and no update pull request has been red for more than 14 days.'
            if [ -n "$open" ]; then
              gh issue close "$open" --reason completed \
                --comment 'No Dependabot entry is near its limit any more, and no update pull request has been red for more than 14 days. Closing.'
            fi
            exit 0
          fi
          # shellcheck disable=SC2016 # backticks are Markdown
          {
            printf '@%s Update pull requests are piling up, and Dependabot tells no one.\n\n' "$OWNER"
            if [ -s "$T/full.md" ]; then
              printf '**Near the limit.** Once an entry of `.github/dependabot.yml` has its `open-pull-requests-limit` of pull requests open, Dependabot opens no more for it, not even for a new release, until some are merged or closed. This warns at the limit minus 2 (at least 2).\n\n'
              printf '| Ecosystem | Directories | Open | Limit | Pull requests |\n| --- | --- | --- | --- | --- |\n'
              cat "$T/full.md"
              printf '\n'
            fi
            if [ -s "$T/red.md" ]; then
              printf '**Red for more than 14 days.** CI has failed on these since then:\n\n'
              printf '| Pull request | Red since |\n| --- | --- |\n'
              cat "$T/red.md"
              printf '\n'
            fi
            printf 'Merge what is ready, and close what you will not take (for a Dependabot one, `@dependabot ignore this major version`, `this minor version` or `this dependency`). For a red one, its comment says what fails, and its "Migration: ..." issue, if it has one, what to do.\n\n'
            printf 'This issue is updated once a day, and closes itself once none of this holds.\n'
          } > "$T/body.md"
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file "$T/body.md" > /dev/null
            echo "Updated #$open."
          else
            gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$T/body.md"
          fi

      # As the check's report above, for this job: one issue while it is open, a comment on it
      # for each later failure.
      - name: Report the watch's own failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Update PR watch failed'
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s Failed again: %s\n' "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          printf '@%s The daily watch of the update pull requests (security-alerts.yml, job "Watch the update pull requests") failed: %s\n\nThe run log names the failed command. Until it is fixed, migration issues of closed pull requests stay open, pull requests held for new releases are not decided again, and piling-up pull requests raise no issue. Close this issue once it is fixed; a later failure opens a new one.\n' \
            "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

name: Security alerts

# Dependabot opens a pull request for a security fix, and update-prs.yml tells the owner
# whether it is ready to merge. When Dependabot cannot make the fix - a package the lockfile holds at
# several majors, as brace-expansion was (2026-09-30) - its "Dependabot Updates" run fails
# where nobody looks and the alert stays open on the Security tab, with GitHub's alert email
# as the only notice. So once a day this reads the repository's open Dependabot alerts. A
# package with an alert over 6 hours old (Dependabot's pull request comes within minutes)
# and no open Dependabot pull request naming it gets one issue, "Security alert: <package>",
# assigned to the owner and @mentioning them, listing its alerts and how to fix them by
# hand. A later alert for that package is added to the open issue with a comment.
#
# The issue closes itself once none of the package's alerts is open: fixed on main (GitHub
# marks an alert fixed once main's lockfile no longer has the version) or dismissed. A
# push to main that changes a lockfile waits up to 10 minutes for that; the daily run
# closes what it missed. Closing the issue by hand skips the alerts it lists: the
# `<!-- alerts: ... -->` line in its body records them, and an alert an issue has listed,
# open or closed, is never raised again.
#
# A third route: when the fix is mechanical - the alert is on pnpm-lock.yaml, a patched
# version exists, and the package can be floored in pnpm-workspace.yaml's `overrides` - the
# workflow makes the fix itself, in three jobs. "check" (below) plans the floors and reads
# the repo; it writes only its issues. "install" resolves pnpm-lock.yaml with the floors
# applied, in a job whose token has contents: read and nothing else - it edits the
# security-critical manifests and must not be able to push, merge, dispatch or write. The
# third job, "publish", is the only writer: it force-pushes the branch security/overrides,
# keeps one rolling pull request open on it ("Security fixes: override floors"), and starts
# ci.yml on the branch by dispatch (a GITHUB_TOKEN push starts no workflow, so the dispatch
# is CI's only path there). Alerts the plan declines - cross-major holds, no patched
# version, manifest elsewhere - stay on the issue route above, with the reason in the issue
# body. Alerts whose floor pnpm provably cannot resolve are demoted from the run's pull
# request into "Security alert: <package>" issues, with the reason and the alerts marker.
# A transient install failure (network, registry outage) takes no action anywhere: nothing
# is committed, nothing demoted, and the next run re-routes from scratch. An empty plan
# closes an open rolling pull request with the fate of each of its alerts (the states are
# recorded by check; publish has no alerts scope to fetch them itself). Closing the pull
# request by hand without merging declines its alerts (they are raised as issues); a close
# by this workflow marks the body <!-- security-overrides: closed-by-run --> so the next run
# does not read it as a decline.
#
# The second job, "watch" (daily and by hand, not on a push), looks after the open update
# pull requests: it opens "Update pull requests piling up" when a Dependabot entry nears its
# open-pull-requests-limit or an update has been red for over 14 days, closes the migration
# issues update-prs.yml opened for pull requests merged or closed since, and starts
# update-prs.yml again on a pull request it held back for new releases once they are 3 days old.

on:
  schedule:
    - cron: '30 6 * * *'
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - fsaunpack/package-lock.json
  workflow_dispatch:

permissions: {}  # each job asks for what it needs

concurrency:
  group: security-alerts
  cancel-in-progress: false

jobs:
  check:
    name: Check the open Dependabot alerts and plan the floors
    permissions:
      contents: read         # checkout main: the plan is computed off the real lockfile
      vulnerability-alerts: read  # list the Dependabot alerts (and read a rolling PR alert's state)
      pull-requests: read  # see which packages an open Dependabot pull request updates,
                           # and read the rolling override pull requests on security/overrides
      issues: write  # open, update and close the "Security alert" issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # A string; '' when the plan never ran (push). Every downstream gate reads it with
      # == 'true', so '' means "no plan" - never compare with != 'true'.
      has_plan: ${{ steps.route.outputs.has_plan }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      EVENT: ${{ github.event_name }}
      PREFIX: 'Security alert: '
      BRANCH: security/overrides
    steps:
      # The plan reads pnpm-lock.yaml and pnpm-workspace.yaml off a real tree. Nothing in
      # this job pushes, so no credential is left behind in .git/config either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Open, update and close the issues
        id: route
        run: |
          set -euo pipefail
          T=$RUNNER_TEMP
          ALERTS="https://github.com/$GH_REPO/security/dependabot"

          # The open alerts, and every issue this workflow ever opened, open or closed, with
          # the alerts its body lists. A list of issues, not a search: the search index can
          # lag behind an issue opened minutes ago. The issues endpoint lists pull requests
          # too, and pages through all of them.
          fetch_alerts() {
            gh api --paginate "repos/$GH_REPO/dependabot/alerts?state=open&per_page=100" \
              --jq '.[] | {number, created_at, package: .dependency.package.name, manifest: .dependency.manifest_path, severity: .security_advisory.severity, summary: .security_advisory.summary, range: .security_vulnerability.vulnerable_version_range, patched: .security_vulnerability.first_patched_version.identifier}' \
              | jq -s . > "$T/alerts.json"
          }
          fetch_issues() {
            gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" \
              --jq '.[] | select(.pull_request == null and .user.login == "github-actions[bot]" and (.title | startswith(env.PREFIX))) | {number, state, package: (.title | ltrimstr(env.PREFIX)), listed: [(.body // "") | capture("<!-- alerts: (?<n>[0-9 ]*) -->") | .n | splits(" +") | select(. != "") | tonumber]}' \
              | jq -s . > "$T/issues.json"
          }

          # Close every open issue whose package has no open alert left, naming what became
          # of each alert it listed. Alert numbers are written "alert 43", never "#43":
          # GitHub links #43 to issue 43.
          close_done() {
            jq -r --slurpfile a "$T/alerts.json" \
              '.[] | select(.state == "open") | select(.package as $p | any($a[0][]; .package == $p) | not) | [.number, .package, (.listed | map(tostring) | join(" "))] | @tsv' \
              "$T/issues.json" > "$T/done.tsv"
            while IFS=$'\t' read -r number package listed; do
              {
                # shellcheck disable=SC2016 # backticks are Markdown
                printf 'No Dependabot alert for `%s` is open any more:\n\n' "$package"
                for n in $listed; do
                  printf -- '- [alert %s](%s/%s): %s\n' "$n" "$ALERTS" "$n" "$(gh api "repos/$GH_REPO/dependabot/alerts/$n" --jq .state)"
                done
              } > "$T/comment.md"
              gh issue close "$number" --reason completed --comment "$(cat "$T/comment.md")"
              echo "Closed #$number ($package)"
            done < "$T/done.tsv"
          }

          fetch_alerts
          fetch_issues
          close_done

          if [ "$EVENT" = push ]; then
            # GitHub marks the alerts fixed soon after the push (the 12 of 2026-09-30 within
            # 9 seconds): until then, the open issues whose package still has an open alert
            # are looked at again every 30 seconds, for up to 10 minutes. A push that fixed
            # none of them waits the whole 10 minutes.
            for _ in $(seq 1 20); do
              waiting=$(jq --slurpfile a "$T/alerts.json" \
                '[.[] | select(.state == "open") | select(.package as $p | any($a[0][]; .package == $p))] | length' \
                "$T/issues.json")
              if [ "$waiting" -eq 0 ]; then break; fi
              echo "$waiting open issue(s) still have an open alert; looking again in 30 seconds."
              sleep 30
              fetch_alerts
              fetch_issues
              close_done
            done
            exit 0
          fi

          # The packages an open Dependabot pull request updates: Dependabot is fixing those,
          # and update-prs.yml tells the owner about the pull request. Read from the parts
          # Dependabot writes itself - the title ("Bump <package> from ..."), the links before
          # the first <details> ("Bumps [<package>](...)", a grouped update's list, an
          # ancestor it updates too) and a grouped update's "Updates `<package>` from ..."
          # lines - not from the release notes and commits quoted below them. A name matched
          # by mistake only holds the issue back until that pull request is merged or closed.
          # shellcheck disable=SC2016 # backticks are Markdown, matched by jq
          gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.user.login == "dependabot[bot]") | (.title | capture("^Bump (?<p>\\S+) from ") | .p), ((.body // "") | (split("<details>")[0] // "") | scan("\\[([^\\]\\[]+)\\]\\(") | .[0]), ((.body // "") | scan("(?m)^Updates `([^`]+)` from ") | .[0])' \
            | jq -R -s 'split("\n") | map(select(. != "")) | unique' > "$T/pr-packages.json"

          # --- the override route: floors in pnpm-workspace.yaml, pnpm-lock.yaml only -------
          # This step only plans (read the repo, write its issues). The manifest edit is
          # resolved and verified by the tokenless "install" job, and "publish" - the only
          # writer - force-pushes the branch and keeps one rolling pull request open on it.
          #
          # Every pull request on the rolling branch, open or closed. Match the author too:
          # somebody else's security/overrides branch must not be adopted (and pushed over).
          # The open pull request's body is an OUTPUT of this workflow, never routing input:
          # reading its marker would empty the plan, close the PR, re-route its alerts and
          # reopen it - an open/close oscillation. Only closed-without-merging bodies are
          # decline inputs, and only when this workflow did not close them itself (the
          # closed-by-run marker): those alerts belong to the owner and go to issues.
          gh api --paginate "repos/$GH_REPO/pulls?head=${GH_REPO%%/*}:$BRANCH&state=all&per_page=100" \
            --jq '.[] | {number, state, merged_at, author: .user.login, head_sha: .head.sha, body: (.body // "")}' \
            | jq -s . > "$T/override-prs.json"

          # The declines: closed by a human, unmerged, not marked closed-by-run. (The marker
          # is what keeps a run-closed PR from being read as an owner decline when a
          # Dependabot PR that had superseded it later dies.)
          jq -c '[
            .[] | select(.state == "closed" and .merged_at == null and .author == "github-actions[bot]"
                 and ((.body | contains("<!-- security-overrides: closed-by-run -->")) | not))
            | (.body | scan("<!-- alerts: ([0-9 ]+) -->") | .[0]) as $ns
            | $ns | splits(" +") | select(. != "")
            | {alert: (tonumber),
               reason: "the owner closed the override pull request without merging, so this one is yours to fix by hand"}
          ] | unique_by(.alert)' "$T/override-prs.json" > "$T/declined-owner.json"

          # The route pool: the same per-alert gates the due computation below applies (open,
          # over 6 hours old, package not named by an open Dependabot pull request), minus
          # what the ledger already owns. An alert an issue has listed, open or closed, is
          # never raised again - so the robot must not claim it either, or issue and pull
          # request would both claim it, and the PR would shed it on the next run.
          jq --slurpfile i "$T/issues.json" --slurpfile w "$T/pr-packages.json" --slurpfile o "$T/declined-owner.json" --argjson now "$(date -u +%s)" '
            [.[] | select((.created_at | fromdateiso8601) < $now - 21600)
                 | select(.package as $p | any($w[0][]; . == $p) | not)
                 | select((.number as $n | any($i[0][].listed[]; . == $n)) | not)
                 | select((.number as $n | any($o[0][]; .alert == $n)) | not)]' \
            "$T/alerts.json" > "$T/alerts-route.json"

          # Plan the floors: what is claimable, each floor's alerts, declines with reasons,
          # the base commit. Files only - the API calls are the ones above, in this step.
          mkdir -p "$T/plan-bundle"
          node tools/security-overrides.mjs plan "$T/alerts-route.json" "$T/plan-bundle"

          # Fold the owner declines into routing.json: two decline ledgers, one set of
          # consumers (the issue prose below). Belt and braces: the handled list must never
          # hold an alert an owner declined.
          jq --slurpfile o "$T/declined-owner.json" '
            . + {handled: (((.handled | map(tonumber)) - [$o[0][].alert]) | unique),
                 declined: (((.declined // []) + $o[0]) | unique_by(.alert))}' \
            "$T/plan-bundle/routing.json" > "$T/routing.json"
          mv "$T/routing.json" "$T/plan-bundle/routing.json"

          # The open rolling pull request's alerts, each with its state recorded now, so
          # publish can write per-alert fates when it closes the PR on an empty plan.
          # Publish's token has no vulnerability-alerts scope; fetching there would 403.
          # (The open PR's marker is read to DESCRIBE its alerts in that fate comment only;
          # it never steers routing.)
          jq -c '([.[] | select(.state == "open" and .author == "github-actions[bot]")][0]) // null' \
            "$T/override-prs.json" > "$T/open-override-pr.json"
          prnumber=$(jq -r '.number // 0' "$T/open-override-pr.json")
          if [ "$prnumber" != 0 ]; then
            : > "$T/oldpr-alerts.jsonl"
            for n in $(jq -r '.body | scan("<!-- alerts: ([0-9 ]+) -->") | .[0]' "$T/open-override-pr.json"); do
              if state=$(gh api "repos/$GH_REPO/dependabot/alerts/$n" --jq .state); then :; else
                echo "::warning::alert $n's state could not be read; its fate comment will say so." >&2
                state=unknown
              fi
              jq -cn --argjson n "$n" --arg state "$state" '{n: $n, state: $state}' >> "$T/oldpr-alerts.jsonl"
            done
            jq -s --argjson number "$prnumber" \
              --arg head_sha "$(jq -r '.head_sha // ""' "$T/open-override-pr.json")" \
              '{number: $number, head_sha: $head_sha, alerts: .}' \
              "$T/oldpr-alerts.jsonl" > "$T/plan-bundle/old-pr.json"
          else
            echo '{"number": 0, "head_sha": "", "alerts": []}' > "$T/plan-bundle/old-pr.json"
          fi

          if [ "$(jq '.handled | length' "$T/plan-bundle/routing.json")" -gt 0 ]; then
            echo "has_plan=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_plan=false" >> "$GITHUB_OUTPUT"
          fi

          # Per package: the alerts that are due (over 6 hours old, no pull request), the
          # ones no issue has listed yet, and the open issue, if there is one. $handled
          # carries the alert numbers this run's plan claims for the pull request; they must
          # be dropped from BOTH $new and $list: dropping them from $new alone would still
          # write them into the open issue's <!-- alerts: ... --> marker, which claims an
          # alert for the issue for good (an alert an issue lists is never raised again) and
          # sheds it from the pull request on the next run. The routing ledger itself never
          # rides in the TSV: a fifth column here is swallowed by read's four variables into
          # $list, the marker stops matching, and the ledger loses those numbers - a
          # corruption hidden inside an HTML comment.
          jq -r --slurpfile i "$T/issues.json" --slurpfile w "$T/pr-packages.json" --slurpfile h "$T/plan-bundle/routing.json" --argjson now "$(date -u +%s)" '
            ($h[0].handled | map(tonumber)) as $handled
            | [.[] | select((.created_at | fromdateiso8601) < $now - 21600)
                 | select(.package as $p | any($w[0][]; . == $p) | not)]
            | group_by(.package)[]
            | .[0].package as $p
            | [.[].number] as $due
            | ($due - [$i[0][] | select(.package == $p) | .listed[]] - $handled) as $new
            | select($new | length > 0)
            | ([$i[0][] | select(.package == $p and .state == "open") | .number][0] // 0) as $open
            | ([$i[0][] | select(.number == $open) | .listed[]] + ($due - $handled) | unique) as $list
            | [$p, $open, ($new | map(tostring) | join(" ")), ($list | map(tostring) | join(" "))] | @tsv' \
            "$T/alerts.json" > "$T/due.tsv"

          while IFS=$'\t' read -r package open new list; do
            # The alerts it lists that are still open, as a table. The advisory's summary is
            # another project's text: a | in it is escaped, and a < too, as a
            # "<!-- alerts: ... -->" in it would hide the real list from the next run.
            jq -r --arg p "$package" --arg list "$list" --arg base "$ALERTS" '
              ($list | split(" ") | map(tonumber)) as $l
              | .[] | select(.package == $p and (.number as $n | any($l[]; . == $n)))
              | "| [\(.number)](\($base)/\(.number)) | \(.severity) | `\(.manifest)` | `\(.range)` | \(.patched // "none yet") | \((.summary // "") | gsub("[\r\n]+"; " ") | gsub("\\|"; "\\|") | gsub("<"; "&lt;")) |"' \
              "$T/alerts.json" > "$T/rows.md"

            # Why the robot did not take some of these alerts, from routing.json (never from
            # the TSV - see the due computation above). The section follows only the current
            # run's declines: once an alert is listed by an issue it leaves the route pool,
            # so its old reason is history, not bookkeeping.
            jq -r --arg list "$list" --arg base "$ALERTS" '
              ($list | split(" ") | map(select(. != "") | tonumber)) as $l
              | [.declined[]
                 | select(.alert as $n | any($l[]; . == $n))
                 | "- [alert \(.alert)](\($base)/\(.alert)): \(.reason | gsub("[\r\n]+"; " ") | gsub("\\|"; "\\|") | gsub("<"; "&lt;"))"]
              | select(length > 0) | .[]' \
              "$T/plan-bundle/routing.json" > "$T/why.md"

            {
              # shellcheck disable=SC2016 # backticks are Markdown
              printf '@%s Dependabot has open security alerts for `%s` and no pull request that fixes them:\n\n' "$OWNER" "$package"
              printf '| Alert | Severity | In | Vulnerable | Fixed in | Advisory |\n| --- | --- | --- | --- | --- | --- |\n'
              cat "$T/rows.md"
              cat <<EOF

          Dependabot opens a pull request for a security fix when it can; when it cannot, the failed "Dependabot Updates" run on the Actions tab says why (a package the lockfile holds at several majors fails, as brace-expansion did on 2026-09-30). To fix it by hand, on a branch: \`pnpm update $package\` for \`pnpm-lock.yaml\`, or \`npm update $package\` in \`fsaunpack/\` for its lockfile, then check that \`git diff\` changes nothing but that package, and open a pull request. \`docs/maintenance.md\` has the details.
          EOF
              if [ -s "$T/why.md" ]; then
                printf '\n**Why these are not automatic**\n\n'
                cat "$T/why.md"
              fi
              cat <<EOF

          This issue closes itself once none of these alerts is open: fixed on \`main\`, or dismissed on the Security tab. Closing it by hand skips them: an alert this issue lists is not raised again, though a new one for \`$package\` is.

          <!-- alerts: $list -->
          EOF
            } > "$T/body.md"

            if [ "$open" != 0 ]; then
              gh issue edit "$open" --body-file "$T/body.md"
              links=$(for n in $new; do printf '[alert %s](%s/%s) ' "$n" "$ALERTS" "$n"; done)
              if [ "$(wc -w <<< "$new")" -eq 1 ]; then what='Another security alert'; else what='More security alerts'; fi
              gh issue comment "$open" --body "@$OWNER $what for \`$package\`, with no pull request that fixes it: ${links% }. The list above now includes it."
              echo "Added alert(s) $new to #$open ($package)"
            else
              url=$(gh issue create --title "$PREFIX$package" --assignee "$OWNER" --body-file "$T/body.md")
              echo "Opened $url ($package: alerts $list)"
            fi
          done < "$T/due.tsv"

      - name: Share the plan bundle with install and publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Every non-push run uploads the bundle, idle or not: publish's empty-plan close path
        # reads plan.json and old-pr.json from it, and downloading a missing artifact would
        # hard-fail the route jobs on every idle day. Needs to live only until publish has
        # read it. Nothing on push: the route takes no action on push.
        if: github.event_name != 'push'
        with:
          name: plan
          path: ${{ runner.temp }}/plan-bundle/
          retention-days: 1

      # A failed run of this workflow is emailed only to whoever started it (for the schedule,
      # whoever last changed the cron line): one issue while it is open, assigned and
      # @mentioning the owner, as toolchain-updates.yml does. A failure while it is open adds a
      # comment to it.
      - name: Report this workflow's own failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Security alerts workflow failed'
        run: |
          set -euo pipefail
          # A failure while the issue is open is a comment on it with this run's link, so the
          # issue shows each failure, not only the first. When the issues cannot be read, a
          # second issue is better than none.
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s Failed again: %s\n' "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          printf '@%s security-alerts.yml failed: %s\n\nThe run log names the failed command. Until it is fixed, a Dependabot alert with no pull request raises no issue. Close this issue once it is fixed; a later failure opens a new one.\n' \
            "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

  # The plan's floors are tried here: pnpm resolves the lockfile with the overrides applied,
  # and the module verifies the result against the plan. The job deliberately has no token
  # above contents: read, no GH_TOKEN/PREFIX env, nothing to talk to the API with: it edits
  # the security-critical manifests, and a stray `gh` call could not succeed if it tried.
  install:
    name: Try the floors in a lockfile-only install
    needs: check
    if: needs.check.outputs.has_plan == 'true'
    permissions:
      contents: read   # the only scope minted to this job; checkout's token is not persisted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      failure_class: ${{ steps.try.outputs.failure_class }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: plan
      - name: Read the plan's base commit
        id: planmeta
        run: |
          set -euo pipefail
          echo "base_sha=$(jq -r .base_sha plan/plan.json)" >> "$GITHUB_OUTPUT"
      # Exactly the commit the plan was computed against, so the resolutions verified here
      # are the ones publish will push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.planmeta.outputs.base_sha }}
          persist-credentials: false

      # The pnpm package.json pins (packageManager): another would rewrite the whole lockfile.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Try the floored install and verify the result
        id: try
        run: |
          set -euo pipefail
          T=$RUNNER_TEMP
          # The result bundle is assembled first, so even a step that crashes later leaves the
          # plan for publish's demote and close paths to read. main's lockfile goes along:
          # verify compares everything but the floored packages with it.
          mkdir -p result
          cp plan/plan.json plan/routing.json plan/old-pr.json result/
          cp pnpm-lock.yaml result/before.lock.yaml

          if jq -e '.floors | length > 0' plan/plan.json > /dev/null; then
            [ -f plan/pnpm-workspace.yaml ] || { echo 'plan.json has floors but the bundle carries no edited pnpm-workspace.yaml' >&2; exit 1; }
            cp plan/pnpm-workspace.yaml pnpm-workspace.yaml
          fi

          # --lockfile-only: metadata resolution only, no package code ever lands.
          # --no-frozen-lockfile: pnpm freezes the lockfile whenever CI is set, and a floored
          # tree is exactly the case that check refuses - without the flag the failure is
          # misread as transient and the route reds every day.
          if ! out=$(pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile 2>&1); then
            printf '%s\n' "$out" > result/install.log
            # Deterministic means the registry provably holds no version that fits: it will
            # fail tomorrow too, so the alerts go to issues. Anything else is transient - a
            # network blip must not demote an alert for good, so the class decides only
            # between "demote" and "walk away for today".
            if grep -Eq 'ERR_PNPM_NO_MATCHING_VERSION|ETARGET|No matching version found' result/install.log; then
              class=deterministic
            else
              class=transient
            fi
            echo "pnpm install failed ($class); see result/install.log."
            # Attribute the failure to floors the error names, matched by name or selector.
            # A miss demotes every claimed alert (the safe direction); a false match only
            # widens the demote by one package.
            jq -c '.floors[]' result/plan.json \
              | while read -r spec; do
                  name=$(jq -r .name <<<"$spec"); selector=$(jq -r .selector <<<"$spec")
                  if grep -qF -- "$name" result/install.log || grep -qF -- "$selector" result/install.log; then
                    printf '%s\n' "$spec"
                  fi
                done > "$T/attributed.jsonl"
            [ -s "$T/attributed.jsonl" ] || jq -c '.floors[]' result/plan.json > "$T/attributed.jsonl"
            jq -n --arg class "$class" --slurpfile f "$T/attributed.jsonl" '
              {failure_class: $class,
               failed: [$f[0][] | {package: .name, selector: .selector, floor: .floor, alerts: .alerts,
                        reason: ("pnpm cannot resolve the floor for `" + .name + "` (" + .selector + "): nothing published satisfies it. Fix the package by hand, or wait for a release that fits the floor.")}]}' \
              > result/report.json
            echo "failure_class=$class" >> "$GITHUB_OUTPUT"
            # A transient failure decides nothing, but the alerts this run took got no issue
            # either: the job fails, so the report below tells the owner, every day it happens.
            if [ "$class" = transient ]; then
              echo '::error::pnpm install failed for a reason that may pass (network, registry); the next run tries again.' >&2
              exit 1
            fi
            exit 0
          fi

          cp pnpm-lock.yaml result/pnpm-lock.yaml
          cp pnpm-workspace.yaml result/pnpm-workspace.yaml
          echo 'The floored tree resolved; the diff:'
          git diff --stat
          git diff -- pnpm-lock.yaml pnpm-workspace.yaml > result/diff.patch

          # verify reads plan.json and the new lockfile and nothing else - no git, no API, no
          # network: this job's token has nothing beyond contents: read, and a verify that
          # reached for the alerts would simply red a job that cannot succeed at it. Problems
          # here are module/plan bugs, not alert facts, so they fail the run (the route's
          # report opens an issue) instead of demoting anything.
          node tools/security-overrides.mjs verify result
          # The report publish reads: failure_class '' means "publish".
          echo '{"failure_class": "", "failed": []}' > result/report.json
          echo "failure_class=" >> "$GITHUB_OUTPUT"
      - name: Share the install result with publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # always(): the bundle is publish's and the failure report's evidence even when the
        # step crashed after assembling it.
        if: always()
        with:
          name: result
          path: result/
          retention-days: 1

  # The only writer. Never runs on push (the route takes no action there, and an always()-
  # alone gate would close the rolling PR on every lockfile push to main), runs when prepare
  # succeeded even if install was skipped (an empty plan must still close yesterday's PR
  # with per-alert fates), and does not run when install failed (a crashed install is not a
  # plan to publish; the report job tells the owner).
  publish:
    name: Publish the floors
    needs: [check, install]
    if: always() && github.event_name != 'push' && needs.check.result == 'success' && (needs.install.result == 'success' || needs.install.result == 'skipped')
    permissions:
      contents: write        # force-push security/overrides
      pull-requests: write   # create/edit/close the rolling pull request
      actions: write         # start ci.yml on the branch (a GITHUB_TOKEN push starts nothing)
      issues: write          # demote issues with the alerts marker on deterministic failures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      PREFIX: 'Security alert: '
      BRANCH: security/overrides
      ALERTS_URL: https://github.com/${{ github.repository }}/security/dependabot
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # Exists on every non-push run: even the empty-plan close path reads plan.json,
        # routing.json and old-pr.json from it.
        with:
          name: plan
          path: plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.install.result == 'success'
        with:
          name: result
          path: result
      - name: Decide what publish has to do
        id: decide
        run: |
          set -euo pipefail
          # install skipped means the plan claimed nothing: the only business left is closing
          # a rolling pull request left open from a previous run.
          if [ ! -f result/report.json ]; then
            if [ "$(jq '.floors | length' plan/plan.json)" -ne 0 ]; then
              echo '::error::the plan has floors but install was skipped; refusing to guess what happened.' >&2
              exit 1
            fi
            echo "mode=close" >> "$GITHUB_OUTPUT"
            echo 'Nothing was claimed this run; close path.'
            exit 0
          fi
          class=$(jq -r '.failure_class // ""' result/report.json)
          case $class in
            '')
              echo "mode=publish" >> "$GITHUB_OUTPUT" ;;
            deterministic)
              echo "mode=demote" >> "$GITHUB_OUTPUT" ;;
            transient)
              # By design a transient failure takes no action anywhere - no push, no issue,
              # no ledger entry - so a network blip cannot permanently demote an alert.
              echo "mode=noop" >> "$GITHUB_OUTPUT"
              echo 'Transient failure; tomorrow runs again from scratch.' ;;
            *)
              echo "::error::unknown failure class '$class' in the install report." >&2
              exit 1 ;;
          esac
      - name: Push the branch and mind the rolling pull request
        if: steps.decide.outputs.mode == 'publish'
        run: |
          set -euo pipefail
          T=$RUNNER_TEMP

          # Refuse when main moved while this run planned: the lockfile was resolved against
          # exactly that commit, and pushing it onto a newer main would silently drop whoever
          # merged in the meantime. The next daily run replans on the new main; nothing is
          # lost by stepping aside, and a red run is the honest signal if this happens often.
          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          base_sha=$(jq -r .base_sha result/plan.json)
          if [ "$main_sha" != "$base_sha" ]; then
            # Not a failure: the next run plans on the new main. (Its alerts got no issue today.)
            echo "::warning::main moved while this run ran ($base_sha -> $main_sha); leaving the floors to the next run."
            exit 0
          fi
          base_tree=$(gh api "repos/$GH_REPO/commits/$base_sha" --jq .commit.tree.sha)

          # The commit is built through the API: no git credential is ever materialized in
          # this job, and the lockfile (+ the edited workspace when the plan wrote one) are
          # the only entries that may change.
          lock_blob=$(jq -cn --rawfile c result/pnpm-lock.yaml '{content: $c, encoding: "utf-8"}' \
            | gh api "repos/$GH_REPO/git/blobs" --input - --jq .sha)
          entries=$(jq -cn --arg sha "$lock_blob" \
            '[{path: "pnpm-lock.yaml", mode: "100644", type: "blob", sha: $sha}]')
          if [ -f result/pnpm-workspace.yaml ]; then
            ws_blob=$(jq -cn --rawfile c result/pnpm-workspace.yaml '{content: $c, encoding: "utf-8"}' \
              | gh api "repos/$GH_REPO/git/blobs" --input - --jq .sha)
            entries=$(jq -cn --argjson e "$entries" --arg sha "$ws_blob" \
              '$e + [{path: "pnpm-workspace.yaml", mode: "100644", type: "blob", sha: $sha}]')
          fi
          tree=$(jq -cn --argjson entries "$entries" --arg base "$base_tree" '{tree: $entries, base_tree: $base}' \
            | gh api "repos/$GH_REPO/git/trees" --input - --jq .sha)

          old_head=$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null) || old_head=''

          if [ "$tree" = "$base_tree" ] && [ -n "$old_head" ]; then
            # The tree does not change and the branch already carries the floors (a new alert
            # joined an existing floor): no commit, no push, no new CI run. The pull request
            # body below still moves with the claims.
            pushed=no
            head_sha=$old_head
          else
            message=$(jq -r '"Security floors: " + ([.floors[].name] | unique | join(", "))' result/plan.json)
            head_sha=$(jq -cn --arg tree "$tree" --arg parent "$base_sha" --arg m "$message" \
              '{tree: $tree, parents: [$parent], message: $m}' \
              | gh api "repos/$GH_REPO/git/commits" --input - --jq .sha)
            if [ -n "$old_head" ]; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$BRANCH" -f sha="$head_sha" -F force=true --jq .object.sha > /dev/null
            else
              gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$head_sha" --jq .ref > /dev/null
            fi
            pushed=yes
          fi

          # The claims table and the floors, in the issue table's shape. A summary is another
          # project's text: | and < are escaped, so a forged "<!-- alerts: ... -->" there
          # cannot shadow the real marker this body ends with.
          jq -r --arg base "$ALERTS_URL" '
            (.handled) as $h
            | .alerts[]
            | select(.number as $n | any($h[]; . == $n))
            | "| [\(.number)](\($base)/\(.number)) | \(.severity) | `\(.manifest)` | `\(.range)` | \(.patched // "none yet") | \((.summary // "") | gsub("[\r\n]+"; " ") | gsub("\\|"; "\\|") | gsub("<"; "&lt;")) |"' \
            result/plan.json > "$T/pr-rows.md"
          # Floor fields are the module's own strings, rendered for review.
          # shellcheck disable=SC2016 # backticks are Markdown
          jq -r '.floors[] | "| `\(.name)` | `\(.selector)` | \(.action) | \(.from // "-") | `\(.floor)` |"' \
            result/plan.json > "$T/pr-floors.md"
          marker=$(jq -r '.handled | map(tostring) | join(" ")' result/routing.json)
          {
            printf '@%s These alerts can be fixed without touching any package.json: flooring each package in `pnpm-workspace.yaml` `overrides` makes pnpm resolve the lockfile to the youngest version that satisfies every range it is pinned by. Only the packages below move.\n\n' "$OWNER"
            printf '| Alert | Severity | In | Vulnerable | Fixed in | Advisory |\n| --- | --- | --- | --- | --- | --- |\n'
            cat "$T/pr-rows.md"
            printf '\n| Package | Selector | Change | From | Floor |\n| --- | --- | --- | --- | --- |\n'
            cat "$T/pr-floors.md"
            cat <<EOF

          When CI passes on this pull request, merge it - the diff is exactly the floored packages' resolutions in \`pnpm-lock.yaml\`. To take the alerts over by hand instead, close this pull request without merging: the workflow raises them as \`Security alert: <package>\` issues and leaves them to you.

          This body is rewritten by each daily run; the alert-numbers comment at its end is the workflow's bookkeeping, not something to edit.
          EOF
            printf '<!-- alerts: %s -->\n' "$marker"
          } > "$T/pr-body.md"
          # Nothing in this body or in any comment here may ever carry an
          # <!-- update-prs-recheck: --> marker: that marker is what makes watch start
          # update-prs.yml on a pull request.

          pr_number=$(jq -r '.number // 0' plan/old-pr.json)
          if [ "$pr_number" != 0 ]; then
            if ! lstate=$(gh pr view "$pr_number" --json state --jq .state); then lstate=GONE; fi
          else
            lstate=NONE
          fi
          if [ "$pr_number" != 0 ] && [ "$lstate" = OPEN ]; then
            # Re-assert the fixed title: it is this route's marker, and it must never start
            # with "Security alert: " - that is the issue ledger's namespace.
            gh pr edit "$pr_number" --title 'Security fixes: override floors' --body-file "$T/pr-body.md" > /dev/null
            echo "Updated PR #$pr_number (push $pushed, head ${head_sha:0:8})."
          else
            url=$(gh pr create --head "$BRANCH" --title 'Security fixes: override floors' --body-file "$T/pr-body.md")
            echo "Opened $url"
          fi

          # Start CI when no run of ci.yml exists for exactly this head: a GITHUB_TOKEN push
          # starts nothing, so the dispatch is the only CI path here - and a dispatch that
          # failed last run (after the push) must be retried even though the head has not
          # moved since.
          # A pull_request run of a pull request this token opened waits for an approval and never
          # runs (action_required): it covers nothing.
          runs=$(HEAD_SHA="$head_sha" gh run list --workflow ci.yml --branch "$BRANCH" --limit 20 --json headSha,conclusion \
                   --jq '[.[] | select(.headSha == env.HEAD_SHA and .conclusion != "action_required" and .conclusion != "skipped")] | length') || runs=0
          if [ "$runs" -eq 0 ]; then
            gh workflow run ci.yml --ref "$BRANCH"
            # What the lockfile brings in, before the merge: the same review a pull_request run gets.
            gh workflow run dependency-review.yml --ref "$BRANCH"
            echo "Dispatched ci.yml and dependency-review.yml on $BRANCH (head ${head_sha:0:8})."
          else
            echo "ci.yml covers head ${head_sha:0:8} already; not dispatching."
          fi
      - name: Demote the alerts pnpm refused
        if: steps.decide.outputs.mode == 'demote'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          T=$RUNNER_TEMP
          # One issue per package, in the exact shape the daily loop writes: the title is
          # what the ledger matches on, and the <!-- alerts: ... --> marker is what makes a
          # demote permanent - an alert an issue lists (open or closed) is never raised
          # again. A demote issue without the marker would re-route its alerts every day,
          # rewriting the body and losing the failure reason each time.
          jq -r '[.failed[] | {package, alerts, reason}]
            | group_by(.package)[]
            | [.[0].package,
               ([.[].alerts[]] | unique | map(tostring) | join(" ")),
               ([.[].reason] | unique | join("; "))]
            | @tsv' result/report.json > "$T/demote.tsv"
          if [ ! -s "$T/demote.tsv" ]; then
            echo '::error::a deterministic failure demoted nothing; check the install step attribution.' >&2
            exit 1
          fi
          while IFS=$'\t' read -r package list reason; do
            jq -r --arg p "$package" --arg list "$list" --arg base "$ALERTS_URL" '
              ($list | split(" ") | map(tonumber)) as $l
              | .[] | select(.package == $p and (.number as $n | any($l[]; . == $n)))
              | "| [\(.number)](\($base)/\(.number)) | \(.severity) | `\(.manifest)` | `\(.range)` | \(.patched // "none yet") | \((.summary // "") | gsub("[\r\n]+"; " ") | gsub("\\|"; "\\|") | gsub("<"; "&lt;")) |"' \
              result/plan.json > "$T/rows.md"
            {
              # shellcheck disable=SC2016 # backticks are Markdown
              printf '@%s A floor was planned for `%s`, but the package manager would not install it, so these alerts come back to you:\n\n' "$OWNER" "$package"
              printf '| Alert | Severity | In | Vulnerable | Fixed in | Advisory |\n| --- | --- | --- | --- | --- | --- |\n'
              cat "$T/rows.md"
              printf '\nWhy: %s\n\n' "$reason"
              printf 'The run that failed is at %s; its "result" artifact holds the full package-manager log.\n\n' "$RUN_URL"
              printf 'To fix it by hand, on a branch: `pnpm update %s` for `pnpm-lock.yaml`, then check that `git diff` changes nothing but that package, and open a pull request. `docs/maintenance.md` has the details.\n\n' "$package"
              printf '<!-- alerts: %s -->\n' "$list"
            } > "$T/body.md"
            number=$(PACKAGE="$package" gh issue list --state open --limit 200 --json number,title \
              --jq '[.[] | select(.title == (env.PREFIX + env.PACKAGE))][0].number // empty')
            if [ -n "$number" ]; then
              # The same bookkeeping the daily loop does for a new alert on an open issue:
              # merge the numbers into the marker, sorted, then a short comment. A body
              # without a marker is repaired here rather than trusted: a ledger entry that
              # lists nothing is the corruption nobody can see.
              old=$(gh issue view "$number" --json body --jq .body | sed -n 's/.*<!-- alerts: \([0-9 ]\{1,\}\) -->.*/\1/p' | head -1)
              merged=$(jq -rn --arg old "$old" --arg new "$list" '
                (($old | split(" ") | map(select(. != "") | tonumber))
                 + ($new | split(" ") | map(tonumber)))
                | unique | map(tostring) | join(" ")')
              gh issue view "$number" --json body --jq .body > "$T/issue-body.md"
              if [ -n "$old" ]; then
                sed -i "s/<!-- alerts: $old -->/<!-- alerts: $merged -->/" "$T/issue-body.md"
              else
                printf '\n<!-- alerts: %s -->\n' "$merged" >> "$T/issue-body.md"
              fi
              gh issue edit "$number" --body-file "$T/issue-body.md" > /dev/null
              links=$(for n in $list; do printf '[alert %s](%s/%s) ' "$n" "$ALERTS_URL" "$n"; done)
              gh issue comment "$number" --body "@$OWNER ${links% }could not be installed automatically: $reason. The list above now includes them."
              echo "Demoted alerts $list onto #$number ($package)"
            else
              url=$(gh issue create --title "$PREFIX$package" --assignee "$OWNER" --body-file "$T/body.md")
              echo "Demoted alerts $list to $url ($package)"
            fi
          done < "$T/demote.tsv"

          # The rolling pull request, if open, must not outlive the demote: its floors are
          # the thing that failed. Mark the body closed-by-run BEFORE closing: this close is
          # the workflow's own doing, not an owner decline, and the next run must not read
          # it as one - the issues above own these alerts now.
          num=$(jq -r '.number // 0' plan/old-pr.json)
          if [ "$num" != 0 ]; then
            if ! lstate=$(gh pr view "$num" --json state --jq .state); then lstate=GONE; fi
            if [ "$lstate" = OPEN ]; then
              gh pr view "$num" --json body --jq .body > "$T/pr-body.md"
              if ! grep -q 'security-overrides: closed-by-run' "$T/pr-body.md"; then
                printf '\n<!-- security-overrides: closed-by-run -->\n' >> "$T/pr-body.md"
                gh pr edit "$num" --body-file "$T/pr-body.md" > /dev/null
              fi
              gh pr close "$num" --comment 'The floors for these alerts could not be installed; they are raised as "Security alert: <package>" issues instead. Closing this from the run is bookkeeping, not a decline.'
              echo "Closed PR #$num (run-closed)."
            else
              echo "PR #$num is $lstate already; nothing to close."
            fi
          else
            echo 'No rolling pull request open; nothing to close.'
          fi
      - name: Close the rolling pull request on an empty plan
        if: steps.decide.outputs.mode == 'close'
        run: |
          set -euo pipefail
          T=$RUNNER_TEMP
          num=$(jq -r '.number // 0' plan/old-pr.json)
          if [ "$num" = 0 ]; then
            echo 'No rolling pull request open; nothing to close.'
            exit 0
          fi
          # The owner may have closed or merged it while this run ran; neither is a failure.
          if ! lstate=$(gh pr view "$num" --json state --jq .state); then lstate=GONE; fi
          if [ "$lstate" != OPEN ]; then
            echo "PR #$num is $lstate already; nothing to close."
            exit 0
          fi
          # Per-alert fates from the states check recorded (publish has no
          # vulnerability-alerts scope - fetching .state here would 403), with the merged
          # routing ledger for the ones still open.
          jq -r --arg base "$ALERTS_URL" --slurpfile r plan/routing.json '
            .alerts[]
            | (.n) as $a
            | (([$r[0].declined[] | select(.alert == $a)][0].reason) // "") as $why
            | if   .state == "fixed"     then "- [alert \($a)](\($base)/\($a)): fixed on main."
              elif .state == "dismissed" then "- [alert \($a)](\($base)/\($a)): dismissed."
              elif .state == "unknown"   then "- [alert \($a)](\($base)/\($a)): its state could not be read while this run planned."
              elif $why != ""            then "- [alert \($a)](\($base)/\($a)): still open - \($why)."
              else "- [alert \($a)](\($base)/\($a)): still open - it is out of the automatic plan; it will be raised as an issue if nothing else fixes it."
              end' plan/old-pr.json > "$T/fates.md"
          {
            printf 'Closing this pull request from the run: nothing is automatable this run. Closing here is bookkeeping, not a decline. Where each alert stands:\n\n'
            if [ -s "$T/fates.md" ]; then cat "$T/fates.md"; else printf '(its body no longer lists alerts)\n'; fi
          } > "$T/comment.md"
          gh pr view "$num" --json body --jq .body > "$T/pr-body.md"
          if ! grep -q 'security-overrides: closed-by-run' "$T/pr-body.md"; then
            printf '\n<!-- security-overrides: closed-by-run -->\n' >> "$T/pr-body.md"
            gh pr edit "$num" --body-file "$T/pr-body.md" > /dev/null
          fi
          gh pr close "$num" --comment "$(cat "$T/comment.md")"
          echo "Closed PR #$num (empty plan; run-closed). The branch is left in place: the next non-empty plan force-pushes it back into shape."
      # The per-job failure reporters (check, watch) need issues: write, which install must
      # never hold; one extra job reports both route jobs - one mechanism, never two, or a
      # failure opens two issues for one thing.
  report:
    name: Report a route failure
    needs: [check, install, publish]
    if: failure() && (needs.install.result == 'failure' || needs.publish.result == 'failure')
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Report the route's own failure
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Security override route failed'
        run: |
          set -euo pipefail
          failed=''
          if [ "${{ needs.install.result }}" = failure ]; then failed="$failed install"; fi
          if [ "${{ needs.publish.result }}" = failure ]; then failed="$failed publish"; fi
          # One issue while it is open, a comment on it for each later failure - the pattern
          # the check job's reporter uses.
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s Failed again: %s\n' "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          {
            printf '@%s The override route failed (job(s):%s): %s\n\n' "$OWNER" "$failed" "$RUN_URL"
            printf '%s\n' "The run log names the failed command. This failure takes no action on any alert by design: the alerts the failed run's plan had claimed are recorded nowhere, so the next run offers them again from scratch - a transient registry failure must not demote an alert for good. Until it is fixed, no override pull request can move, and the alerts it would have taken raise nothing that day. Close this issue once it is fixed; a later failure opens a new one."
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

  # The update pull requests, once a day. Dependabot fails quietly in another way too: once an
  # entry of .github/dependabot.yml has its open-pull-requests-limit of pull requests open, it
  # opens no more for that entry, not even for a new release, and tells no one. And an update
  # pull request can stay red, parked for a migration, with nobody at it. (2026-10-20)
  watch:
    name: Watch the update pull requests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read        # main's .github/dependabot.yml, for each entry's limit
      pull-requests: read   # the open pull requests
      issues: write         # the "Update pull requests piling up" and "Migration: ..." issues
      actions: write        # start update-prs.yml again on a pull request held for new releases
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Close the migration issues of closed pull requests
        run: |
          set -euo pipefail
          # update-prs.yml opens "Migration: <what> <version>" when CI fails twice on an update
          # pull request, with the pull request's number in a marker, and closes it once CI
          # passes there. One whose pull request was merged or closed meanwhile is closed here.
          # shellcheck disable=SC2016 # $m is jq's
          gh issue list --state open --limit 200 --json number,title,body,author \
            --jq '.[] | select(.author.login == "app/github-actions" and (.title | startswith("Migration: "))) | ((.body // "") | capture("<!-- migration-pr: (?<pr>[0-9]+) -->")) as $m | "\(.number) \($m.pr)"' \
            > "$RUNNER_TEMP/migrations.txt"
          # One that cannot be read or closed now (or was closed meanwhile) stops neither the
          # others nor the steps below: the next day's run tries again.
          while read -r issue pr <&3; do
            if ! state=$(gh pr view "$pr" --json state --jq .state); then
              echo "::warning::#$pr could not be read; #$issue waits for the next run."
              continue
            fi
            case $state in
              MERGED) gh issue close "$issue" --reason completed --comment "#$pr was merged. Closing." ||
                echo "::warning::Could not close #$issue." ;;
              CLOSED) gh issue close "$issue" --reason 'not planned' --comment "#$pr was closed without a merge. Closing." ||
                echo "::warning::Could not close #$issue." ;;
              *) echo "#$issue: #$pr is still open." ;;
            esac
          done 3< "$RUNNER_TEMP/migrations.txt"

      - name: Decide again on update pull requests held for new releases
        run: |
          set -euo pipefail
          # update-prs.yml holds back an update pull request whose lockfile adds a package
          # version under 3 days old, and its comment says when the youngest is old enough, with
          # the CI run and the commit it decided on: <!-- update-prs-recheck: <time> <run>
          # <commit> -->. Once that time has passed, with the pull request still at that commit,
          # update-prs.yml is started again on that run, as ci.yml's hand-off starts it, and
          # decides as it does after CI. A newer commit has a CI run of its own, which decides.
          now=$(date -u +%s)
          gh pr list --state open --limit 200 --json number,headRefName,headRefOid,isCrossRepository \
            --jq '.[] | select((.isCrossRepository | not) and (.headRefName | test("^(dependabot|toolchain|patched)/"))) | "\(.number) \(.headRefName) \(.headRefOid)"' \
            > "$RUNNER_TEMP/prs.txt"
          while read -r number branch head <&3; do
            # The last comment update-prs.yml made on it, found as update-prs.yml finds it.
            gh api --paginate "repos/$GH_REPO/issues/$number/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- update-prs: "))) | {body}' \
              > "$RUNNER_TEMP/ours.jsonl"
            recheck=$(jq -rs 'last | .body // ""' "$RUNNER_TEMP/ours.jsonl" |
              sed -n 's/^<!-- update-prs-recheck: \([0-9][0-9]*\) \([0-9][0-9]*\) \([0-9a-f]\{40\}\) -->$/\1 \2 \3/p' | tail -n 1)
            if [ -z "$recheck" ]; then continue; fi
            read -r at run sha <<< "$recheck"
            if [ "$sha" != "$head" ]; then
              echo "#$number moved on from ${sha:0:8}: the CI run of its new commit decides."
            elif [ "$at" -gt "$now" ]; then
              echo "#$number: its youngest new package version is 3 days old at $(date -u -d "@$at" '+%Y-%m-%d %H:%M UTC')."
            else
              echo "#$number: its new package versions are 3 days old now. Starting update-prs.yml on CI run $run."
              gh workflow run update-prs.yml --ref main -f "run_id=$run" -f "branch=$branch"
            fi
          done 3< "$RUNNER_TEMP/prs.txt"

      - name: Open, update or close the piling-up issue
        env:
          TITLE: 'Update pull requests piling up'
        run: |
          set -euo pipefail
          T=$RUNNER_TEMP
          now=$(date -u +%s)

          # Each entry of main's .github/dependabot.yml: its ecosystem, its directories and its
          # open-pull-requests-limit (Dependabot's default, 5, when it names none), a line each.
          # Read as the file is written: an entry starts at "  - package-ecosystem:", its keys
          # are indented four spaces, an item of its directories six.
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/.github/dependabot.yml?ref=main" \
            > "$T/dependabot.yml"
          awk '
            function value(s) { sub(/^[^:]*:[ \t]*/, "", s); sub(/[ \t]+#.*$/, "", s); return s }
            function flush() { if (eco != "") printf "%s\t%s\t%s\n", eco, dirs, (limit == "" ? 5 : limit) }
            /^  - package-ecosystem:/ { flush(); eco = value($0); dirs = ""; limit = ""; list = 0; next }
            list && /^      - / { d = $0; sub(/^      - /, "", d); sub(/[ \t]+#.*$/, "", d); dirs = dirs (dirs == "" ? "" : " ") d; next }
            # a comment or a blank line inside the list is no end of it
            list && /^[ \t]*(#.*)?$/ { next }
            { list = 0 }
            eco != "" && /^    directory:/ { dirs = value($0); next }
            eco != "" && /^    directories:/ { list = 1; next }
            eco != "" && /^    open-pull-requests-limit:/ { limit = value($0); next }
            END { flush() }' "$T/dependabot.yml" | tr -d "\"'" > "$T/entries.tsv"
          jq -R -s '[split("\n")[] | select(. != "") | split("\t") | {eco: .[0], dirs: (.[1] | split(" ")), limit: (.[2] | tonumber)}]' \
            "$T/entries.tsv" > "$T/entries.json"
          if [ "$(jq 'length' "$T/entries.json")" = 0 ] || jq -e 'any(.[]; .dirs == [])' "$T/entries.json" > /dev/null; then
            echo "main's .github/dependabot.yml could not be read as this step expects:" >&2
            cat "$T/entries.tsv" >&2
            exit 1
          fi
          cat "$T/entries.tsv"

          gh pr list --state open --limit 200 --json number,headRefName,author,labels,isCrossRepository > "$T/prs.json"

          # The entries at their limit minus 2 (at least 2, or the limit if that is lower: with
          # docker's 2, the limit itself), a table row each. Dependabot names a branch
          # dependabot/<package manager>/<directory, for one that is not the root>/..., a path
          # segment's leading dot written "dot-" (git refuses one): a pull request counts for the
          # entry of its package manager whose directory its branch names, else for the one of
          # the root. Every open one counts, security updates too, so this warns no later than
          # Dependabot stops.
          # shellcheck disable=SC2016 # backticks are Markdown
          jq -r --slurpfile e "$T/entries.json" '
            def manager: if . == "npm" then "npm_and_yarn" else gsub("-"; "_") end;
            def prefix: ltrimstr("/") | sub("[*].*$"; "") | gsub("(?<s>^|/)[.]"; "\(.s)dot-")
              | if . == "" or endswith("/") then . else . + "/" end;
            ($e[0] | to_entries | map(.value + {i: .key, manager: (.value.eco | manager)})) as $entries
            | [.[] | select((.isCrossRepository | not) and .author.login == "app/dependabot" and (.headRefName | startswith("dependabot/")))
               | (.headRefName | split("/")) as $parts
               | ($parts[2:] | join("/")) as $rest
               | [$entries[] | select(.manager == $parts[1])] as $c
               | (if ($c | length) == 1 then $c[0].i
                  else ([$c[] | select(any(.dirs[]; prefix as $p | $p != "" and ($rest | startswith($p))))]
                        + [$c[] | select(any(.dirs[]; . == "/"))])[0].i end) as $i
               | {number, entry: $i}] as $prs
            | $entries[]
            | .i as $i
            | [$prs[] | select(.entry == $i) | .number] as $open
            | (if .limit - 2 >= 2 then .limit - 2 else ([.limit, 2] | min) end) as $at
            | select(.limit > 0 and ($open | length) >= $at)
            | "| \(.eco) | `\(.dirs | join("`, `"))` | \($open | length) | \(.limit) | \($open | map("#\(.)") | join(", ")) |"' \
            "$T/prs.json" > "$T/full.md"

          # The update pull requests red for more than 14 days: since the ci-failed label
          # (update-prs.yml's, on while CI fails) last went on after it last came off.
          jq -r '.[] | select((.isCrossRepository | not) and (.headRefName | test("^(dependabot|toolchain|patched)/")) and any(.labels[]; .name == "ci-failed")) | .number' \
            "$T/prs.json" > "$T/red.txt"
          : > "$T/red.md"
          while read -r number <&3; do
            since=$(gh api --paginate "repos/$GH_REPO/issues/$number/events?per_page=100" \
              --jq '.[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "ci-failed") | "\(.event) \(.created_at)"' |
              awk '$1 == "unlabeled" {s = ""} $1 == "labeled" && s == "" {s = $2} END {print s}')
            if [ -z "$since" ]; then continue; fi
            age=$((now - $(date -u -d "$since" +%s)))
            if [ "$age" -gt $((14 * 24 * 60 * 60)) ]; then
              printf '| #%s | %s (%s days) |\n' "$number" "${since:0:10}" "$((age / 86400))" >> "$T/red.md"
            fi
          done 3< "$T/red.txt"

          open=$(gh issue list --state open --limit 200 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and .author.login == "app/github-actions")][0].number // empty')
          if [ ! -s "$T/full.md" ] && [ ! -s "$T/red.md" ]; then
            echo 'No Dependabot entry is near its limit, and no update pull request has been red for more than 14 days.'
            if [ -n "$open" ]; then
              gh issue close "$open" --reason completed \
                --comment 'No Dependabot entry is near its limit any more, and no update pull request has been red for more than 14 days. Closing.'
            fi
            exit 0
          fi
          # shellcheck disable=SC2016 # backticks are Markdown
          {
            printf '@%s Update pull requests are piling up, and Dependabot tells no one.\n\n' "$OWNER"
            if [ -s "$T/full.md" ]; then
              printf '**Near the limit.** Once an entry of `.github/dependabot.yml` has its `open-pull-requests-limit` of pull requests open, Dependabot opens no more for it, not even for a new release, until some are merged or closed. This warns at the limit minus 2 (at least 2).\n\n'
              printf '| Ecosystem | Directories | Open | Limit | Pull requests |\n| --- | --- | --- | --- | --- |\n'
              cat "$T/full.md"
              printf '\n'
            fi
            if [ -s "$T/red.md" ]; then
              printf '**Red for more than 14 days.** CI has failed on these since then:\n\n'
              printf '| Pull request | Red since |\n| --- | --- |\n'
              cat "$T/red.md"
              printf '\n'
            fi
            printf 'Merge what is ready, and close what you will not take (for a Dependabot one, `@dependabot ignore this major version`, `this minor version` or `this dependency`). For a red one, its comment says what fails, and its "Migration: ..." issue, if it has one, what to do.\n\n'
            printf 'This issue is updated once a day, and closes itself once none of this holds.\n'
          } > "$T/body.md"
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file "$T/body.md" > /dev/null
            echo "Updated #$open."
          else
            gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$T/body.md"
          fi

      # As the check's report above, for this job: one issue while it is open, a comment on it
      # for each later failure.
      - name: Report the watch's own failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Update PR watch failed'
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s Failed again: %s\n' "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          printf '@%s The daily watch of the update pull requests (security-alerts.yml, job "Watch the update pull requests") failed: %s\n\nThe run log names the failed command. Until it is fixed, migration issues of closed pull requests stay open, pull requests held for new releases are not decided again, and piling-up pull requests raise no issue. Close this issue once it is fixed; a later failure opens a new one.\n' \
            "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

name: Firefox Beta

# FastStream is Firefox-only, and the e2e suites pin what it relies on Firefox to do
# (tests/e2e/specs/firefox.e2e.mjs: the 8x audio cap, scrollbars, and so on). Since
# September 2026 Firefox ships every two weeks (155, on September 1, was the first), so
# a Beta becomes the release about two weeks later. The suites run against it twice a
# week, so each Beta gets several runs and "the Firefox update broke FastStream" arrives
# as a two-week warning instead of on the day the browser updates.
#
# A scheduled failure opens one issue, assigned to the owner with an @mention and naming
# the Beta version; the first green scheduled run closes it. It also runs on a pull
# request that changes this workflow or the e2e configs, so a change to it is tested
# before it lands, and by hand. Nothing here releases or blocks a release: it is not
# part of CI.

on:
  schedule:
    - cron: '0 5 * * 1,4'
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/firefox-beta.yml
      - tests/e2e/wdio*.conf.mjs
  workflow_dispatch:

concurrency:
  group: firefox-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e on Firefox Beta (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux as in CI, and Windows, where FastStream is used and Firefox decodes
        # through Media Foundation instead of ffmpeg.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      firefox-version: ${{ steps.firefox.outputs.firefox-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firefox Beta
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: latest-beta

      # Linux: Firefox decodes H.264/AAC through the system ffmpeg (see ci.yml).
      # Windows: the e2e setup builds its video fixtures with ffmpeg, which the image lacks.
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            choco install ffmpeg -y --no-progress
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Build
        run: pnpm run build:keep

      - name: End-to-end playback (Firefox Beta)
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          # Not "$FIREFOX_BINARY --version": firefox.exe does not print it to a console on Windows.
          echo "Testing Firefox ${{ steps.firefox.outputs.firefox-version }} on $RUNNER_OS at $FIREFOX_BINARY"
          pnpm run test:e2e

      - name: End-to-end extension tests (Firefox Beta)
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: pnpm run test:ext

      - name: Upload e2e failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-beta-e2e-logs-${{ matrix.os }}
          path: logs/
          if-no-files-found: ignore

  report:
    needs: e2e
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or close the Firefox Beta issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
          VERSION: ${{ needs.e2e.outputs.firefox-version }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          prefix='Firefox Beta breaks FastStream'
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq ".[] | select(.title | startswith(\"$prefix\")) | .number" | head -1)
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Firefox ${VERSION:-Beta} passes again: $RUN_URL"
            fi
            exit 0
          fi
          if [ "$RESULT" != failure ]; then
            echo "e2e result: $RESULT - nothing to report."
            exit 0
          fi
          if [ -n "$open" ]; then
            echo "Still failing on Firefox ${VERSION:-Beta}; already reported in #$open."
            exit 0
          fi
          failed=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          {
            printf '@%s The e2e suites fail on **Firefox %s**, which becomes the release in about two weeks: %s\n\n' "$OWNER" "${VERSION:-Beta}" "$RUN_URL"
            printf 'The same suites pass on the current release in CI, so this is a change in Firefox. The run log and its e2e-logs artifact show which spec failed. tests/e2e/specs/firefox.e2e.mjs pins the Firefox behaviour FastStream relies on; a failure there means that behaviour changed.\n\n'
            printf 'This issue closes on its own once a scheduled run passes again.\n'
            printf 'Failed: %s\n' "${failed:-see the run}"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$prefix: Firefox ${VERSION:-Beta}" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

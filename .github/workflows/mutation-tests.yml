name: Mutation tests

# Once a week, Stryker (stryker.config.mjs) changes the pure-logic modules one thing at a
# time - a comparison, a bound, a call left out - and runs the unit tests against each
# change. A change they still pass is a place where a fix could ship without a test that
# fails without it: the rule every fix here follows, checked by hand until now (T4).
#
# A report, not a gate: the run summary gets a table per file, the full HTML reports are the
# mutation-reports-<shard> artifacts (30 days), and when the tests missed mutants, one issue,
# "Mutation testing: week to <date>", assigned to the owner and @mentioning them, lists them.
# The next week's issue closes it, and so does a week in which every mutant was caught.
#
# The modules are in three areas cut into seven shards (stryker.config.mjs, SHARDS), each run
# by a job of its own side by side: all of them in one job were over twice its 240 minutes
# (#253), and one job an area still ran out of them at 51-74% (#349). The report job puts
# their reports together.

on:
  schedule:
    - cron: '40 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read  # the checkout

concurrency:
  group: mutation-tests
  cancel-in-progress: false

jobs:
  mutation:
    name: Stryker over the ${{ matrix.shard }} modules
    runs-on: ubuntu-latest
    # 1,100 to 2,600 mutants a shard, a few hours at the rates measured on CI
    # (stryker.config.mjs); 350 minutes leaves room, under the runners' 360.
    timeout-minutes: 350
    strategy:
      # One shard that fails or runs out of time leaves the others' reports.
      fail-fast: false
      matrix:
        shard: [core-1, core-2, network-1, network-2, network-3, tools-1, tools-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker
        env:
          STRYKER_SHARD: ${{ matrix.shard }}
        run: pnpm run test:mutation

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-reports-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: The week's report
    needs: mutation
    # The shards that wrote a report are reported, also when another one failed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job writes: the shards run the code under test and need nothing but the checkout.
    permissions:
      contents: read  # the checkout
      issues: write   # the week's issue, and this workflow's own failure
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      PREFIX: 'Mutation testing: week to '
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-reports-*
          path: shards

      - name: Put the shards' reports together
        run: |
          set -euo pipefail
          found=0
          missing=''
          for shard in core-1 core-2 network-1 network-2 network-3 tools-1 tools-2; do
            if [ -f "shards/mutation-reports-$shard/mutation.json" ]; then
              found=$((found + 1))
            else
              missing="$missing $shard"
            fi
          done
          echo "MISSING_SHARDS=${missing# }" >> "$GITHUB_ENV"
          if [ "$found" -gt 0 ]; then
            node tools/merge-mutation-reports.mjs
          fi

      - name: Write the summary
        run: |
          set -euo pipefail
          if [ -n "$MISSING_SHARDS" ]; then
            echo "No mutation report from: $MISSING_SHARDS (Stryker stopped before writing one)." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/mutation/mutation.json ]; then
            node tools/mutation-report.mjs reports/mutation/mutation.json summary >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open, update or close the week's issue
        run: |
          set -euo pipefail
          if [ ! -f reports/mutation/mutation.json ]; then
            echo "No shard wrote a report."
            exit 0
          fi
          today=$(date -u +%F)
          title="$PREFIX$today"
          missed=$(node tools/mutation-report.mjs reports/mutation/mutation.json count)

          # Every issue this workflow opened, open or closed.
          gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null and .user.login == "github-actions[bot]" and (.title | startswith(env.PREFIX))) | [.number, .state, .title] | @tsv' \
            > "$RUNNER_TEMP/mine.tsv"

          # A shard without a report says nothing of its mutants: its week is not done.
          if [ "$missed" -eq 0 ] && [ -n "${MISSING_SHARDS:-}" ]; then
            echo "Every mutant of the reports was caught; no report from: $MISSING_SHARDS."
            exit 0
          fi
          if [ "$missed" -eq 0 ]; then
            echo "The unit tests caught every mutant."
            while IFS=$'\t' read -r number state old; do
              if [ "$state" != open ]; then continue; fi
              gh issue close "$number" --reason completed --comment "The unit tests caught every mutant in the week to $today: $RUN_URL"
              echo "Closed #$number ($old)"
            done < "$RUNNER_TEMP/mine.tsv"
            exit 0
          fi

          node tools/mutation-report.mjs reports/mutation/mutation.json issue "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          current=$(awk -F '\t' -v title="$title" '$2 == "open" && $3 == title {print $1; exit}' "$RUNNER_TEMP/mine.tsv")
          if [ -n "$current" ]; then
            gh issue edit "$current" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated #$current"
          else
            url=$(gh issue create --title "$title" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md")
            current=${url##*/}
            echo "Opened $url"
          fi

          # The last weeks' open issues: this one replaces them.
          while IFS=$'\t' read -r number state old; do
            if [ "$state" != open ] || [ "$number" = "$current" ]; then continue; fi
            gh issue close "$number" --reason completed --comment "#$current lists the week to $today."
            echo "Closed #$number ($old)"
          done < "$RUNNER_TEMP/mine.tsv"

      # A failed run of this workflow is emailed only to whoever started it (for the schedule,
      # whoever last changed the cron line): one issue while it is open, assigned and
      # @mentioning the owner, as toolchain-updates.yml does. A failure while it is open adds a
      # comment to it. A shard that failed or ran out of time counts too (the latter ends
      # cancelled, see the condition).
      - name: Report this workflow's own failure
        # cancelled: a shard that ran out of its time ends cancelled, not failed, and such a run
        # (no report at all, 2026-10-05) said nothing.
        if: failure() || needs.mutation.result == 'failure' || needs.mutation.result == 'cancelled'
        env:
          TITLE: 'Mutation tests workflow failed'
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s Failed again: %s\n' "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          printf '@%s mutation-tests.yml failed: %s\n\nThe run log names the failed command. Close this issue once it is fixed; a later failure opens a new one.\n' \
            "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

name: Reminders

# On the 1st of each month, comments on every open issue labelled
# `reminder: <month>` (e.g. `reminder: november`) and @mentions the repo owner, so the
# reminder arrives by email in the month it is meant for. An issue only emails when it is
# opened or changed; parked until then, it is easy to forget.
#
# Label an issue to schedule it; close it to stop the reminders. An issue still open a
# year later is reminded again that month.

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to send reminders for (e.g. november). Defaults to the current month.'
        required: false

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      MONTH_INPUT: ${{ inputs.month }}
    steps:
      - name: Remind
        run: |
          set -euo pipefail
          month="${MONTH_INPUT:-$(date -u +%B)}"
          month="${month,,}"
          label="reminder: $month"
          echo "Open issues labelled '$label':"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$label" --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' |
          while IFS=$'\t' read -r number title; do
            echo "  #$number $title"
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "@$OWNER Reminder for ${month^}: this is scheduled for this month."
          done

      # A failed run of this workflow is emailed only to whoever started it (for the schedule,
      # whoever last changed the cron line): one issue while it is open, assigned and
      # @mentioning the owner, as wsl-releases.yml does. A failure while it is open adds a
      # comment to it.
      - name: Report this workflow's own failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Reminders workflow failed'
        run: |
          set -euo pipefail
          # When the issues cannot be read, a second issue is better than none.
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf '@%s Failed again: %s\n' "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          printf '@%s reminders.yml failed: %s\n\nThe run log names the failed command. Close this issue once it is fixed; a later failure opens a new one.\n' \
            "$OWNER" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"

name: Release

# Builds the extension and publishes it as a GitHub Release with downloadable
# zips attached -- the public-facing equivalent of what Andrew does by hand
# on the upstream repo (github.com/Andrews54757/FastStream/releases): a tag,
# a release page, downloadable builds. This fork ships Firefox only (see the
# "abandon Chrome" decision, 2026-09-11): the unrestricted firefox-github
# build plus the Firefox AMO build, signed by Mozilla so it installs with no
# "unverified" warning.
#
# Fires on a version tag push from tools/cut-release.mjs (a deliberate manual
# version bump), and is dispatched by auto-release.yml (the automatic
# build-number bump after every green push to main; its tag push cannot fire
# this, see there) and by amo-signing-failsafe.yml (a tag left without a
# release). Either way, by the time the tag lands here package.json and
# chrome/manifest.json already agree with it. Only lowercase v tags: the
# capital-V ones in this repository are upstream's (V1.3.77 and so on), copied
# when it was forked. Run again for a tag that already has a release, it
# replaces that release's files instead of failing.
#
# AMO signing happens once per release, right here (the old publish-amo.yml,
# which signed on every merge to main, was removed).
#
# continue-on-error on the sign step: AMO taking longer than the 30-minute wait,
# or a credential problem, fails it independently of everything else in the
# release, and should not hold back the zip. tools/sign-amo.mjs already waits
# out a network error. Whatever the outcome, the last step starts
# amo-signing-failsafe.yml, which attaches the xpi and updates.json once AMO
# has signed, re-runs a release that failed before publishing, checks the
# update path Firefox uses, and opens an issue when any of that needs a person.
#
# Self-hosted auto-update: the AMO build's manifest points
# browser_specific_settings.gecko.update_url at
# .../releases/latest/download/updates.json, a GitHub redirect that always
# resolves to whatever the newest Release publishes under that filename. So
# "Check for Updates" in about:addons (and Firefox's own periodic check)
# works without a store listing, as long as every release re-publishes an
# updates.json alongside the xpi it describes -- tools/gen-update-manifest.mjs
# does that from the just-signed xpi, only when signing succeeded.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  # The last step starts amo-signing-failsafe.yml.
  actions: write

# One run per tag at a time: a second one (the failsafe's restart, a run by hand) waits for
# the first to end instead of signing and publishing the same version beside it, racing it to
# `gh release create`. GitHub keeps one waiting run per group, and a newer one replaces it:
# for one tag, that is the same release asked for again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    # The AMO keys are secrets of the "release" environment, which only main and v* tags may
    # use (Settings, Environments): a workflow file on any other branch - an upstream sync's,
    # a pull request's - cannot read them (#163). The environment only guards the secrets,
    # so no deployment is recorded.
    environment:
      name: release
      deployment: false
    # AMO signing waits up to 30 minutes for approval (approvalTimeout in
    # tools/sign-amo.mjs); after that amo-signing-failsafe.yml takes over, so
    # the job needs those 30 minutes plus the checks, build and upload.
    timeout-minutes: 45

    steps:
      # The token is not kept in .git/config (persist-credentials: false): every later
      # step could read it there, dev dependencies' install scripts included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager", so this
      # workflow cannot drift from CI or from local installs.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          # No cache: other workflows' runs write it, and this job holds the AMO keys. setup-node
          # caches on its own when package.json names a package manager, so it is turned off.
          package-manager-cache: false

      # Before anything is built or signed: a release whose tag disagrees with
      # the version inside it would sign and publish an xpi under the wrong
      # number, and updates.json would point Firefox at it. auto-release.yml
      # always writes both files before tagging; a tag cut by hand might not.
      # Ported from the sibling Python repos' release.yml.
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag_version="${TAG#[vV]}"
          pkg_version=$(node -p "require('./package.json').version")
          manifest_version=$(node -p "require('./chrome/manifest.json').version")
          if [ "$tag_version" != "$pkg_version" ] || [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag $TAG says $tag_version, package.json says $pkg_version, chrome/manifest.json says $manifest_version."
            echo "Set both files to $tag_version (pnpm run release $tag_version does), push, then delete and re-create the tag."
            exit 1
          fi
          echo "tag $TAG matches package.json and chrome/manifest.json ($pkg_version)"

      # --frozen-lockfile also applies patches/ during install, which the
      # build needs: chrome/player/modules/hls.mjs is generated from the
      # patched npm package, not tracked in git.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # auto-release.yml only tags a commit CI passed, but a tag pushed by hand
      # (tools/cut-release.mjs) reaches this workflow straight away, alongside
      # CI rather than after it. The fast checks, so no release is built from a
      # tree that does not even lint or pass its unit tests.
      - name: Lint and unit tests
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Build
        run: pnpm run build:keep

      # See the header comment for why this is allowed to fail without
      # blocking the rest of the release.
      - name: Sign Firefox build (AMO, unlisted)
        id: sign
        continue-on-error: true
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: pnpm run sign:amo

      - name: Generate self-update manifest
        if: steps.sign.outcome == 'success'
        env:
          TAG: ${{ github.ref_name }}
        run: node tools/gen-update-manifest.mjs "$GITHUB_REPOSITORY" "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ steps.sign.outcome }}
        run: |
          assets=(
            built/firefox-github-*.zip
          )
          if [ "$SIGNED" = "success" ]; then
            assets+=(web-ext-artifacts/*.xpi web-ext-artifacts/updates.json)
          else
            echo "::warning::AMO signing did not finish -- releasing without the signed xpi or updates.json. amo-signing-failsafe.yml, started below, attaches both once AMO has signed the version."
          fi
          # A tag released before (a run by hand to redo a release) gets its files
          # replaced; `gh release create` would fail on it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "FastStream $TAG" --generate-notes
          fi

      # After every run, published or not: the failsafe completes a release whose
      # signing did not finish, re-runs one that failed before publishing, and checks
      # the update path Firefox reads. Waiting for its schedule could leave Firefox
      # without the update for hours.
      - name: Start the release failsafe
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run amo-signing-failsafe.yml --repo "$GITHUB_REPOSITORY" && exit 0
            echo "Starting the failsafe failed (attempt $attempt of 3); trying again in 20 s."
            sleep 20
          done
          echo "::warning::Could not start amo-signing-failsafe.yml; its schedule runs it within 3 hours."

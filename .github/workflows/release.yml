name: Release

# Builds the extension and publishes it as a GitHub Release with downloadable
# zips attached -- the public-facing equivalent of what Andrew does by hand
# on the upstream repo (github.com/Andrews54757/FastStream/releases): a tag,
# a release page, downloadable builds. His releases carry two assets
# (chrome-libre, firefox-libre, both unsigned); this one carries four --
# the two unrestricted "github" builds (full YouTube support, nothing a
# store forbids) plus the two store-shaped builds: chrome-webstore (mostly
# unrestricted -- Chrome's policy only trims a couple of specific lines,
# CENSORYT, not the feature) and the Firefox AMO build, signed by Mozilla so
# it installs with no "unverified" warning.
#
# Fires on a version tag push (same v*.*.* / V*.*.* pattern build.yml already
# watches). workflow_dispatch is for re-running by hand against an existing
# tag if a release needs to be redone.
#
# Signing here is a second, independent submission from what publish-amo.yml
# already does continuously on every merge to dev/mv3-modernization. AMO
# refuses to accept the same version+channel twice, so if that continuous
# pipeline already signed the exact version being tagged, this workflow's own
# sign attempt fails -- deliberately non-fatal (continue-on-error), so the
# release still goes out with the three unsigned zips and a note instead of
# not going out at all. When that happens, grab the already-signed xpi AMO
# has for that version and attach it by hand with
# `gh release upload <tag> <file>`.

on:
  push:
    tags:
      - "v*.*.*"
      - "V*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager", so this
      # workflow cannot drift from CI or from local installs.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile also applies patches/ during install, which the
      # build needs: chrome/player/modules/hls.mjs is generated from the
      # patched npm package, not tracked in git.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:keep

      # See the header comment: fails when publish-amo.yml already signed
      # this exact version via the merge that landed it, which is expected
      # and not the release's problem to fix.
      - name: Sign Firefox build (AMO, unlisted)
        id: sign
        continue-on-error: true
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: pnpm run sign:amo

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            built/chrome-github-*.zip
            built/chrome-webstore-*.zip
            built/firefox-github-*.zip
          )
          if [ "${{ steps.sign.outcome }}" = "success" ]; then
            assets+=(web-ext-artifacts/*.xpi)
          else
            echo "::warning::AMO signing failed or was already done for this version -- releasing without the signed xpi. See the header comment in this workflow for how to attach it by hand."
          fi
          gh release create "${{ github.ref_name }}" \
            "${assets[@]}" \
            --title "FastStream ${{ github.ref_name }}" \
            --generate-notes

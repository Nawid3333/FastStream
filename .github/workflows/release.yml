name: Release

# Builds the extension and publishes it as a GitHub Release with downloadable
# zips attached -- the public-facing equivalent of what Andrew does by hand
# on the upstream repo (github.com/Andrews54757/FastStream/releases): a tag,
# a release page, downloadable builds. This fork ships Firefox only (see the
# "abandon Chrome" decision, 2026-09-11): the unrestricted firefox-github
# build plus the Firefox AMO build, signed by Mozilla so it installs with no
# "unverified" warning.
#
# Fires on a version tag push. workflow_dispatch is for re-running by hand
# against an existing tag if a release needs to be redone.
#
# This is the only AMO signing path now -- the old publish-amo.yml, which
# signed continuously on every merge to dev/mv3-modernization, was removed
# once this workflow made it redundant (both existed briefly). AMO signing
# happens once per release, right here.
#
# continue-on-error on the sign step is worth keeping: a credential rotation,
# a network blip, or AMO taking too long to review can all fail it
# independently of anything else in the release, and none of those should
# hold back the three unsigned zips. When it does fail, fix the cause, then
# attach the xpi by hand with `gh release upload <tag> <file>` once a manual
# `pnpm run sign:amo` produces one -- and regenerate updates.json (see below)
# the same way, or the self-update path stays stuck on the last release that
# had one.
#
# Self-hosted auto-update: the AMO build's manifest points
# browser_specific_settings.gecko.update_url at
# .../releases/latest/download/updates.json, a GitHub redirect that always
# resolves to whatever the newest Release publishes under that filename. So
# "Check for Updates" in about:addons (and Firefox's own periodic check)
# works without a store listing, as long as every release re-publishes an
# updates.json alongside the xpi it describes -- tools/gen-update-manifest.mjs
# does that from the just-signed xpi, only when signing succeeded.

on:
  push:
    tags:
      - "v*.*.*"
      - "V*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager", so this
      # workflow cannot drift from CI or from local installs.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile also applies patches/ during install, which the
      # build needs: chrome/player/modules/hls.mjs is generated from the
      # patched npm package, not tracked in git.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:keep

      # See the header comment for why this is allowed to fail without
      # blocking the rest of the release.
      - name: Sign Firefox build (AMO, unlisted)
        id: sign
        continue-on-error: true
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: pnpm run sign:amo

      - name: Generate self-update manifest
        if: steps.sign.outcome == 'success'
        run: node tools/gen-update-manifest.mjs "${{ github.repository }}" "${{ github.ref_name }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            built/firefox-github-*.zip
          )
          if [ "${{ steps.sign.outcome }}" = "success" ]; then
            assets+=(web-ext-artifacts/*.xpi web-ext-artifacts/updates.json)
          else
            echo "::warning::AMO signing failed or was already done for this version -- releasing without the signed xpi or updates.json. See the header comment in this workflow for how to attach both by hand."
          fi
          gh release create "${{ github.ref_name }}" \
            "${assets[@]}" \
            --title "FastStream ${{ github.ref_name }}" \
            --generate-notes

name: Stress (Windows, temporary)

# TEMPORARY - remove before merging PR #15. Runs the whole playback e2e suite once on
# twelve Windows runners at the same time (8 on the current Firefox, 4 on the Beta), to
# see intermittent failures in minutes instead of one CI run at a time. Every job runs
# to the end; a failing one uploads its logs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: stress-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.firefox }} ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        firefox: [latest]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - {firefox: latest-beta, shard: 1}
          - {firefox: latest-beta, shard: 2}
          - {firefox: latest-beta, shard: 3}
          - {firefox: latest-beta, shard: 4}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install Firefox ${{ matrix.firefox }}
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: ${{ matrix.firefox }}

      - name: Build
        run: pnpm run build:keep

      - name: End-to-end playback
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: pnpm run test:e2e

      - name: Upload e2e failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-logs-${{ matrix.firefox }}-${{ matrix.shard }}
          path: logs/
          if-no-files-found: ignore

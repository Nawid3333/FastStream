name: Update PRs

# Reports on an update pull request once CI has run on it, and never merges it. The update
# pull requests come from Dependabot (dependabot/*), toolchain-updates.yml (toolchain/*),
# patched-libraries.yml (patched/*) and security-alerts.yml (security/overrides: override
# floors for alerts Dependabot cannot fix; only pnpm-workspace.yaml and pnpm-lock.yaml may
# change, its dependency review must pass). (Upstream sync pull requests ended on 2026-10-09:
# the fork no longer merges upstream; upstream-watch.yml reports its commits.) Before this,
# each sat until the owner looked; a red one told nobody, since GitHub emails a failed run
# only to whoever started it, and that was a bot.
#
# Nothing merges itself (the owner's choice, 2026-10-02: every pull request waits for his
# merge, so nothing lands that he did not choose). Until that day the green ones merged
# here; this workflow keeps the checks that decided that, and now reports them.
#
#   CI failed   CI runs once more on the same commit, in case a test was flaky, and that
#               run decides. Still red: the pull request stays open, is labelled
#               ci-failed, and a comment (which the daily digest sums up) gives the
#               failed jobs and steps, what each step checks, the last lines of each
#               failed log, and how main's own CI stands (red there too points away from
#               the update). Nothing is guessed about the cause beyond that. Red twice, the
#               new version most likely needs code changes here (2026-10-20): the pull
#               request is also labelled hold, and one issue "Migration: <what> <version>"
#               carries the same diagnosis and what to do. That issue closes once CI passes
#               on the pull request (here; the hold label set here comes off with it), or
#               once it is merged or closed (security-alerts.yml's daily watch).
#               A run that failed only because GitHub or a download host did not answer
#               (tools/ci-outage.sh) is an outage, not the update: a comment says so, and outage-retry.yml runs CI again on the commit three hours
#               later, up to three times; then a comment says to start it by hand. No label, no hold, no
#               migration issue, and an outage run is no first try. A failed job without a log
#               (a lost runner) opens no migration issue either.
#   CI passed   a comment, which the daily digest sums up. "Ready to merge" when
#               every one of these holds: opened by that bot and only its commits on it; it
#               changes only what that kind of update changes (package.json and
#               pnpm-lock.yaml; fsaunpack's two files; .nvmrc; workflow files; the two
#               Dockerfiles; a re-cut's files; tools/setup-dev-profile.mjs for uBlock
#               Origin; tests/e2e/live-specs/player-libraries.json for the player
#               libraries, whose live suite must have passed on the commit too: CI does not
#               play them); its dependency review passed; and the branch holds the newest main, so what he
#               merges is exactly what CI tested. How old a release is does not count (the
#               owner's call of 2026-11-09: he decides when each update is merged).
#               The comment also says what the merge does:
#               - Dependabot's shipped libraries (tools/sync-vendor.mjs copies them into the
#                 extension) and the patched libraries change what the
#                 extension ships, and are meant to: his merge starts CI on main (a push of
#                 his), and a green run there releases, through ci.yml's hand-off to
#                 auto-release.yml.
#               - The rest must not: CI's build of the extension must be file for file the
#                 one in the latest release, the version number aside (auto-release.yml's
#                 own test), so merging it releases nothing.
#               Otherwise the comment says what to look at before merging: the label hold,
#               a check above that failed, a tooling update whose build differs from the
#               latest release.
# A run with the same verdict as the pull request's last comment from here edits that
# comment instead of adding one: the owner hears when a verdict changes, not every run.
#
# A branch behind main is brought up to date (GitHub's "Update branch") and CI started on
# it again; that run decides. After three such updates it waits for the owner instead. A
# GitHub Actions update's branch is updated with the owner's token, UPDATE_PRS_TOKEN:
# GitHub's own may not push a workflow file. Without it, he updates that branch himself.
#
# A CI run whose actor is this repository's token sends no workflow_run event, since
# GitHub starts no workflow for what its own token did: a run a workflow started
# (toolchain-updates.yml, patched-libraries.yml, or this one: the run on an updated
# branch, the second try), and the pull_request run of a pull request a workflow opened
# (those two), even once the owner approved it. Such a run's last
# job (ci.yml's hand-off) starts this workflow by workflow_dispatch instead, with the
# run's number; it waits for the run to end and decides as above. The owner can start
# it the same way for any CI run of an update branch (Actions, Update PRs, Run workflow).
#
# Runs on CI's completion, with a write token, so it never checks out or runs anything
# from the pull request: it reads the API, and compares CI's build artifact as data. Only
# branches of this repository; a fork's pull request is never touched.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # From ci.yml's hand-off, for a run a workflow started (see above), or by hand. The
  # inputs only point at a run: the step below checks them against the run itself.
  workflow_dispatch:
    inputs:
      run_id:
        description: The CI run to decide on (the number in its URL)
        required: true
        type: string
      branch:
        description: Its branch
        required: true
        type: string

permissions: {}  # each job asks for what it needs

concurrency:
  group: update-prs-${{ github.event.workflow_run.head_branch || inputs.branch }}
  cancel-in-progress: false

jobs:
  decide:
    permissions:
      contents: write       # bring a branch up to date
      pull-requests: write  # comment, label
      issues: write         # the ci-failed label, the migration issues, and the issue when this workflow fails
      actions: write        # start CI once more, or on an updated branch
      checks: read          # the dependency review's check runs
    name: Report on an update PR
    # A run whose actor is this repository's own token comes by workflow_dispatch, should
    # GitHub ever send workflow_run for it as well: one decision per run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.actor.login != 'github-actions[bot]' &&
       (startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
        startsWith(github.event.workflow_run.head_branch, 'toolchain/') ||
        startsWith(github.event.workflow_run.head_branch, 'patched/') ||
        startsWith(github.event.workflow_run.head_branch, 'security/')))
    runs-on: ubuntu-latest
    # UPDATE_PRS_TOKEN is a secret of the "update-prs" environment, which only main may use
    # (Settings, Environments): a workflow file on any other branch cannot read it (#163).
    # This job always runs main's file (workflow_run, and ci.yml's dispatch with --ref main).
    # The environment only guards the secret, so no deployment is recorded.
    environment:
      name: update-prs
      deployment: false
    # The wait (7 minutes) and the decision (16), with room to spare.
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      SELF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # By workflow_dispatch: the run it names, once that has ended. Only a CI run of an
      # update branch of this repository; what the step below needs comes from the run.
      - name: Wait for the CI run
        id: run
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 7
        env:
          RUN_ID: ${{ inputs.run_id }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if ! [[ $RUN_ID =~ ^[0-9]+$ ]]; then
            echo "run_id is not a run's number: $RUN_ID" >&2
            exit 1
          fi
          # The hand-off is the run's last job: it ends moments after starting this.
          for _ in $(seq 30); do
            gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
            if [ "$(jq -r .status "$RUNNER_TEMP/run.json")" = completed ]; then break; fi
            sleep 10
          done
          jq -r '"\(.path) of \(.head_repository.full_name), \(.head_branch) at \(.head_sha): \(.status) \(.conclusion)"' \
            "$RUNNER_TEMP/run.json"
          if [ "$(jq -r .status "$RUNNER_TEMP/run.json")" != completed ]; then
            echo "Run $RUN_ID did not end within five minutes." >&2
            exit 1
          fi
          if ! jq -e --arg repo "$GH_REPO" --arg branch "$BRANCH" '
              (.path | split("@")[0]) == ".github/workflows/ci.yml" and
              .head_repository.full_name == $repo and .head_branch == $branch and
              (.head_branch | test("^(dependabot|toolchain|patched|security)/"))' \
              "$RUNNER_TEMP/run.json" > /dev/null; then
            echo "Run $RUN_ID is not a CI run of this repository's update branch $BRANCH." >&2
            exit 1
          fi
          jq -r '"attempt=\(.run_attempt)", "url=\(.html_url)", "conclusion=\(.conclusion)", "sha=\(.head_sha)"' \
            "$RUNNER_TEMP/run.json" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        # Its own limit, under the job's: a step that runs out of time fails, and the report
        # step below then runs. Nothing else would tell the owner.
        timeout-minutes: 16
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || steps.run.outputs.attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url || steps.run.outputs.url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || steps.run.outputs.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
          SHA: ${{ github.event.workflow_run.head_sha || steps.run.outputs.sha }}
          # GitHub's own token may not update a branch that changes workflow files: a GitHub
          # Actions update's branch is updated with the owner's fine-grained token (this
          # repository only; Contents, Pull requests and Workflows: read and write). Used for
          # nothing else (docs/maintenance.md, "A token for workflow updates").
          MERGE_TOKEN: ${{ secrets.UPDATE_PRS_TOKEN }}
          # This workflow's own commit (main's): tools/ci-outage.sh is read from it.
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LABEL=ci-failed

          # --- The open pull request CI ran for: this branch, at exactly this commit. A newer
          # commit has a run of its own, which decides. gh's --head matches the branch name in
          # any repository: a fork's pull request from a branch of the same name, even at the
          # same commit, is never the one (#169).
          gh pr list --state open --head "$BRANCH" --limit 20 \
            --json number,headRefOid,baseRefName,author,title,isDraft,labels,isCrossRepository > "$RUNNER_TEMP/prs.json"
          pr=$(jq -c --arg sha "$SHA" '[.[] | select(.headRefOid == $sha and (.isCrossRepository | not))][0] // empty' "$RUNNER_TEMP/prs.json")
          if [ -z "$pr" ]; then
            echo "No open pull request on $BRANCH at ${SHA:0:8}: merged, closed, or moved on. Nothing to do."
            exit 0
          fi
          number=$(jq -r .number <<< "$pr")
          author=$(jq -r .author.login <<< "$pr")
          echo "#$number $(jq -r .title <<< "$pr") ($author): CI $CONCLUSION, attempt $RUN_ATTEMPT, $RUN_URL"

          # A comment per verdict. The key goes into it; when the pull request's last comment
          # from here has the same key, that comment is edited (no email) instead.
          say() { # <key> <body file>
            local last last_key
            printf '\n<sub>%s</sub>\n<!-- update-prs: %s -->\n' "$SELF_URL" "$1" >> "$2"
            gh api --paginate "repos/$GH_REPO/issues/$number/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- update-prs: "))) | {id, body}' \
              > "$RUNNER_TEMP/ours.jsonl"
            last=$(jq -cs 'last // empty' "$RUNNER_TEMP/ours.jsonl")
            last_key=''
            if [ -n "$last" ]; then
              last_key=$(jq -r .body <<< "$last" | grep -oE '<!-- update-prs: [^>]* -->' | tail -n 1 |
                sed -E 's/<!-- update-prs: (.*) -->/\1/' || true)
            fi
            if [ -n "$last" ] && [ "$last_key" = "$1" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$(jq -r .id <<< "$last")" -F "body=@$2" > /dev/null
              echo "Same verdict as the last comment ($1): edited it."
            else
              gh pr comment "$number" --body-file "$2"
            fi
          }

          # What a pull request of this branch needs from the owner, whatever CI says.
          case $BRANCH in
            dependabot/npm_and_yarn/*) kind=dependabot ;;
            dependabot/github_actions/*) kind=actions ;;
            dependabot/docker/*) kind=docker ;;
            toolchain/pnpm-*) kind=pnpm ;;
            toolchain/node-*) kind=node ;;
            toolchain/ublock-origin-*) kind=ublock ;;
            toolchain/player-libraries) kind=players ;;
            security/overrides) kind=security ;;
            patched/*) kind=patched ;;
            *) kind=other ;;
          esac
          # Whether merging it changes what the extension ships, as it is meant to: a
          # patched library, or Dependabot's shipped group, whose branch Dependabot names after
          # the group in .github/dependabot.yml (a rename there must come here too). A shipped
          # library's major comes on a branch of its own: found below, by the libraries of
          # that group.
          ships=0
          case $BRANCH in
            patched/*|dependabot/npm_and_yarn/shipped-minor-and-patch-*) ships=1 ;;
          esac
          # fsaunpack, the archive helper with its own package.json and npm lockfile.
          fsa=0
          case $BRANCH in
            dependabot/npm_and_yarn/fsaunpack/*) fsa=1 ;;
          esac
          # The backticks here and below are Markdown for the comment, not command substitution.
          # shellcheck disable=SC2016
          hint() {
            case $kind in
              dependabot) printf 'Several packages can move together in one Dependabot pull request; `@dependabot ignore <package> minor version` drops one of them. `@dependabot rebase` builds it anew on main.\n' ;;
              actions) printf 'Dependabot moves the pinned commit and its version comment together; the release notes are linked above.\n' ;;
              docker) printf 'Dependabot moves the tag and the digest in the Dockerfile together. `@dependabot ignore this minor version` (or `this major version`) skips it.\n' ;;
              pnpm|node|ublock) printf 'Closing this pull request skips this version for good; toolchain-updates.yml raises the next one.\n' ;;
              players) printf 'toolchain-updates.yml rebuilds this pull request in place when a newer release comes. Closing it skips this set of versions; the next set comes as a pull request of its own.\n' ;;
              security) printf 'security-alerts.yml rebuilds this pull request in place every day from the open alerts. Closing it without merging hands its alerts back to you as "Security alert" issues.\n' ;;
              patched) printf 'How to take it by hand: `docs/updating-patched-libraries.md`. Closing this pull request skips this version for good.\n' ;;
              *) ;;
            esac
          }

          # --- CI failed.
          if [ "$CONCLUSION" != success ]; then
            if [ "$CONCLUSION" != failure ] && [ "$CONCLUSION" != timed_out ]; then
              echo "CI $CONCLUSION: cancelled for a newer run or by hand, or skipped. Nothing to report."
              exit 0
            fi
            gh run view "$RUN_ID" --attempt "$RUN_ATTEMPT" --json jobs > "$RUNNER_TEMP/jobs.json"
            jq -r 'def bad: .conclusion | IN("failure", "timed_out", "cancelled");
              .jobs[] | select(bad) | [.name, ([.steps[] | select(bad) | .name] | join(" / "))] | @tsv' \
              "$RUNNER_TEMP/jobs.json" > "$RUNNER_TEMP/failed.tsv"
            gh run view "$RUN_ID" --attempt "$RUN_ATTEMPT" --log-failed > "$RUNNER_TEMP/failed.log" 2> /dev/null || true
            main_ci=$(gh run list --workflow ci.yml --branch main --event push --limit 1 --json conclusion,url \
              --jq '.[0] | "\(if .conclusion == "" then "still running" else .conclusion end): \(.url)"' || echo 'unknown')

            # shellcheck disable=SC2016
            meaning() { # <step name>: what that step checks
              case $1 in
                'Install dependencies') echo 'installs the locked dependencies (`pnpm install --frozen-lockfile`): the lockfile, a pnpm patch that no longer applies, or the registry' ;;
                ESLint) echo 'ESLint: a new ESLint or plugin, or a changed rule, flags code' ;;
                'Type check') echo 'TypeScript (`tsc --noEmit`): new type definitions or a new TypeScript' ;;
                'Unit tests') echo 'the unit tests (Vitest)' ;;
                'Build all targets') echo 'the build (`tools/sync-vendor.mjs`, `build.mjs`)' ;;
                addons-linter*) echo "Mozilla's addons-linter, the check AMO runs on upload" ;;
                'Vendored file provenance'*) echo 'a vendored file against its documented upstream (`docs/vendored-libraries.md`)' ;;
                'e2e setup') echo 'the e2e setup: downloading Firefox or ffmpeg' ;;
                End-to-end*) echo 'real playback or the installed extension in Firefox; a network stream can also fail on its own' ;;
                'Install mpv and the native host') echo 'installing mpv for the MPV specs (`.github/mpv-build.json`)' ;;
                actionlint) echo 'a workflow file (actionlint)' ;;
                'Set up job'|'Run actions/'*|'Run pnpm/'*|'Post '*|'Complete job') echo 'a GitHub Action or the runner (for a Node update: setup-node finding that Node)' ;;
                '') echo 'no step failed: the job itself was cancelled or ran out of time' ;;
                *) echo 'see its log' ;;
              esac
            }

            # The failed jobs and steps make the key: the same failure again edits its comment.
            key="red $(sha1sum < "$RUNNER_TEMP/failed.tsv" | cut -c1-12)"
            # What failed, for the comment and for a migration issue: the failed jobs and steps,
            # the runs, and the end of each failed log.
            # shellcheck disable=SC2016
            {
              printf '| Job | Failed step | What the step checks |\n| --- | --- | --- |\n'
              while IFS=$'\t' read -r job steps; do
                printf '| %s | %s | %s |\n' "$job" "${steps:-(none)}" "$(meaning "${steps%% / *}")"
              done < "$RUNNER_TEMP/failed.tsv"
              printf '\n- CI run: %s\n- main, the latest push: %s. If main fails as well, this pull request is probably not the cause.\n' "$RUN_URL" "$main_ci"
              cut -f1 "$RUNNER_TEMP/failed.tsv" | while read -r job; do
                # --log-failed prints "job<TAB>step<TAB>timestamp line"; the end of each job's is kept.
                # Colour codes out, long lines cut; a fence of four backticks, which a log is
                # unlikely to hold.
                lines=$(awk -F '\t' -v job="$job" '$1 == job { sub(/^[^\t]*\t[^\t]*\t[^ ]* ?/, ""); print }' \
                  "$RUNNER_TEMP/failed.log" | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' | cut -c1-300 | tail -n 40)
                if [ -n "$lines" ]; then
                  printf '\n<details><summary>The last lines of <b>%s</b></summary>\n\n````\n%s\n````\n</details>\n' "$job" "$lines"
                fi
              done
            } > "$RUNNER_TEMP/diagnosis.md"

            # Whether a run failed only because GitHub or a download host did not answer:
            # outage, red or unknown (tools/ci-outage.sh, read at this workflow's own commit,
            # never the pull request's; unreadable, every run is unknown). On 2026-11-09 GitHub
            # answered 504 for about ten minutes, and four update pull requests were parked as
            # migrations for nothing.
            gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/tools/ci-outage.sh?ref=$WORKFLOW_SHA" \
              > "$RUNNER_TEMP/ci-outage.sh" 2> /dev/null || : > "$RUNNER_TEMP/ci-outage.sh"
            verdict_of() { # <jobs.json> <failed.log>
              if [ -s "$RUNNER_TEMP/ci-outage.sh" ]; then
                bash "$RUNNER_TEMP/ci-outage.sh" "$1" "$2" || echo unknown
              else
                echo unknown
              fi
            }
            verdict=$(verdict_of "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/failed.log")
            echo "This run: $verdict."
            # The earlier failed runs on this commit (the newest six), each with its verdict. One
            # that failed on an outage is no first try; it counts towards the outage tries
            # below. The earlier run can also be the other one of a pull request a workflow
            # opened: its dispatched run and its pull_request run build the same commit.
            gh run list --workflow ci.yml --commit "$SHA" --limit 50 --json databaseId,conclusion > "$RUNNER_TEMP/runs.json"
            mapfile -t earlier_ids < <(jq -r --argjson id "$RUN_ID" '[.[] | select(.databaseId != $id and
              (.conclusion | IN("failure", "timed_out")))] | sort_by(.databaseId) | reverse | .[:6][] | .databaseId' "$RUNNER_TEMP/runs.json")
            earlier=0
            outages=0
            for id in "${earlier_ids[@]}"; do
              v=unknown
              if gh run view "$id" --json jobs > "$RUNNER_TEMP/jobs-$id.json" < /dev/null; then
                gh run view "$id" --log-failed > "$RUNNER_TEMP/failed-$id.log" 2> /dev/null < /dev/null || true
                v=$(verdict_of "$RUNNER_TEMP/jobs-$id.json" "$RUNNER_TEMP/failed-$id.log")
              fi
              echo "Earlier run $id on this commit: $v."
              if [ "$v" = outage ]; then outages=$((outages + 1)); else earlier=$((earlier + 1)); fi
            done

            # --- An outage: nothing about the update, so no label, hold or migration. CI runs
            # again on the commit three hours later (outage-retry.yml), up to three times; a
            # newer commit or a closed pull request ends it. Then the owner hears of it.
            if [ "$verdict" = outage ]; then
              outages=$((outages + 1))
              retry_at=$(date -u -d '+3 hours' '+%H:%M')
              if [ "$outages" -le 3 ] &&
                gh workflow run outage-retry.yml --ref main -f "branch=$BRANCH" -f "sha=$SHA" -f delay=10800; then
                {
                  printf 'CI could not do its checks on this commit: GitHub or a download host did not answer (an outage, not this update). '
                  printf 'CI runs again on it at about %s UTC, in three hours (outage-retry.yml, try %s of 3). Nothing to do meanwhile.\n\n' "$retry_at" "$outages"
                  cat "$RUNNER_TEMP/diagnosis.md"
                } > "$RUNNER_TEMP/body.md"
                say "outage ${SHA:0:12}" "$RUNNER_TEMP/body.md"
                exit 0
              fi
              {
                if [ "$outages" -le 3 ]; then
                  printf 'CI could not do its checks on this commit: GitHub or a download host did not answer (an outage, not this update), and outage-retry.yml could not be started to run it again later. '
                else
                  printf 'CI failed on this commit %s times, each time because GitHub or a download host did not answer (an outage, not this update). ' "$outages"
                fi
                printf 'Nothing here needs changes for it: once GitHub answers again (https://www.githubstatus.com), start CI on this branch (Actions, CI, Run workflow); that run decides.\n\n'
                cat "$RUNNER_TEMP/diagnosis.md"
              } > "$RUNNER_TEMP/body.md"
              say "outage stuck ${SHA:0:12}" "$RUNNER_TEMP/body.md"
              exit 0
            fi

            # A second try, in case a test was flaky: a new CI run on this commit, which decides.
            # (A re-run of this one would be started by this workflow's token, and its end
            # would reach no workflow.) Not when this is the second try already: an earlier
            # CI run on this commit failed (other than on an outage), or someone ran this one
            # again.
            again=0
            if [ "$RUN_ATTEMPT" != 1 ] || [ "$earlier" != 0 ]; then
              again=1
            elif gh workflow run ci.yml --ref "$BRANCH"; then
              echo 'Started CI once more on this commit; that run decides.'
              exit 0
            else
              echo 'CI could not be started once more; this run decides.'
            fi

            # Red twice on an update pull request: the new version most likely needs changes to
            # the code here, which no rerun or rebase brings (the owner's call, 2026-10-20). The
            # pull request is parked with the label hold (unless it has it already: one the owner
            # set stays his, see "CI passed"), and one issue "Migration: <what> <version>" holds
            # the diagnosis and what to do. Found again by the marker in its body (or an open one
            # with the same title, which it takes over), it is edited in place when CI fails twice
            # again, so it sends no new email. Sets $migration to its number.
            # shellcheck disable=SC2016 # backticks are Markdown
            migrate() {
              local what slug updates count group list park take rerun found
              case $kind in
                pnpm|node|ublock|players|security|patched)
                  # The title less its prefix: "pnpm 12.15.0", "Node.js 26", "hls.js 1.7.4".
                  what=$(jq -r '.title | sub("^(Toolchain update|Patched library update): "; "")' <<< "$pr")
                  slug=$what
                  rerun="**Update branch** on #$number"
                  park="closing #$number skips this version for good; the next one comes as a pull request of its own"
                  if [ "$kind" = patched ]; then take=patched-libraries.yml; else take=toolchain-updates.yml; fi
                  take="$take closes #$number"
                  # One rolling pull request: rebuilt in place, never replaced by another.
                  if [ "$kind" = players ]; then
                    park="closing #$number skips this set of versions; the next set comes as a pull request of its own"
                    take="toolchain-updates.yml rebuilds #$number on it at its next run"
                  fi
                  if [ "$kind" = security ]; then
                    park="closing #$number without merging hands its alerts back to you as issues"
                    take="security-alerts.yml rebuilds #$number on it at its next daily run"
                  fi
                  ;;
                *)
                  # What Dependabot's newest commit updates, "<name> <version>" a line, from the
                  # metadata at the end of its message (a scoped name comes in double quotes).
                  gh pr view "$number" --json commits > "$RUNNER_TEMP/commits.json"
                  jq -r '[.commits[] | select([.authors[].login] | all(. == "dependabot[bot]"))] | last | .messageBody // ""' \
                    "$RUNNER_TEMP/commits.json" > "$RUNNER_TEMP/meta.txt"
                  updates=$(awk '/^- dependency-name: / {n = substr($0, 20)}
                    /^  dependency-version: / && n != "" {print n " " substr($0, 23); n = ""}' "$RUNNER_TEMP/meta.txt" | tr -d "\"'")
                  count=$(grep -c . <<< "$updates" || true)
                  group=$(sed -n 's/^  dependency-group: //p' "$RUNNER_TEMP/meta.txt" | head -n 1)
                  park="\`@dependabot ignore this major version\` on #$number parks it: Dependabot closes it and raises no more of that major until you take it up"
                  if [ "$count" = 1 ]; then
                    what=$updates
                    slug=$updates
                  elif [ "$count" -gt 1 ]; then
                    list=$(head -n 3 <<< "$updates" | awk 'NR > 1 {printf ", "} {printf "%s", $0}')
                    if [ "$count" -gt 3 ]; then list="$list and $((count - 3)) more"; fi
                    what="${group:-several packages} ($list)"
                    slug="${group:-update}-${SHA:0:8}"
                    park="\`@dependabot ignore <dependency name> major version\` on #$number parks the package that breaks: Dependabot closes #$number, raises no more of that major until you take it up, and brings the rest of the group again on its next run"
                  else
                    what=${BRANCH#dependabot/*/}
                    slug=$what
                  fi
                  rerun="\`@dependabot rebase\` on #$number"
                  take="Dependabot closes or rebases #$number on its own"
                  ;;
              esac
              slug=$(tr '[:upper:]' '[:lower:]' <<< "$slug" | sed -E 's/[^a-z0-9.]+/-/g; s/^-+//; s/-+$//' | cut -c1-60)
              if ! jq -e '.labels | any(.name == "hold")' <<< "$pr" > /dev/null; then
                gh label create hold --color d4c5f9 --description 'Update PRs: not merged while this label is on' > /dev/null 2>&1 || true
                gh pr edit "$number" --add-label hold > /dev/null
              fi
              {
                printf 'CI failed twice on #%s (%s): the new version most likely needs changes to the code here, which no rerun or rebase brings. #%s is labelled `hold` meanwhile.\n\n' \
                  "$number" "$(jq -r .title <<< "$pr")" "$number"
                printf '### What failed\n\n'
                cat "$RUNNER_TEMP/diagnosis.md"
                printf '\n### What to do\n\n'
                printf '1. On a branch of its own off `main`, `migrate/%s`, an agent session or you change the code for %s, with a test that pins the new behaviour, and open a pull request for it. If `main` fails as well (above), fix that first.\n' "$slug" "$what"
                printf '2. Once that is merged: if it took the new version itself, %s; otherwise %s runs its CI again.\n' "$take" "$rerun"
                printf '3. CI passing on #%s closes this issue and takes off the `hold` label it set; #%s is then reported on as every update is.\n\n' "$number" "$number"
                printf 'Meanwhile, %s.\n\n' "$park"
                printf 'This issue closes itself once CI passes on #%s, or once #%s is merged or closed (checked daily).\n\n<!-- migration-pr: %s -->\n' "$number" "$number" "$number"
              } > "$RUNNER_TEMP/migration.md"
              gh issue list --state open --limit 200 --json number,title,body,author \
                --jq '[.[] | select(.author.login == "app/github-actions" and (.title | startswith("Migration: ")))]' \
                > "$RUNNER_TEMP/migrations.json"
              found=$(jq -r --arg m "<!-- migration-pr: $number -->" --arg t "Migration: $what" \
                '([.[] | select((.body // "") | contains($m))] + [.[] | select(.title == $t)])[0].number // empty' \
                "$RUNNER_TEMP/migrations.json")
              if [ -n "$found" ]; then
                gh issue edit "$found" --title "Migration: $what" --body-file "$RUNNER_TEMP/migration.md" > /dev/null
                migration=$found
              else
                migration=$(gh issue create --title "Migration: $what" --body-file "$RUNNER_TEMP/migration.md")
                migration=${migration##*/}
              fi
            }
            migration=''
            # Not when a failed job left no log (a runner that was lost): nothing says the update
            # broke anything.
            if [ "$again" = 1 ] && [ "$kind" != other ] && [ "$verdict" != unknown ]; then migrate; fi

            # shellcheck disable=SC2016
            {
              if [ "$again" = 1 ]; then
                printf 'CI fails on this pull request. It failed twice on this commit, so a flaky test is an unlikely cause.\n\n'
              else
                printf 'CI fails on this pull request (%s).\n\n' "$CONCLUSION"
              fi
              cat "$RUNNER_TEMP/diagnosis.md"
              if [ -n "$migration" ]; then
                printf '\nThe new version most likely needs changes to the code here: this pull request is labelled `hold`, and #%s says what to do.\n' "$migration"
              elif [ "$again" = 1 ] && [ "$verdict" = unknown ]; then
                printf '\nA failed job left no log to read (its runner was lost, or GitHub did not hand the log out), so this is not taken for an update that needs code changes. Start CI on this branch again (Actions, CI, Run workflow) to see.\n'
              fi
              printf '\nThe pull request stays open. A new commit on it runs CI again.\n'
              hint
            } > "$RUNNER_TEMP/body.md"
            gh label create "$LABEL" --color B60205 --description 'CI fails on this update; see the comment' --force > /dev/null
            gh pr edit "$number" --add-label "$LABEL" > /dev/null
            say "$key" "$RUNNER_TEMP/body.md"
            exit 0
          fi

          # --- CI passed.
          if jq -e --arg l "$LABEL" '.labels | any(.name == $l)' <<< "$pr" > /dev/null; then
            gh pr edit "$number" --remove-label "$LABEL" > /dev/null
          fi
          # A migration issue opened above, when CI had failed twice, is done: CI passes now.
          gh issue list --state open --limit 200 --json number,title,body,author \
            --jq ".[] | select(.author.login == \"app/github-actions\" and (.title | startswith(\"Migration: \")) and ((.body // \"\") | contains(\"<!-- migration-pr: $number -->\"))) | .number" \
            > "$RUNNER_TEMP/migrated.txt"
          while read -r issue; do
            # Closed meanwhile (by hand, or the daily watch): no reason to stop deciding.
            gh issue close "$issue" --reason completed --comment "CI passes on #$number now ($RUN_URL). Closing." ||
              echo "::warning::Could not close #$issue (closed meanwhile?)."
          done < "$RUNNER_TEMP/migrated.txt"
          # The hold label, the owner's own "not yet", whatever else holds. One this workflow set
          # when CI failed twice (the last to add it was github-actions[bot]) only parked the pull
          # request while it was red: it comes off. When that cannot be read, it stays.
          held=0
          if jq -e '.labels | any(.name == "hold")' <<< "$pr" > /dev/null; then
            held=1
            by=$(gh api --paginate "repos/$GH_REPO/issues/$number/events?per_page=100" \
              --jq '.[] | select(.event == "labeled" and .label.name == "hold") | .actor.login' | tail -n 1) || by=''
            if [ "$by" = 'github-actions[bot]' ]; then
              gh pr edit "$number" --remove-label hold > /dev/null
              echo 'Took off the hold label this workflow set while CI failed.'
              held=0
            fi
          fi

          # The "Review dependency changes" check on a commit: "success" when a run of it passed,
          # "missing" when there is none, else the newest run's conclusion (the API lists them
          # in no stated order). A run still going ("pending") and a failed request are asked
          # again for up to 5 minutes; a request that keeps failing gives "unreadable".
          review_of() {
            local review=missing
            if [ -z "$1" ]; then echo missing; return; fi
            for _ in $(seq 10); do
              review=$(gh api "repos/$GH_REPO/commits/$1/check-runs?check_name=Review%20dependency%20changes" \
                --jq '[.check_runs[] | {id, c: (.conclusion // "pending")}] |
                  if any(.c == "success") then "success" elif length == 0 then "missing" else max_by(.id).c end') ||
                review=unreadable
              if [ "$review" != pending ] && [ "$review" != unreadable ]; then break; fi
              sleep 30
            done
            echo "$review"
          }

          # What to look at before merging, if anything. None: it is ready to merge.
          reasons=()
          if [ "$held" = 1 ]; then
            reasons+=('it is labelled hold')
          fi
          case $kind in
            dependabot|actions|docker) bot='dependabot[bot]' ;;
            pnpm|node|ublock|players|security|patched) bot='github-actions[bot]' ;;
            *) reasons+=("branch $BRANCH is not one this workflow checks") ;;
          esac
          if [ "$kind" = actions ] && [ -z "${MERGE_TOKEN:-}" ]; then
            reasons+=("it changes workflow files, whose branch this workflow's own token may not bring up to date: set the UPDATE_PRS_TOKEN secret (docs/maintenance.md, \"A token for workflow updates\"), or use Update branch here before merging")
          fi
          # The token that updates the branch: the owner's for workflow files.
          update_token=$GH_TOKEN
          if [ "$kind" = actions ] && [ -n "${MERGE_TOKEN:-}" ]; then
            update_token=$MERGE_TOKEN
            # An expired or revoked token would fail the update, and this run with it, over and
            # over: a reason on the pull request says so instead.
            if ! GH_TOKEN=$MERGE_TOKEN gh api "repos/$GH_REPO" --jq .full_name > /dev/null 2>&1; then
              reasons+=('the UPDATE_PRS_TOKEN secret does not work (expired, revoked, or without access to this repository): renew it (docs/maintenance.md, "A token for workflow updates")')
            fi
          fi
          # patched/<name>-<version>: a step from the version main's package.json holds (the
          # one the patch is cut against). The name is the longest of main's dependencies the
          # branch starts with. Anything that cannot be told (a name main has not, a version
          # that does not parse, the version main has) waits.
          if [ "$kind" = patched ]; then
            gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/package.json?ref=main" \
              > "$RUNNER_TEMP/package.main.json"
            rest=${BRANCH#patched/}
            library=''
            version=''
            while IFS= read -r name; do
              case $rest in
                "$name"-[0-9]*)
                  if [ "${#name}" -gt "${#library}" ]; then library=$name; version=${rest#"$name"-}; fi ;;
              esac
            done < <(jq -r '(.dependencies // {}) + (.devDependencies // {}) | keys[]' "$RUNNER_TEMP/package.main.json")
            current=$(jq -r --arg n "$library" '(.dependencies // {}) + (.devDependencies // {}) | .[$n] // ""' \
              "$RUNNER_TEMP/package.main.json")
            semver='^[0-9]+\.[0-9]+\.[0-9]+$'
            if [ -z "$library" ]; then
              reasons+=("$BRANCH names no library of main's package.json")
            elif ! [[ $version =~ $semver ]] || ! [[ $current =~ $semver ]]; then
              reasons+=("$library $current -> $version cannot be read as a version step")
            elif [ "$version" = "$current" ]; then
              reasons+=("main has $library $current already")
            fi
          fi
          # A patched-library or override pull request changes the lockfile, and its own
          # pull_request runs wait for an approval, so patched-libraries.yml and
          # security-alerts.yml start the dependency review on the branch, next to CI. A review
          # that did not pass is named.
          if [ "$kind" = patched ] || [ "$kind" = security ]; then
            review=$(review_of "$SHA")
            if [ "$review" != success ]; then reasons+=("its dependency review (\"Review dependency changes\", started on this branch) is $review"); fi
          fi
          if [ ${#reasons[@]} = 0 ]; then
            if [ "$(jq -r .isDraft <<< "$pr")" = true ]; then reasons+=('it is a draft'); fi
            if [ "$(jq -r .baseRefName <<< "$pr")" != main ]; then reasons+=('it does not target main'); fi
            if [ "$author" != "app/${bot%\[bot\]}" ]; then reasons+=("$author opened it, not $bot"); fi
            gh pr view "$number" --json files,commits > "$RUNNER_TEMP/pr.json"
            # gh pr view reads at most 100 files and 100 commits (measured on gh 2.101: a pull
            # request of 789 files and 217 commits gave 100 of each). One with more is not seen
            # whole by the checks below, so a person looks at it.
            # Unreadable counts leave both empty, and the pull request waits.
            read -r all_files all_commits < <(gh api "repos/$GH_REPO/pulls/$number" --jq '"\(.changed_files) \(.commits)"') || true
            if [ -z "${all_commits:-}" ] || [ "$all_files" -gt "$(jq '.files | length' "$RUNNER_TEMP/pr.json")" ] ||
               [ "$all_commits" -gt "$(jq '.commits | length' "$RUNNER_TEMP/pr.json")" ]; then
              reasons+=("it has ${all_files:-?} changed files and ${all_commits:-?} commits, more than this workflow reads at once (100 of each): a person checks it")
            fi
            # Its own commits, and the merges of main that "Update branch" makes here (the
            # owner's, when made with their token). A commit's author login is GitHub's mapping
            # of its e-mail, which anyone who can push may write into a commit (#170). Where
            # GitHub signs the commit, the signature is checked as well: Dependabot's commits
            # and the merges GitHub makes for "Update branch" (committer web-flow) are
            # verified, a commit pushed with git under their e-mail is not. Commits this
            # repository's workflows push (toolchain, patched) are not signed, so for
            # those the login is all there is.
            gh api --paginate "repos/$GH_REPO/pulls/$number/commits?per_page=100" \
              --jq '.[] | select(.commit.verification.verified == true) | .sha' > "$RUNNER_TEMP/verified.txt"
            others=$(jq -r --arg bot "$bot" --arg owner "$OWNER" --rawfile verified "$RUNNER_TEMP/verified.txt" '
              ($verified | split("\n")) as $signed | .commits[] | select(
                (([.authors[].login] | all(. == $bot)) and ($bot != "dependabot[bot]" or (.oid | IN($signed[])))) or
                (([.authors[].login] | all(. == "github-actions[bot]" or . == $owner)) and (.messageHeadline | startswith("Merge branch '"'"'main'"'"' into ")) and (.oid | IN($signed[])))
                | not) | .oid' "$RUNNER_TEMP/pr.json")
            if [ -n "$others" ]; then reasons+=("it has commits from someone else ($(cut -c1-8 <<< "$others" | tr '\n' ' ' | sed 's/ $//')): read those before merging"); fi
            # What each kind of update changes, and nothing else.
            case $kind in
              patched)
                # What patched-libraries.yml's re-cut commits.
                files=$(jq -r '.files[].path | select(. != "package.json" and . != "pnpm-lock.yaml" and
                  . != "pnpm-workspace.yaml" and . != "tools/sync-vendor.mjs" and (startswith("patches/") | not))' "$RUNNER_TEMP/pr.json")
                only='what a patch re-cut changes' ;;
              node)
                files=$(jq -r '.files[].path | select(. != ".nvmrc")' "$RUNNER_TEMP/pr.json")
                only='.nvmrc' ;;
              ublock)
                files=$(jq -r '.files[].path | select(. != "tools/setup-dev-profile.mjs")' "$RUNNER_TEMP/pr.json")
                only='tools/setup-dev-profile.mjs' ;;
              players)
                files=$(jq -r '.files[].path | select(. != "tests/e2e/live-specs/player-libraries.json")' "$RUNNER_TEMP/pr.json")
                only='tests/e2e/live-specs/player-libraries.json' ;;
              security)
                files=$(jq -r '.files[].path | select(. != "pnpm-workspace.yaml" and . != "pnpm-lock.yaml")' "$RUNNER_TEMP/pr.json")
                only='pnpm-workspace.yaml and pnpm-lock.yaml' ;;
              actions)
                files=$(jq -r '.files[].path | select((startswith(".github/workflows/") or startswith(".github/actions/")) | not)' "$RUNNER_TEMP/pr.json")
                only='workflow and action files' ;;
              docker)
                files=$(jq -r '.files[].path | select(. != ".github/actionlint/Dockerfile" and . != ".github/zizmor/Dockerfile")' "$RUNNER_TEMP/pr.json")
                only='the actionlint and zizmor Dockerfiles' ;;
              *)
                if [ "$fsa" = 1 ]; then
                  files=$(jq -r '.files[].path | select(. != "fsaunpack/package.json" and . != "fsaunpack/package-lock.json")' "$RUNNER_TEMP/pr.json")
                  only='fsaunpack/package.json and fsaunpack/package-lock.json'
                else
                  files=$(jq -r '.files[].path | select(. != "package.json" and . != "pnpm-lock.yaml")' "$RUNNER_TEMP/pr.json")
                  only='package.json and pnpm-lock.yaml'
                fi ;;
            esac
            if [ -n "$files" ]; then reasons+=("it changes $(tr '\n' ' ' <<< "$files" | sed 's/ $//'), not only $only"); fi
            if [ "$kind" = dependabot ] || [ "$kind" = actions ] || [ "$kind" = docker ]; then
              # Dependency review runs on Dependabot's own push (a pull_request event), not on
              # a run this workflow starts: the newest Dependabot commit's review counts.
              reviewed=$(jq -r '[.commits[] | select([.authors[].login] | all(. == "dependabot[bot]")) | .oid] | last // ""' "$RUNNER_TEMP/pr.json")
              review=$(review_of "$reviewed")
              if [ "$review" != success ]; then reasons+=("Dependabot's dependency review is $review"); fi
            fi
            # A shipped library's major: Dependabot names the libraries in its commit message
            # (dependency-name), and main's .github/dependabot.yml names the shipped ones, in the
            # patterns of its shipped-minor-and-patch group.
            if [ "$kind" = dependabot ] && [ "$ships" = 0 ] && [ "$fsa" = 0 ]; then
              shipped=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/.github/dependabot.yml?ref=main" |
                awk '/^[[:space:]]*shipped-minor-and-patch:[[:space:]]*$/ {f = 1; next} f && /^[[:space:]]*patterns:/ {print; exit}' |
                grep -oE "'[^']+'" | tr -d "'" || true)
              # A scoped name comes in double quotes.
              updated=$(jq -r '.commits[].messageBody' "$RUNNER_TEMP/pr.json" | sed -n 's/^- dependency-name: //p' | tr -d "\"'" | sort -u)
              if [ -n "$shipped" ] && [ -n "$updated" ] && grep -qxF -f <(printf '%s\n' "$shipped") <<< "$updated"; then
                ships=1
              fi
            fi
            if [ "$kind" = pnpm ]; then
              # The same major or the next (tools/check-toolchain.mjs). Should that pnpm want
              # the lockfile rewritten, CI fails at the frozen install, and the pull request waits.
              version=${BRANCH#toolchain/pnpm-}
              # The one change toolchain-updates.yml makes: packageManager, to the branch's
              # version. The lockfile stays as it is (CI installed it frozen with this pnpm);
              # any other change is not routine. Against the merge base, so a main that moved on
              # since does not count.
              merge_base=$(gh api "repos/$GH_REPO/compare/main...$SHA" --jq .merge_base_commit.sha)
              raw() { gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/package.json?ref=$1"; }
              raw "$merge_base" | jq -S 'del(.packageManager)' > "$RUNNER_TEMP/package.base.json"
              raw "$SHA" > "$RUNNER_TEMP/package.head.json"
              if [ "$(jq -r '.packageManager // ""' "$RUNNER_TEMP/package.head.json")" != "pnpm@$version" ] ||
                 ! jq -S 'del(.packageManager)' "$RUNNER_TEMP/package.head.json" | cmp -s - "$RUNNER_TEMP/package.base.json"; then
                reasons+=("its package.json changes more than packageManager to pnpm@$version")
              fi
              if jq -e 'any(.files[].path; . == "pnpm-lock.yaml")' "$RUNNER_TEMP/pr.json" > /dev/null; then
                reasons+=('it changes pnpm-lock.yaml, which a pnpm update does not')
              fi
            fi
          fi

          # What must not ship: CI's builds against the latest release's, as auto-release.yml
          # compares them (the firefox-github zip with its zip, the AMO build with the signed
          # xpi minus Mozilla's META-INF/: a change to the AMO build alone ships too, #164),
          # with manifest.json's version left out; nothing else may differ. An
          # update that ships is meant to differ, and the comment below says so.
          # Only a branch that holds main is compared: one behind it lacks what main shipped
          # since, and that would count as its own change (#95 waited on 2026-09-30 for 33
          # "differences" that were #93-#97's). The update below brings it up to main, and
          # CI on the updated branch compares again.
          behind_main=$(gh api "repos/$GH_REPO/compare/$SHA...main" --jq .ahead_by)
          if [ ${#reasons[@]} = 0 ] && [ "$ships" = 0 ] && [ "$behind_main" = 0 ]; then
            tag=$(gh release view --json tagName --jq .tagName 2> /dev/null || true)
            new=$RUNNER_TEMP/new
            old=$RUNNER_TEMP/old
            # unpack <zip> <dir>: a build's files, without a signature and its manifest's version.
            # (unzip -d makes only the last folder of its path, so files/ is made first.)
            unpack() {
              unzip -q "$1" -d "$2" && rm -rf "$2/META-INF" &&
                jq 'del(.version)' "$2/manifest.json" > "$2.manifest" && mv "$2.manifest" "$2/manifest.json"
            }
            if [ -n "$tag" ] &&
               gh run download "$RUN_ID" --name faststream-bundles --dir "$new/zip" &&
               gh release download "$tag" --pattern 'firefox-github-*.zip' --pattern '*.xpi' --dir "$old/zip" &&
               mkdir -p "$new/files" "$old/files" &&
               unpack "$new"/zip/firefox-github-*.zip "$new/files/github" &&
               unpack "$old"/zip/firefox-github-*.zip "$old/files/github" &&
               unpack "$new"/zip/firefox-amo-*.zip "$new/files/amo" &&
               unpack "$old"/zip/*.xpi "$old/files/amo"; then
              if ! diff -rq "$old/files" "$new/files" > "$RUNNER_TEMP/changes.txt"; then
                cat "$RUNNER_TEMP/changes.txt"
                count=$(wc -l < "$RUNNER_TEMP/changes.txt")
                reasons+=("it changes what the extension ships ($count difference(s) from $tag, e.g. $(head -n 1 "$RUNNER_TEMP/changes.txt" | sed "s|$RUNNER_TEMP/||g")): merging releases it to Firefox")
              fi
            else
              reasons+=('its build could not be compared with the latest release')
            fi
          fi

          # The branch moved on while this ran (Dependabot rebased it, say): that commit's own
          # CI run decides, so an update refused for it is no failure.
          # Or it was merged or closed meanwhile (a newer version replaced it, say): nothing to do.
          head_moved() {
            local now
            now=$(gh pr view "$number" --json state,headRefOid --jq '"\(.state) \(.headRefOid)"')
            if [ "${now%% *}" != OPEN ]; then
              echo "The pull request is ${now%% *} meanwhile: nothing to do."
              exit 0
            fi
            if [ "${now#* }" != "$SHA" ]; then
              echo "The branch moved on to ${now:5:8} meanwhile: that commit's CI run decides."
              exit 0
            fi
          }

          if [ ${#reasons[@]} = 0 ]; then
            # Mergeable, and holding main: what he merges is then exactly what CI tested.
            state=UNKNOWN
            for _ in $(seq 10); do
              state=$(gh pr view "$number" --json mergeable --jq .mergeable)
              if [ "$state" != UNKNOWN ]; then break; fi
              sleep 6
            done
            behind=$(gh api "repos/$GH_REPO/compare/$SHA...main" --jq .ahead_by)
            if [ "$state" = CONFLICTING ]; then
              reasons+=('it conflicts with main')
            elif [ "$state" != MERGEABLE ]; then
              reasons+=("GitHub cannot say whether it merges ($state)")
            elif [ "$behind" != 0 ]; then
              updates=$(jq '[.commits[] | select(.messageHeadline | startswith("Merge branch '"'"'main'"'"' into "))] | length' "$RUNNER_TEMP/pr.json")
              if [ "$updates" -ge 3 ]; then
                reasons+=("main moved on $updates times while CI ran on it")
              else
                echo "The branch is $behind commit(s) behind main: updating it, then CI runs again and decides."
                if ! GH_TOKEN=$update_token gh api -X PUT "repos/$GH_REPO/pulls/$number/update-branch" -f "expected_head_sha=$SHA" > /dev/null; then
                  head_moved
                  exit 1
                fi
                head=$SHA
                pr_state=OPEN
                for _ in $(seq 24); do
                  sleep 5
                  read -r pr_state head < <(gh pr view "$number" --json state,headRefOid --jq '"\(.state) \(.headRefOid)"')
                  if [ "$pr_state" != OPEN ] || [ "$head" != "$SHA" ]; then break; fi
                done
                # Merged or closed while its update was awaited (#444: the owner merged it, and
                # the branch was deleted): nothing is left to decide, and that is no failure.
                if [ "$pr_state" != OPEN ]; then
                  echo "#$number was ${pr_state,,} meanwhile: nothing left to decide."
                  exit 0
                fi
                if [ "$head" = "$SHA" ]; then
                  echo "The branch did not move within two minutes of the update." >&2
                  exit 1
                fi
                # A push with the owner's token starts CI on its own; this token's starts none.
                if [ "$update_token" = "$GH_TOKEN" ]; then gh workflow run ci.yml --ref "$BRANCH"; fi
                # Nothing starts the live suite on a push: it is started here whoever pushed.
                if [ "$kind" = players ]; then gh workflow run live-streams.yml --ref "$BRANCH"; fi
                # Nor the dependency review that decides an override pull request.
                if [ "$kind" = security ]; then gh workflow run dependency-review.yml --ref "$BRANCH"; fi
                exit 0
              fi
            fi
          fi

          # --- The player libraries: CI does not play them, the live suite (live-streams.yml) does,
          # so it must have passed on this very commit too. Asked last, once everything else holds
          # and the branch holds main: a run started earlier would be for a head about to be
          # replaced. Its run ends in live-streams.yml's hand-off, which starts this workflow again.
          # One still going (any status but completed) is never started again: a second dispatch
          # on the branch cancels it (live-streams.yml's concurrency). A cancelled or timed-out one
          # is started again only while the commit has fewer than two, so one that always times
          # out cannot loop.
          # Runs that cannot be listed are a reason, not this run's end: the live suite's hand-off
          # may have been the last thing to start this workflow for the commit. A run that never ran
          # does not count: the pull_request runs of a pull request this repository's token opened
          # wait for an approval (action_required), and come after the runs started on its branch.
          if [ "$kind" = players ] && [ ${#reasons[@]} = 0 ] &&
             ! gh run list --workflow live-streams.yml --commit "$SHA" --limit 50 --json databaseId,status,conclusion,url \
                 --jq '[.[] | select(.conclusion != "action_required" and .conclusion != "skipped")] | sort_by(.databaseId) | reverse' \
                 > "$RUNNER_TEMP/live.json"; then
            reasons+=('its live suite runs (live-streams.yml) could not be listed: run Update PRs again on this branch, with the CI run above')
          fi
          if [ "$kind" = players ] && [ ${#reasons[@]} = 0 ]; then
            live_runs=$(jq length "$RUNNER_TEMP/live.json")
            live_status=$(jq -r '.[0].status // ""' "$RUNNER_TEMP/live.json")
            live_conclusion=$(jq -r '.[0].conclusion // ""' "$RUNNER_TEMP/live.json")
            live_url=$(jq -r '.[0].url // ""' "$RUNNER_TEMP/live.json")
            start_live() {
              if gh workflow run live-streams.yml --ref "$BRANCH"; then
                reasons+=('its live suite (live-streams.yml), which plays these libraries in Firefox, was started on it just now: its end decides again')
              else
                reasons+=('its live suite (live-streams.yml) has not run on it, and could not be started: start it from the Actions tab on this branch; its end decides again')
              fi
            }
            if [ "$live_runs" = 0 ]; then
              start_live
            elif [ "$live_status" != completed ]; then
              reasons+=("its live suite (live-streams.yml) is still running on it ($live_url): its end decides again")
            elif { [ "$live_conclusion" = cancelled ] || [ "$live_conclusion" = timed_out ]; } && [ "$live_runs" -lt 2 ]; then
              start_live
            elif [ "$live_conclusion" = cancelled ] || [ "$live_conclusion" = timed_out ]; then
              reasons+=("its live suite (live-streams.yml) ended $live_conclusion on it again ($live_url), after one start here: start it again from the Actions tab on this branch (its end decides again), or look at where it stopped")
            elif [ "$live_conclusion" != success ]; then
              reasons+=("its live suite (live-streams.yml) ended $live_conclusion on it ($live_url): a public stream or site the suite uses may be down, or a library no longer plays as its page expects. Run it again (its end decides again), or look at the failed case in its log")
            fi
          fi

          # --- Hand over. Nothing merges itself: the comment says whether it is ready.
          # Merged or closed while this ran: a verdict on it would be noise. Moved on (Dependabot
          # rebased it during the build comparison, say): "ready to merge" would stand on the new
          # commit, which no check here has seen; its own CI run decides (review of 2026-10-14).
          head_moved
          key=look
          if [ ${#reasons[@]} = 0 ]; then key=ready; fi
          # shellcheck disable=SC2016
          {
            if [ "$key" = ready ]; then
              printf 'CI passes on this pull request (%s), and every check holds: **ready for you to merge**.\n\n' "$RUN_URL"
              if [ "$ships" = 1 ]; then
                printf 'It changes what the extension ships: once you merge it, CI runs on main, and a green run there releases it to Firefox.\n'
              else
                printf 'Its build of the extension is file for file the one in %s, the version number aside: merging it releases nothing.\n' "${tag:-the latest release}"
              fi
            else
              printf 'CI passes on this pull request (%s). Look at this before merging:\n\n' "$RUN_URL"
              printf -- '- %s\n' "${reasons[@]}"
            fi
            printf '\n'
            hint
          } > "$RUNNER_TEMP/body.md"
          say "$key" "$RUNNER_TEMP/body.md"

      # Bot-started runs are emailed to no one, so a failure of this workflow itself would go
      # unseen: one issue while it is open, which the daily digest lists. A failure
      # while it is open adds a comment to it.
      - name: Report this workflow's own failure
        if: failure()
        env:
          TITLE: 'Update PRs workflow failed'
        run: |
          set -euo pipefail
          # A failure while the issue is open is a comment on it with this run's link, so the
          # issue shows each failure, not only the first. When the issues cannot be read, a
          # second issue is better than none.
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty') || number=''
          if [ -n "$number" ]; then
            printf 'Failed again: %s\n' "$SELF_URL" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          printf 'update-prs.yml failed while deciding on an update pull request: %s\n\nThat pull request is not reported on until this is fixed. The run log names the failed command. Close this issue once it is fixed; a later failure opens a new one.\n' \
            "$SELF_URL" > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"

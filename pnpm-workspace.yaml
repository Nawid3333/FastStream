overrides:
  # Dependabot #27/#14/#17/#19/#20/#18/#21: these devDependencies (web-ext's
  # firefox-profile, mocha's reporters, jswebm/archiver's lodash) pin older
  # transitive versions than what upstream has since patched. None of these ship
  # in the extension; forcing the patched versions here avoids waiting on those
  # maintainers to bump their own lockfiles.
  adm-zip: ^0.6.1
  lodash: ^4.18.1
  serialize-javascript: ^7.1.1
allowBuilds:
  geckodriver: true
  esbuild: true
  # wdio pulls edgedriver in for Edge sessions, which this project does not run; its
  # install script downloads a driver binary that nothing here would use.
  edgedriver: false
  onnxruntime-web: false
  core-js: false
  dtrace-provider: false
  protobufjs: false
  spawn-sync: false
minimumReleaseAgeExclude:
  - "@wdio/cli@9.31.6"
  - "@wdio/config@9.31.6"
  - "@wdio/local-runner@9.31.6"
  - "@wdio/mocha-framework@9.31.6"
  - "@wdio/runner@9.31.6"
  - "@wdio/utils@9.31.6"
  - create-wdio@9.31.6
  - webdriver@9.31.6
  - webdriverio@9.31.6
  - hls.js@1.7.3
patchedDependencies:
  Coloris@0.25.0: patches/Coloris@0.25.0.patch
  dashjs@5.1.0: patches/dashjs@5.1.0.patch
  gif.js@0.2.0: patches/gif.js@0.2.0.patch
  hls.js@1.7.3: patches/hls.js@1.7.3.patch
  jswebm@0.1.2: patches/jswebm@0.1.2.patch
  mp4box@0.5.3: patches/mp4box@0.5.3.patch
  sweetalert2@11.26.25: patches/sweetalert2@11.26.25.patch
